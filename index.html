The story runs from an English boarding school to a small kingdom in the Himalayas, and it takes about three days inside the book. It has four big ideas inside it, and they all come back at the end: *friendship*, *fear*, *luck*, and *what is really valuable*. Keep those four in your head while you read.`},

{t:"Who is who", x:`**Tom** - the narrator's friend and the character we follow. English, tall, with fair hair and blue eyes. He cannot ride a horse, he has never been higher than sea level, and he is the one who has to be brave by the end.

**Mahir** - Tom's best friend at school. Black hair, dark brown eyes. He is the **Crown Prince** of the Kingdom of the Snow Leopard, though he does not advertise it. From the age of four he spent seven years in a Buddhist **monastery** in the Himalayas. He is calm, strong, and never shows anger.

**Tara** - Mahir's sister, about fifteen. Slim, with long straight shiny black hair. She makes the masks, she shoots in the archery competition, and she is braver than Tom expects.

**The King** - Mahir and Tara's father. He limits the kingdom to 5,000 tourists a year because he is afraid of losing the culture. He never gets angry. His answer at the end of the book is the point of the whole story.

**Jake** - the man with the **scar** that runs from the corner of his left eye to the corner of his mouth. Tall, thin, bald, brown eyes. He is a **journalist** living in North America who has written many articles about the Kingdom.

**Cornelius** - a classmate at school. Mean, clever and witty. He laughs at Mahir's 'weird country' and asks about **yetis**. He never appears again, but Tom remembers him twice, which tells you what Tom is really thinking about.

**The old monk** - Mahir's teacher at the monastery, and later the monk who answers Jake at the end.`},

{t:"Two boys at school", x:`Tom and Mahir are at an expensive **boarding school** in the south of England. They met when they were eleven. Both were **homesick**, and they became friends on a bench under an oak tree.

From the start, Tom defends Mahir. Other boys laugh at Mahir's accent and the way he looks, and Tom tells them to stop. This matters: at the beginning of the book, Tom is the protector and Mahir is the one who needs protecting. By the end, that has turned completely around - and then turned around once more.

One day a man photographs the two boys through the school gates. He is tall, thin and bald, with brown eyes and a long **scar** from the corner of his left eye to the corner of his mouth. Neither boy knows who he is.

Mahir then throws Tom in a **martial-arts** move. When Tom asks how he did it, Mahir says the most important line in his whole way of thinking:

*You should never hurt your **opponent**. You should only **block** him.*

Mahir explains where the strength comes from. From the age of four he spent seven years in a Buddhist monastery high in the Himalayas. An old monk taught him to **conquer** fear, to survive without food, to stay warm in freezing temperatures, and to fight and win without hurting anybody.

Cornelius, a mean and witty classmate, makes jokes about Mahir's 'weird country' and asks whether there are **yetis** there. Mahir does not get angry. He invites Tom home for the holidays instead.`},

{t:"The journey east", x:`Mahir wears a **gho**, the traditional robe, tied with a **kera**, a cloth belt. There is a golden **dragon** with red eyes on each sleeve. He has a sister and four younger brothers.

The boys fly British Airways to **Kathmandu**, and then change to a small Dragon Air plane with only 35 passengers, which flies past the **summit** of Everest. Tom has his own gho now, dark blue and gold.

At Kathmandu airport Tom sees the man with the scar again. The man boards their plane. When Tom tells Mahir, Mahir says something that should worry you:

*He wants something from me but I don't know what it is.*

They arrive to monks in orange robes, a red carpet, and **bracelets** of orange flowers, which are a symbol of happiness. There are no cars anywhere in the kingdom.

Tom tells the King about the man with the scar. The King's answer is short: *Mahir is safe here.* Remember it.`},

{t:"The palace, the masks, the legend", x:`Tara shows Tom to his room. The palace is built around three **courtyards**, and each one stands for one of the kingdom's values:

- the **Courtyard of the Sun** - happiness
- the **Courtyard of the Sky** - peace
- the **Courtyard of the Snow** - truth

Tara has made three masks for the **Golden Festival of Light**:

- a **golden dragon** for Mahir, which is customary for the King's eldest son
- a **snow leopard** for Tom - white, with silver spots and **emerald** green eyes
- **Princess Kia** for herself

Then Tara tells the **legend**. Princess Kia was a brave and wise **ancestor**. She rode to a castle about some stolen **yaks**, got lost in heavy snow, and her horse **stumbled**. She lost consciousness, and dreamed that a snow-white animal carried her on its back to the castle gates. When she woke she said: *The snow leopard saved my life.*

Since then the snow leopard has been the symbol of strength and courage, and people believe it rescues good people who are in danger. Tara jokes: *Let's hope that you don't have to rescue me tomorrow night.* Tom feels a cold **chill** and thinks: *Something bad is going to happen tomorrow night.*

That evening dinner is fiercely hot **chilli** food with **butter tea**. The King announces two things: an **archery** competition at 8 a.m., in which Tara will compete - the youngest competitor ever, with men and women competing together - and the festival at 7 p.m. at the **Castle of Snow**, high in the mountains, reached on horseback, leaving at one o'clock.`},

{t:"The archery competition", x:`Archery is the **national sport**, and Mahir wins the school competition every year.

The targets are three painted **dragons**: a black one with a blue eye, a red one with a golden eye, and a golden one with a red eye. Competitors must hit the golden eye of the red dragon first, then the red eye of the golden dragon. It is bad luck to hit the blue eye of the black dragon. Each competitor **fires** two arrows.

Tara walks confidently onto the field, **fires** her first arrow and hits the golden eye of the red dragon. The crowd **cheers**. Her second arrow hits the red eye of the golden dragon.

Then it is Mahir's turn. He looks cool and confident. His first arrow hits the golden eye of the red dragon and the crowd cheers. Then there is silence - his second arrow has hit the **blue eye of the black dragon**. Nobody moves. A nervous **whisper** passes through the crowd. Mahir's face goes pale and his hands **grip** the arms of his chair. He is still **staring** at the target when Tara runs onto the field and leads him off it.

The King says quietly: *Mahir has never hit the blue eye before.*

Tom wonders: *If he's never hit it before, why did he hit it today?* He has to wait until the end of the competition to find out. Tara wins. She is **awarded** a small statue of a golden dragon.

During the competition the King tells Tom who the man with the scar is: a **journalist** living in America who has written many articles about the kingdom. He has no **criminal record**, but he may be dangerous. Then the King says:

*Tom, Mahir's life could be in danger. You must tell me if he comes near my son again.*`},

{t:"Mahir's bad luck", x:`Tom can't find Mahir afterwards. Tara takes him to a small **walled** garden where Mahir is sitting on the grass under an orange tree. *He always comes here when he is **upset**,* she whispers.

Mahir **congratulates** Tara and hugs her. She says she learnt everything from him. Then he tells them to go and get ready for the festival without him: *I want to be alone for a while.* The King comes into the garden and says he will talk to his son.

Back in his room, Tom picks up the snow leopard mask and **traces** the **carved** wood and the emerald green eyes. He holds it to his face and looks in the mirror, and feels a sudden powerful **surge** of energy. His legs feel strong and he jumps higher and higher. *There is magic in this mask,* he thinks.

Then Mahir appears in the doorway wearing the golden dragon, and takes it off. His father told him a story and made him feel better.

Here is the story. Years ago, in his own first archery competition, the King also hit the blue eye, and he was also very **upset**. His father told him to think positive thoughts and the bad luck would go away. Nothing bad happened - until one day he rode into the mountains and a snowstorm turned into a **blizzard**. He got lost. He knew that if he stayed out all night he would die. Then he saw a piece of orange cloth in the snow, got off his horse, dug with his hands, and found the body of a monk. The monk was still alive. He put the monk on his horse, and an hour later found the castle.

The monk **survived** and came to live in the palace. The King says his own bad luck was the monk's good luck: he got lost, but he saved a life. And so he told Mahir:

*I will have bad luck, but it will bring good luck to someone else. And the good luck will be stronger than the bad.*

Hold on to that sentence. The whole ending depends on it.

Before they leave, Tom sees Tara in a silver **kira** decorated with tiny blue flowers made with beads, her hair threaded with silver beads. She jokes again: *Will you rescue me? Whatever the danger?* Tom promises.`},

{t:"The ride to the Castle of Snow", x:`Mahir rides a huge black **stallion** and pulls Tom up into the **saddle** behind him. The masks go in a bag hanging from the saddle. They **trot** out of the courtyard and then race the wind. Tom closes his eyes at first, then starts to enjoy the **speed**.

Tara **canters** past on a white horse, looking fearless. Tom thinks: *How could I ever rescue her? She'll probably have to rescue me.*

The road narrows into a **track**. Tom asks whether Mahir misses cars. Mahir's answer is a small lesson about England: traffic **jams**, **exhaust pipes**, 30 **mph**, **speed cameras**, and losing your licence if you are caught **speeding** three times. *I prefer being here. There are no traffic jams and you can ride as fast as you like.*

Tom tests him: *So if your dad gave you a red Ferrari for your 18th birthday, you would give it back?* There is a silence, and then Mahir laughs: *My father would never give me a Ferrari. But if he did, I would be the happiest boy on Earth.* It is the one moment where Mahir is just a teenager.

Then they turn a bend and Tom looks down into a deep **bottomless** **ravine** and feels an **adrenalin rush** like his first **roller-coaster**. They are 3,000 metres above sea level and climbing another 1,000 to the castle.

After two more hours of riding, with the castle always in sight and always far away, a sharp **twist** in the track opens onto a wide road. Two men on horseback, dressed from head to toe in gold, stand on either side of huge wooden gates. Inside there is a **blur** of rich colours, drums and pipes. They **dismount**, put on their masks, and walk through the stone archway.`},

{t:"The festival, and the mask that lies", x:`Everyone is wearing masks: tigers, horses, red and black dragons, heroes, demons, monkeys, birds. Even the monks in orange robes wear them.

Tara explains the meanings: the tiger is **strength**, the monkey is **wisdom**, the bird is **freedom**, the horse is **friendship**. Mahir adds the sentence that explains the whole kingdom:

*In your culture, you treat animals as **inferior**. You love them, but you don't think they've got anything to teach you. Here we respect them. We know that they have greater powers than we do. Animals listen to nature. They can **sense** things that humans can't.*

The King and Queen arrive and everybody bows. They are the only two people **not** wearing masks. *They come as themselves,* says Tara. *As the King and Queen, they symbolize the peace and happiness of our country.*

The first dance is a **sword** dance. Tom is confused - he thought people didn't fight with weapons here. Mahir explains that they don't: **swordsmanship** is an **art form**, and it requires skill and concentration. (Remember these swordsmen. They come back.)

The sun sets, the monks light **lanterns**, and the masks with their huge eyes look frightening in the flickering light. Tom turns to talk to Tara - and she is gone.

Then he sees metal on the stone floor: one of Tara's silver and **sapphire** dragon **earrings**. A hand lands on his shoulder. He stands up quickly and **sighs** with relief when he sees the golden dragon mask. *Oh, thank goodness, it's you, Mahir.*

*Come on,* says the figure. *We have to go.*

*Go where? Are you okay? Your voice sounds a bit strange.*

*Don't ask questions. Just follow me.* The **grasp** on Tom's arm is strong, and the fingers dig in.`},

{t:"The room by the stables", x:`The masked figure pulls Tom through the crowd and out of the castle. Outside there is a strong wind and it is **icy** cold. Tom can only see a few steps ahead. He can hear horses **neighing** in the stables and the wind **howling**.

The figure pushes open a wooden door. Somebody shines a torch in Tom's face. He is pushed into the room and the heavy door closes.

When his eyes get used to the light, Tom sees three other people. Near the doorway is a man with a **gun**. Sitting on the floor in the far corner are two people in masks - the golden dragon and Princess Kia.

The man behind him pulls off his golden dragon mask and laughs. *The perfect **disguise**. Only one person is allowed to wear the golden dragon mask.*

It is Jake, the man with the scar. Tom is tied up: arms behind his back, feet together, thick rope cutting into his wrists.

Mahir asks, with no anger or fear in his voice, what Jake wants.

*I want the **Shining Star**. You and your father are the only two people in the world who know where it is.*

Mahir offers a deal: let Tom and Tara go, and he will take Jake to it. Jake laughs. He has been watching Mahir for months and knows his powers - *with one tiny **flick** of your wrist you can **paralyze** me.* So the other two stay as **hostages**. If Jake doesn't return with the Shining Star, his friend will shoot them.

Mahir agrees, and warns him: *It is a dangerous journey. Are you prepared to **face** the dangers ahead?*

*I am prepared to face anything for the Shining Star.*

Nobody will miss them, Jake says - Princess Kia, the snow leopard and the golden dragon are still at the festival, because his friends are there in **identical** masks.

The short **stocky** man with the shaved head holds a gun to Tara's head while Jake cuts the ropes on Mahir's feet and arms. Before he goes, Mahir says to Tom:

*Remember, 'practice makes perfect'. Look after my sister for me.*

That sentence is an instruction, and Tom does not understand it yet.`},

{t:"The climb and the dagger", x:`Two things now happen at the same time, and the book cuts between them.

**On the mountain.** Mahir and Jake climb a steep path. Mahir knows every inch of it, but the falling snow has hidden his usual **footholds**, and Jake is not wearing climbing shoes - yet his feet never slip. *I could easily escape,* thinks Mahir, *but then, how could I rescue Tom and Tara?*

They rest in a small cave. Jake explains himself. He is a journalist who has written many articles about the kingdom; he once told a businessman in North America that he was an expert on it, and was invited to dinner. The man was Jack Sharpe, wearing a **scruffy** suit with **patches** on the elbows - one of the richest men in the world. Sharpe asked Jake to steal the diamond for him. Jake **refused**. Then he lost his job at the newspaper, became **redundant**, work was hard to find, and the chance to earn a huge fortune became more **attractive**. Finally he rang his friend and agreed.

Mahir looks into his eyes and says coldly: *I hope the diamond will not **disappoint** you. Now, we should go.* He stands up, walks out through the wall of white, and disappears. The **kidnapper** feels a **chill** that is not caused by the snow - it is **doubt**. Mahir has seen the evil of his own acts reflected back in the boy's eyes.

**In the room.** Tom and Tara watch the guard's eyes **droop**. He yawns. They yawn too, and a few moments later they hear the **thud** of the gun hitting the ground. The man is asleep.

*There's a **dagger** in the **pouch** at my waist,* whispers Tara. *It's only small, but it's very sharp. Try and get it.* It is a small golden dagger in a pouch hanging from the cloth belt around her waist. Tom **manoeuvres** himself closer and, after many attempts, gets the dagger out and passes it to her. They sit back to back and she slowly cuts the rope on his hands. It takes forever. The man is **snoring**, but he might wake up and shoot them.

Once free, Tom cuts the rope on his feet, stands up very carefully, and **creeps** towards the man. The man hears him and his eyes shoot open. But he doesn't see Tom - he sees a powerful animal with huge white **paws**, sharp white teeth, and green eyes gleaming in the firelight. It is a snow leopard.

The man **leaps** to his feet and pulls out a dagger.`},

{t:"The snow leopard", x:`The blade is pointed at Tom. Tom remembers Mahir's words: *If you believe you can do it, you will do it.*

He takes a step towards the man. Quickly, he grabs the man's arm - and the man **lunges** at him with the dagger. Tom moves **sideways**, but the blade cuts his arm. He expects to feel pain. He feels none.

*Concentrate,* he says to himself. *Concentrate.* Then he presses his finger firmly onto the man's shoulder.

The man feels the sharp **claws** of the leopard digging into his shoulder, and Tom feels his **limbs** **stiffen**. In one **swift** movement Tom twists and throws him over his shoulder, and hears the **thud** as the man hits the ground.

*Get up,* he shouts, and sees the look of horror on the man's face. *Move now,* says Tom, but the man lies still. *I've finally done it,* says Tom - and he throws the mask up into the air. The man watches as the snow leopard **leaps** over him and disappears from the room.

Tom runs over and unties Tara. The door is locked. Tom searches the man's clothes but can't find a key. *Stand back,* says Tara. She is **concentrating** hard. Then she leaps in the air and kicks the door with her foot. The heavy wooden door shakes but stays **firmly** shut. She leaps again and kicks it again. There is a huge cracking sound and the door flies outwards. An icy wind blows into the room.

*Wow. That was pretty cool,* says Tom.

They walk out into enormous **snowflakes** that **swirl** around them, **stinging** their faces. *But Mahir's life is still in danger.* They hold hands, follow the castle wall, and keep very close to it - one wrong foot and they could fall over 1,000 metres into the ravine.

Tom says something important as they go: *When that man brought me to the room, I walked next to him. I didn't know we were so close to the ravine.*

*Don't think about that now,* says Tara. *We **survived** and that's all that matters.*`},

{t:"Underground to the temple", x:`The castle courtyard is empty - everyone has gone inside to escape the snow. The guards are surprised to see Tara and Tom. She asks to be taken to her father immediately, and tells them that a man tried to kidnap them and is tied up in the room next to the stables.

The King is alone in a room like a library. When Tara tells him Mahir has been kidnapped, his face turns pale, but his voice stays calm. He asks the right questions: is it the journalist? Did he say why?

*He wants the Shining Star. Mahir is taking him to it.*

The King looks thoughtful, and then says: *Don't worry, Tara. I know where they're going. We can get there before them. They're going to the **Temple of the Moon**. It's at the top of this mountain. Mahir didn't come into the castle, so I think he has gone up the mountain path. It will take him about two hours in this weather.*

*We'll never catch up with them,* says Tom.

*There is an **underground passage** that leads from this castle up to the temple. It will only take us ten minutes.*

A guard comes in, the King gives him some instructions, and the guard bows and leaves. Tara and Tom insist on coming, and the King does not argue. He wants to get to the temple before Mahir shows Jake the Shining Star.

In the corridor a guard opens a door into a narrow passageway. In front of them is a line of men carrying lanterns, with huge swords hanging from their belts. They are the swordsmen from the festival.

*Nobody who knows of their skills would **dare** to challenge them,* says Tara. *And I think that journalist knows a lot about our kingdom.*

The narrow passage climbs steeply, and the journey up it is not easy.`},

{t:"The Shining Star", x:`At the other end is a room with a huge **domed** ceiling painted dark blue, decorated with hundreds of silver and gold stars. The moon is painted in the centre. The room is full of monks in orange robes, sitting on **mats** and **chanting**.

The chanting stops. A boy in orange robes runs towards them, his footsteps **echoing** on the stone floor. When he sees the King, he stops and bows before him.

*Take me to the Shining Star,* says the King.

The boy bows again and stands up. Tara walks towards her father. *You and Tom sit somewhere out of sight and wait for your brother to come,* the King tells her.

The boy and the King walk to the front of the temple and disappear behind a thick **embroidered** curtain. Tara and Tom sit down on mats with the monks, and Tara **gazes** up at the magnificent ceiling. *I've never been here before,* she says.

The swordsmen are now sitting on mats with the monks, too. The monks begin chanting again. Tara begins to chant. Tom sits in silence.

Suddenly a door at the front of the temple creaks open and two white figures **stumble** into the doorway. The monks ignore them and continue to chant. Tom sees the gun in the man's hand and feels his heart racing as the man grabs Mahir and holds one arm around his neck.

*Bring me the Shining Star,* he shouts in a cold clear voice, *or I will kill your precious prince!*

A monk walks out from behind the embroidered curtain and says: *I will bring you the Shining Star. Are you ready to see it?*

*Yes,* cries the man. *I'm ready.*

*Then put your gun down.*

The man tightens his hold and Mahir chokes. The monk repeats it in a calm clear voice: *Put the gun down and I'll bring you the Shining Star.*

The journalist lets go of Mahir, bends down, and puts the gun on the floor.

The King holds open the curtain, and a little boy walks into the room. He is about six years old. The King takes his hand, and together they walk towards the journalist.

*Here is the Shining Star,* says the King. And the boy takes a step forward.

*You're lying,* says the journalist, and he bends down to pick up the gun again. Nobody moves.

*The Shining Star is the most precious thing on Earth,* says the King calmly. *Do you really think the most precious thing on Earth is a **diamond**? Do you think that the most precious thing on Earth is money?*

The journalist stares in horror at the King. Now he knows that the King was not lying. There is no diamond. He drops the gun, and two swordsmen take hold of him by the arms.

*The most precious thing on Earth is **life**,* says the King, and he turns and leads the little boy back into the room behind the curtain.`},

{t:"Whose good luck?", x:`Tara runs to Mahir and hugs him. *Are you okay?*

*I'm cold, but fine.*

Tom comes over. *I guess the kidnapping was your bad luck. But who got the good luck?*

*You and Tara, of course,* says Mahir.

*I don't understand,* says Tom.

*I do,* says Tara. *We were lucky to see the Shining Star. We will be **rewarded** with long life and happiness.*

*Hmm,* says Tom. *I'll take your word for it.* Then he thinks about it for a while and realises that Tara was right. He was lucky. And he learnt a very important lesson today too. *Life is very special,* he thinks.

The holiday comes to an end all too quickly. Tom stands on the balcony of his bedroom, and Mahir comes to stand next to him.

*Are you ready to go?*

*Well, I'm packed, but I'm not sure I'm ready to leave the Kingdom. By the way, has your father decided what to do with that journalist, Jake, yet?*

*Jake has **apologized** to my father. He actually loves our Kingdom, and he and my father get on really well. I think he really is sorry for what he did. My father has **forgiven** him in his heart. But of course he must be **punished** for what he did. He'll stay here in the palace prison for a year.*

*That sounds **fair**,* says Tom. *After all, he nearly killed us. I was worried your father would **let him off** completely.*

*No, he wouldn't do that. He's not used to punishing people and it's not an easy thing for him to do. But I think he was quite frightened by what happened.*

*Yeah, I think we had a very lucky escape,* says Tom. *Back at school, when I was packing, Cornelius said he might not see me again - and he was nearly right!*

*Well at least we've proved Cornelius wrong again.*

An hour later, Mahir, Tara and Tom are sitting in the **departure lounge** at the airport. Tom's flight to Kathmandu leaves in fifteen minutes.

*Have you enjoyed yourself?* asks Tara.

*I can honestly say that it was the most exciting holiday I've ever had!*

*You haven't missed TV?*

*No, I haven't. I haven't had time. But there is one thing I'm looking forward to in England.*

*What's that?* asks Mahir.

*A whopper hamburger and French fries,* says Tom. *Without chilli peppers.*

And they all laugh.`},

{t:"The four big ideas", x:`**1. Friendship.** At school Tom protects Mahir from boys who laugh at his accent. In the kingdom, Mahir's instruction before he is marched off at gunpoint is *Look after my sister for me*. Tom is not asked to be a hero; he is asked to keep a promise. Notice that he has already made that promise twice before it matters - to Tara in the courtyard (*Whatever the danger?* *Whatever the danger!*) and to the King at the archery competition.

**2. Fear.** Mahir's monk taught him to **conquer** fear, not to feel nothing. Tom's fear is real: he can't ride, he looks into the ravine, he is tied up at gunpoint. The mask doesn't remove his fear - it gives him something to concentrate on. *If you believe you can do it, you will do it.* And afterwards Tom learns he walked next to a 1,000-metre drop without knowing it. Which was more dangerous: the thing he was afraid of, or the thing he didn't see?

**3. Luck.** The blue eye of the black dragon is bad luck, and Mahir does hit it, and he is kidnapped that same night. So the superstition was right. But the King's story turns it round: his own bad luck in the blizzard saved a monk's life. *I will have bad luck, but it will bring good luck to someone else. And the good luck will be stronger than the bad.* At the end Mahir says the good luck went to Tom and Tara. Decide for yourself whether you believe that - and whether it matters if you do.

**4. What is really valuable.** The whole plot is driven by a man who wants a diamond. The King's answer is that the Shining Star is a six-year-old boy, and that the most precious thing on Earth is life. Jake, who has written articles about the kingdom for years and thought he was an expert on it, understood nothing about it. The thing he came to steal could not be stolen, because it was never a thing.

Two smaller ideas worth noticing: **animals** (each mask stands for a quality, and the kingdom respects animals as teachers rather than pets), and **justice** (the King forgives Jake in his heart and punishes him anyway - and finds punishing people difficult).`},

{t:"Check yourself", x:`*Eight questions. The answers are all in the sections above.*

1. *You should never hurt your opponent. You should only block him.* Where does Mahir say this, and where in the story does Tom actually use it?

2. Why is it bad luck to hit the blue eye of the black dragon, and what does the King's blizzard story do to that idea?

3. Jake's disguise works for one specific reason. What is it, and why is it an insult to Mahir's family?

4. Tom says he feels no pain when the dagger cuts his arm. Give two possible explanations - one with magic in it and one without.

5. Tara is introduced as the little sister who makes masks. List four things she does in the story that change that first impression.

6. The King says *Mahir is safe here* early on, and he is wrong. Does that make him a bad king? What does he get right?

7. Why does the man with the gun put it down when a monk - not a king, not a swordsman - tells him to?

8. The last line of the book is a joke about a hamburger without chilli peppers. Why end a story about courage and life and death with that? What would be lost if it ended at *the most precious thing on Earth is life*?`}
]}
];

/* ============ STATE ============ */
let book = 0, chap = 0, page = 0, pages = 1, theme = 0;
let size = (window.innerWidth >= 760) ? 22 : 20;
const THEMES = ["ink","amber"];

const T = {
  en:{ chap:"Chapter", page:"Page", spread:"Spread", of:"of",
       back:"Back", next:"Next", toc:"Chapters in this book", close:"Close",
       mark:"Bookmark saved", unmark:"Bookmark removed", mine:"My bookmark" },
  es:{ chap:"Cap\u00edtulo", page:"P\u00e1gina", spread:"Doble p\u00e1gina", of:"de",
       back:"Atr\u00e1s", next:"Seguir", toc:"Secciones de este libro", close:"Cerrar",
       mark:"Marcador guardado", unmark:"Marcador quitado", mine:"Mi marcador" }
};
const t = () => T[(BOOKS[book]||{}).lang || "en"];
function blank(){
  const p = {};
  BOOKS.forEach(b=>{ p[b.id] = {chap:0,frac:0}; });
  return { pos:p, marks:{}, size:size, theme:0 };
}
/* una sola biblioteca: un solo registro de avance, marcadores y preferencias */
let readers = null;   // built after BOOKS is defined
const user = "u";
const me = () => readers.u;
let live = false;   // true solo cuando el lector abrió un libro de verdad
function initReaders(){ readers = { u:blank() }; }

const $ = s => document.querySelector(s);
const flow = $("#flow"), vp = $("#viewport"), gloss = $("#gloss");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function markup(text){
  return text.split(/\n\n+/).map(p=>{
    let h = esc(p).replace(/\*\*(.+?)\*\*/g,(m,w)=>{
      const key = w.toLowerCase().replace(/[.,!?;:']$/,"");
      if(G[key] || ES[key]) return '<span class="w" data-k="'+key+'">'+w+'</span>';
      return "<strong>"+w+"</strong>";
    });
    h = h.replace(/\*([^*]+?)\*/g, "<em>$1</em>");
    return "<p>"+h+"</p>";
  }).join("");
}

/* ============ PASO DE PAGINA ============
   La hoja sigue al dedo mientras se arrastra y se acomoda al soltar.
   El seguimiento escribe el transform directo (sin transicion CSS: en
   Safari alternarla en cada movimiento hace que la hoja persiga al dedo
   con retraso). Las animaciones usan la Web Animations API, que avisa
   cuando termina sin depender de transitionend. */
const EASE = "cubic-bezier(.22,.61,.26,1)";
const DUR_SNAP = 240, DUR_OUT = 170, DUR_IN = 230;
const noAnim = window.matchMedia("(prefers-reduced-motion:reduce)");

let animating = false, dragging = false, curAnim = null, justDragged = 0;
let gx = 0, gy = 0, gbase = 0, gdx = 0, gActive = false, gx0 = 0, gy0 = 0;
let samples = [];   /* ultimos puntos (t,x) para medir la velocidad final */

function span(){ const m = metrics(); return m.w + m.gap; }
function xFor(p){ return -p * span(); }
function curX(){ const m = getComputedStyle(flow).transform; if(!m || m === "none") return 0;
  const a = m.match(/matrix\(([^)]+)\)/); return a ? parseFloat(a[1].split(",")[4]) : 0; }

function stopAnim(){ if(curAnim){ try{ curAnim.cancel(); }catch(e){} curAnim = null; } }

/* coloca la hoja de golpe */
function setX(px, op){
  stopAnim();
  flow.style.transition = "none";
  flow.style.transform = "translateX("+px+"px)";
  if(op !== undefined) flow.style.opacity = op;
}

/* anima la hoja hasta px (y opacidad), y llama a fn al terminar */
function animTo(px, ms, op, fn){
  const from = { transform:"translateX("+curX()+"px)", opacity:getComputedStyle(flow).opacity };
  stopAnim();
  const to = { transform:"translateX("+px+"px)", opacity:(op === undefined ? from.opacity : String(op)) };
  flow.style.transition = "none";
  if(noAnim.matches || !flow.animate){ flow.style.transform = to.transform; flow.style.opacity = to.opacity; if(fn) fn(); return; }
  let done = false;
  const finish = ()=>{ if(done) return; done = true;
    flow.style.transform = to.transform; flow.style.opacity = to.opacity;
    if(curAnim === a){ try{ a.cancel(); }catch(e){} curAnim = null; }
    if(fn) fn(); };
  const a = flow.animate([from, to], { duration:ms, easing:EASE, fill:"forwards" });
  curAnim = a;
  a.onfinish = finish;
  setTimeout(()=>{ if(!done && curAnim === a) finish(); }, ms + 120);
}

/* pinta el capitulo en el DOM y lo mide, sin tocar la posicion */
function fillChapter(){
  const b = BOOKS[book], c = b.chapters[chap];
  $("#hBook").textContent = b.title;
  $("#hChap").textContent = (chap+1)+". "+c.t;
  document.documentElement.style.setProperty("--size", size+"px");
  flow.innerHTML = '<h2><span class="num">'+t().chap+' '+(chap+1)+'</span>'+esc(c.t)+"</h2>"+markup(c.x)+'<hr class="rule">';
  $("#btnPrev").querySelector(".lab").textContent = t().back;
  $("#btnNext").querySelector(".lab").textContent = t().next;
  hideGloss();
  measure();
}

/* abre un capitulo sin animacion: al entrar al libro, desde el indice o el marcador */
function render(goLast, atPage){
  animating = false; dragging = false;
  setX(0, 1);
  fillChapter();
  page = atPage !== undefined ? Math.min(atPage, pages-1) : (goLast ? pages-1 : 0);
  setX(xFor(page), 1);
  paintMeta();
}

function metrics(){
  const pad = window.innerWidth >= 760 ? 80 : 40;   // matches #viewport padding
  const gap = window.innerWidth >= 760 ? 64 : 44;
  const w = vp.clientWidth - pad;
  const cols = w >= 720 ? 2 : 1;
  return { w:w, gap:gap, col:(w - gap*(cols-1))/cols };
}

function measure(){
  const m = metrics();
  flow.style.columnWidth = m.col+"px";
  flow.style.columnGap = m.gap+"px";
  flow.style.width = m.w+"px";
  pages = Math.max(1, Math.round((flow.scrollWidth + m.gap) / (m.w + m.gap)));
}

function paintMeta(){
  const b = BOOKS[book], L = t();
  /* el capitulo lo dice la cabecera; aqui solo la pagina, para que nunca se corte */
  const m = metrics();
  const unit = m.col < m.w ? L.spread : L.page;
  $("#count").textContent = pages > 1 ? (page+1)+" / "+pages : "";
  const done = (chap + (page+1)/pages) / b.chapters.length;
  $("#prog").style.width = (done*100).toFixed(1)+"%";
  if(live) me().pos[b.id] = { chap: chap, frac: done };
  syncMarkBtn();
  save();
}

function paint(){ animTo(xFor(page), DUR_SNAP); paintMeta(); }

/* vuelve a maquetar conservando el punto de lectura: al cambiar el tamano
   de letra o al girar el aparato cambia cuanto cabe por pagina */
function rerender(){
  const frac = pages > 1 ? page/(pages-1) : 0;
  animating = false; dragging = false;
  setX(0, 1);
  fillChapter();
  page = Math.min(pages-1, Math.round(frac*(pages-1)));
  setX(xFor(page), 1);
  paintMeta();
}

/* cruce de capitulo: el actual se va, el nuevo llega por el otro lado */
function turnChapter(dir){
  animating = true;
  const d = span() * 0.3;
  animTo(xFor(page) - dir*d, DUR_OUT, 0, ()=>{
    chap += dir;
    fillChapter();
    page = dir > 0 ? 0 : pages-1;
    setX(xFor(page) + dir*d, 0);
    paintMeta();
    requestAnimationFrame(()=>{ animTo(xFor(page), DUR_IN, 1, ()=>{ animating = false; }); });
  });
}

/* dir: 1 avanzar, -1 retroceder */
function go(dir){
  if(animating) return;
  hideGloss();
  const last = BOOKS[book].chapters.length - 1;
  if(dir > 0){
    if(page < pages-1){ page++; paint(); }
    else if(chap < last) turnChapter(1);
    else animTo(xFor(page), DUR_SNAP);
  }else{
    if(page > 0){ page--; paint(); }
    else if(chap > 0) turnChapter(-1);
    else animTo(xFor(page), DUR_SNAP);
  }
}
function next(){ go(1); }
function prev(){ go(-1); }

/* ---- arrastre ---- */
function dragResist(dx){
  const last = BOOKS[book].chapters.length - 1;
  if((dx > 0 && page === 0 && chap === 0) ||
     (dx < 0 && page === pages-1 && chap === last)) return dx * 0.25;
  if((dx > 0 && page === 0) || (dx < 0 && page === pages-1)) return dx * 0.55;
  return dx;
}

function dragStart(e){
  gActive = !animating && !e.target.closest("#gloss");
  if(!gActive) return;
  const t0 = e.touches[0];
  gx = gx0 = t0.clientX; gy = gy0 = t0.clientY;
  gbase = xFor(page); gdx = 0; dragging = false;
  samples = [[e.timeStamp, t0.clientX]];
}

function dragMove(e){
  if(!gActive || animating) return;
  const t0 = e.touches[0];
  samples.push([e.timeStamp, t0.clientX]);
  if(samples.length > 6) samples.shift();
  if(!dragging){
    const dx = t0.clientX - gx0, dy = t0.clientY - gy0;
    if(Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy) * 1.1) return;
    dragging = true;
    gx = t0.clientX;                /* la hoja arranca desde aqui, sin salto */
    stopAnim(); hideGloss();
    flow.style.transition = "none";
  }
  gdx = t0.clientX - gx;
  flow.style.transform = "translateX("+(gbase + dragResist(gdx))+"px)";
}

function dragEnd(e){
  if(!gActive) return;
  gActive = false;
  if(!dragging){
    const ft = e.changedTouches[0];
    const dx = ft.clientX - gx0, dy = ft.clientY - gy0;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    return;
  }
  dragging = false;
  justDragged = e.timeStamp;        /* el click sintetico que sigue no debe abrir el glosario */
  const a = samples[0], b = samples[samples.length-1];
  const vel = (b[1] - a[1]) / Math.max(1, b[0] - a[0]);    /* px/ms en el ultimo tramo, con signo */
  const w = span();
  const lejos  = Math.abs(gdx) > w * 0.2;
  const rapido = Math.abs(vel) > 0.3 && Math.sign(vel) === Math.sign(gdx) && Math.abs(gdx) > 10;
  if(lejos || rapido) go(gdx < 0 ? 1 : -1);
  else animTo(xFor(page), DUR_SNAP);
}

/* glossary card */
function showGloss(el){
  document.querySelectorAll(".w.on").forEach(n=>n.classList.remove("on"));
  el.classList.add("on");
  const k = el.dataset.k;
  gloss.querySelector("b").textContent = el.textContent;
  gloss.querySelector(".en").textContent = G[k] || "";
  gloss.querySelector(".en").style.display = G[k] ? "block" : "none";
  gloss.querySelector(".es").textContent = ES[k] || "";
  gloss.querySelector(".es").style.display = ES[k] ? "block" : "none";
  gloss.querySelector(".es").style.borderTopWidth = G[k] ? "1px" : "0";
  gloss.querySelector(".es").style.marginTop = G[k] ? "7px" : "0";
  gloss.scrollTop = 0;
  gloss.style.display = "block";
  gloss.classList.remove("in"); void gloss.offsetWidth; gloss.classList.add("in");
}
function hideGloss(){
  gloss.style.display="none";
  document.querySelectorAll(".w.on").forEach(n=>n.classList.remove("on"));
}

/* bookmark */
function markOf(bi){ return me().marks[BOOKS[bi].id]; }
function atMark(){
  const m = markOf(book);
  return !!m && m.chap === chap && m.page === page;
}
function syncMarkBtn(){
  $("#btnMark").classList.toggle("on", atMark());
}
function toggleMark(){
  const id = BOOKS[book].id;
  if(atMark()){ delete me().marks[id]; toast(t().unmark); }
  else{ me().marks[id] = { chap:chap, page:page }; toast(t().mark+" · "+t().chap+" "+(chap+1)); }
  syncMarkBtn(); save();
}
function goMark(bi){
  const m = markOf(bi); if(!m) return;
  live = true;
  book = bi; chap = Math.min(m.chap, BOOKS[bi].chapters.length-1);
  $("#home").classList.remove("open");
  $("#toc").classList.remove("open");
  render(false, m.page);
}
let tt;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* contents */
function buildToc(){
  const b = BOOKS[book];
  let h = "";
  const mk = me().marks[b.id];
  if(mk){
    h += '<button class="item bm" data-mark="'+book+'"><span class="n"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M3.6 2.3h8.8v11.4L8 10.4l-4.4 3.3z\"/></svg></span>'
       + t().mine+' · '+t().chap+' '+(mk.chap+1)+'</button>';
  }
  b.chapters.forEach((c,ci)=>{
    const cur = (ci===chap) ? " cur":"";
    h += '<button class="item'+cur+'" data-b="'+book+'" data-c="'+ci+'"><span class="n">'+(ci+1)+'</span>'+c.t+'</button>';
  });
  $("#tocList").innerHTML = h;
  /* el panel habla el idioma del libro, igual que la cabecera de lectura */
  $("#tocBook").textContent = b.title;
  $("#tocSub").textContent = t().toc;
  $("#btnClose").textContent = t().close;
}

/* library home */
function buildShelf(){
  const empezados = BOOKS.filter(b=>((me().pos[b.id]||{}).frac||0) > 0.001).length;
  $("#lede").textContent = empezados
    ? "Vas por "+empezados+" de "+BOOKS.length+" libros."
    : "Un capítulo a la vez.";

  /* los libros se agregan al final de BOOKS, asi que se muestran al reves:
     el mas nuevo siempre queda arriba */
  const orden = BOOKS.map((b,i)=>i).reverse();
  $("#shelf").innerHTML = orden.map(i=>{ const b = BOOKS[i];
    const p = me().pos[b.id] || {chap:0,frac:0};
    const mk = me().marks[b.id];
    const started = p.frac > 0.001;
    const es = b.lang === "es";
    /* el texto de cada libro va en su propio idioma: así el lector no se sale del inglés */
    const label = started
      ? (es ? "Vas en el cap. "+(p.chap+1)+" de "+b.chapters.length
            : "Chapter "+(p.chap+1)+" of "+b.chapters.length)
      : (es ? b.chapters.length+" secciones"
            : b.chapters.length+" chapters");
    return '<button class="card" data-b="'+i+'" data-tint="'+b.id+'">'
      +   '<div class="cover">'+(COVERS[b.id]||'')
      +     '<div class="ttl"><h3>'+esc(b.title)+'</h3><div class="by">'+esc(b.author)+'</div></div>'
      +   '</div>'
      +     '<div class="voice">'+esc(b.voice)+'</div>'
      +     '<div class="meta'+(started?"":" fresh")+'">'+label+'</div>'
      +     (mk ? '<div class="mark"><b><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M3.6 2.3h8.8v11.4L8 10.4l-4.4 3.3z\"/></svg></b> '+(es?"Marcador en el capítulo ":"Bookmark in chapter ")+(mk.chap+1)+'</div>' : '')
      + '<div class="cardbar"><i style="width:'+(p.frac*100).toFixed(1)+'%"></i></div>'
      + '</button>';
  }).join("");
}
function openHome(){
  live = false;
  buildShelf();
  $("#home").classList.add("open");
  $("#toc").classList.remove("open");
  hideGloss();
}
function openBook(i){
  live = true;
  book = i;
  chap = Math.min((me().pos[BOOKS[i].id]||{}).chap || 0, BOOKS[i].chapters.length-1);
  $("#home").classList.remove("open");
  render(false);
}

/* optional resume */
/* El avance se guarda SOLO en este navegador (localStorage), nunca en un
   servidor ni en un almacenamiento compartido: cada telefono o tablet lleva
   su propio registro, aunque dos personas lean el mismo libro a la vez. */
const KEY = "readinglamp-v2";
let memStore = null;   /* respaldo en memoria si el navegador bloquea localStorage */

function writeStore(v){
  memStore = v;
  try{ localStorage.setItem(KEY, v); }catch(e){}
}
async function readStore(){
  try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  return memStore;
}
/* pide al navegador que no borre estos datos por falta de espacio o inactividad */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

async function save(){
  me().size = size; me().theme = theme;
  try{ writeStore(JSON.stringify({book, readers})); }catch(e){}
}
async function load(){
  try{
    const raw = await readStore();
    if(raw){
      const s = JSON.parse(raw);
      if(s.readers && s.readers.u){
        readers.u = Object.assign(blank(), s.readers.u);
        readers.u.pos = Object.assign(blank().pos, s.readers.u.pos || {});
      }else if(s.readers){
        /* venia de la version con perfiles: se funden en uno. Para cada libro
           se conserva el avance y el marcador del perfil que iba mas adelante */
        const viejos = ["m","g"].map(k=>s.readers[k]).filter(Boolean);
        const u = blank();
        BOOKS.forEach(b=>{
          let mejor = null;
          viejos.forEach(r=>{ const pp = (r.pos||{})[b.id];
            if(pp && (!mejor || (pp.frac||0) > ((mejor.pos||{})[b.id].frac||0))) mejor = r; });
          if(mejor){ u.pos[b.id] = mejor.pos[b.id];
            const mk = (mejor.marks||{})[b.id] || viejos.map(r=>(r.marks||{})[b.id]).find(Boolean);
            if(mk) u.marks[b.id] = mk; }
        });
        const pref = s.readers[s.user] || viejos[0];
        if(pref){ u.size = pref.size || u.size; u.theme = pref.theme || 0; }
        readers.u = u;
      }
      if(typeof s.book==="number" && BOOKS[s.book]) book = s.book;
      size = me().size || size; theme = me().theme || 0;
    }
  }catch(e){}
}

/* events */
$("#btnNext").onclick = next;
$("#btnPrev").onclick = prev;
$("#btnBig").onclick = ()=>{ size = Math.min(32, size+2); rerender(); };
$("#btnSmall").onclick = ()=>{ size = Math.max(16, size-2); rerender(); };
$("#btnTheme").onclick = ()=>{ theme = (theme+1)%THEMES.length; document.documentElement.dataset.theme = THEMES[theme]; save(); };
$("#btnHome").onclick = openHome;
$("#shelf").onclick = e=>{ const c = e.target.closest(".card"); if(c) openBook(+c.dataset.b); };
$("#btnReset").onclick = ()=>{
  const keep = { size:size, theme:theme };
  readers.u = Object.assign(blank(), keep);
  chap = 0; page = 0; save(); buildShelf();
  toast("Avance borrado");
};
$("#btnMark").onclick = toggleMark;
$("#btnToc").onclick = ()=>{ buildToc(); $("#toc").classList.add("open"); };
$("#btnClose").onclick = ()=> $("#toc").classList.remove("open");
$("#tocList").onclick = e=>{
  const it = e.target.closest(".item"); if(!it) return;
  if(it.dataset.mark !== undefined){ goMark(+it.dataset.mark); return; }
  book = +it.dataset.b; chap = +it.dataset.c;
  $("#toc").classList.remove("open");
  render(false);
};

flow.addEventListener("click", e=>{
  if(justDragged && e.timeStamp - justDragged < 500){ justDragged = 0; return; }
  const w = e.target.closest(".w");
  if(w){ e.stopPropagation(); showGloss(w); }
  else hideGloss();
});
gloss.addEventListener("click", e=>{ e.stopPropagation(); hideGloss(); });

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
  if(e.key==="Escape"){ hideGloss(); $("#toc").classList.remove("open"); }
});

/* ---- sin zoom: ni doble toque ni pellizco ----
   iOS ignora user-scalable=no desde iOS 10, asi que hay que bloquearlo a mano.
   El tamano de letra se cambia con A- / A+, no con los dedos.
   Los controles (botones, fichas, tarjetas, palabras del glosario) quedan fuera
   del bloqueo para que dos toques seguidos en "Seguir" pasen las dos paginas. */
const CTRL = "button, .chip, .card, .w, .list > *, a, [role=button]";
let tapT = 0, tapX = 0, tapY = 0;
document.addEventListener("touchend", e=>{
  if(e.touches.length) return;
  const t = e.changedTouches[0], now = Date.now();
  const mismoPunto = Math.abs(t.clientX - tapX) < 36 && Math.abs(t.clientY - tapY) < 36;
  if(now - tapT < 350 && mismoPunto && !(e.target.closest && e.target.closest(CTRL))){
    e.preventDefault();
  }
  tapT = now; tapX = t.clientX; tapY = t.clientY;
}, {passive:false});
document.addEventListener("dblclick", e=>{ e.preventDefault(); }, {passive:false});
document.addEventListener("gesturestart", e=>{ e.preventDefault(); }, {passive:false});
document.addEventListener("gesturechange", e=>{ e.preventDefault(); }, {passive:false});

/* el escenario no se mueve con el dedo, pero el panel del glosario sí se
   puede scrollear cuando la definición es larga */
$("#stage").addEventListener("touchmove", e=>{
  if(!e.target.closest("#gloss")) e.preventDefault();
}, {passive:false});
document.addEventListener("touchmove", e=>{
  if(!e.target.closest("#home, .list, #gloss")) e.preventDefault();
}, {passive:false});

$("#stage").addEventListener("touchstart", dragStart, {passive:true});
$("#stage").addEventListener("touchmove",  dragMove,  {passive:true});
$("#stage").addEventListener("touchend",   dragEnd,   {passive:true});
$("#stage").addEventListener("touchcancel", e=>{
  if(dragging){ dragging = false; animTo(xFor(page), DUR_SNAP); }
  gActive = false;
}, {passive:true});

let rt;
window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(rerender, 180); });

/* start */
(async()=>{
  initReaders();
  await load();
  document.documentElement.dataset.theme = THEMES[theme];
  chap = Math.min((me().pos[BOOKS[book].id]||{}).chap || 0, BOOKS[book].chapters.length-1);
  render(false);
  openHome();
})();
</script>
