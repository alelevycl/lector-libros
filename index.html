{t:"Los cascarudos", x:`Un cuento cómico sobre cómo la ciencia arruinó una plantación.

**La quinta.** Hasta el día fatal en que intervino el naturalista, la quinta de monsieur Robin era un prodigio de corrección: plantaciones jóvenes de yerba mate, viveros de cafetos —ensayo costoso en la región—, de chirimoyas y heveas. Pero lo admirable era el bananal. Robin lo cultivaba al sistema cubano, con tres vástagos por planta, en vez de dejar que se volviera un macizo de diez o quince pies, que empobrece la tierra y degenera el fruto. Mientras los bananales de los nativos daban mezquinas vainas sin jugo, las cortas y bien nutridas familias de Robin se doblaban al peso de magníficos cachos.

Eso no se obtiene sino a expensas de mucho sudor y de muchas limas gastadas en afilar palas y azadas. Robin había conseguido inculcarles a cinco peones la necesidad de todo aquello, y creyó haber hecho obra de bien, aparte de los tres o cuatro mil cachos que bajaban a Posadas cada temporada.

**El naturalista.** Entonces llegó a Misiones Fritz Franke, **entomólogo** distinguidísimo del Museo de Historia Natural de París: un muchacho rubio, altísimo y flaco, con lentes de miope allá arriba, enormes botines, pantalón corto, su esposa y una perra con collar de plata. Venía recomendado, y Robin puso la quinta a su disposición y le encargó al capataz que lo ayudara en todo lo posible.

Al principio los peones hallaron ridículo sobre toda ponderación a aquel bebé de interminables pantorrillas que se pasaba las horas en cuclillas revolviendo yuyos. Se detenían con la azada en la mano a contemplar esa zoncísima manera de perder el tiempo, y cuando el sabio se iba, cogían un insecto parecido, lo observaban detenidamente y se miraban estupefactos.

**El contagio.** Hasta que uno se atrevió a ofrecerle un **cascarudo** que había hallado. Llevaba muchísima más sorna que cascarudito — pero el coleóptero resultó ser de una especie nueva, y Franke lo gratificó con cinco cartuchos. El peón se retiró, y volvió al rato con sus compañeros: entonces, che patrón, ¿te gustan los bichitos? Oh, sí, tráiganme todos; después, regalo. No, patrón, te lo vamos a hacer de balde; don Robin nos dijo que te ayudáramos.

Ese fue el principio de la catástrofe. Durante dos meses enteros, sin perder diez segundos en quitar el barro a una azada, los cinco peones se dedicaron a cazar bichitos: mariposas, hormigas, larvas, escarabajos, cantáridas, cuanto insecto vieron sus ojos. No quedó tronco sin remover ni piedra sin levantar. Era, evidentemente, más divertido que carpir. Franke, loco de gozo ante el ardor de aquellos entusiastas neófitos, prometía escopetas de uno, dos y tres tiros. A fines de enero dio su colección por concluida y volvió a Posadas. ¿Y los peones, no tuvo quejas? Oh, no, muy buenos todos; usted tiene muy buenos peones.

**El desastre.** Robin fue a constatar esa bondad. Halló a los peones como enloquecidos, en pleno furor de cazar bichitos. Y el glorioso vivero de cafetos y chirimoyas desaparecía bajo el monstruoso yuyo de un verano entero, las plantitas ahogadas por el vaho de una sombra demasiado baja, perdida la vida o un año de avance; el bananal convertido en un plantío salvaje de pajas, lianas y rebrotes de monte, con los bananos asfixiados agotándose en hijuelos raquíticos y los cachos colgando con miserables bananitas negruzcas.

Despidió a todos los peones. Pero la mala semilla estaba sembrada.

**La epidemia.** A otro le tocó, tiempo después, tomar dos peones que habían sido de la quinta de Robin. Los mandó a arreglar un alambrado con taladros, mechas y llave inglesa; a la media hora estaba uno de vuelta con un cascarudito. Se le agradeció el obsequio. Al cuarto de hora volvía el otro con otro cascarudito. Y a pesar de la orden terminante de no prestar más atención a los insectos, por maravillosos que fueran, regresaron los dos media hora antes de lo debido a mostrar un bichito que jamás habían visto en Santa Ana.

Durante muchos meses la aventura se repitió en diversas granjas, porque aquellos peones, poseídos de verdadero frenesí entomológico, contagiaron a otros. Y aún hoy un patrón que se estime debe acordarse siempre, al tomar un peón nuevo: sobre todo, les prohíbo terminantemente que miren ningún bichito.

Pero lo más horrible de todo es que los peones habían visto más de una vez comer alacranes al naturalista. Los sacaba de un tarro y los comía por las patitas.

**Qué mirar:** nadie obró mal. El sabio es un sabio y los peones obedecen la orden de ayudarlo. La catástrofe sale de que las dos partes no entienden en qué consiste el trabajo de la otra.`},

{t:"El divino", x:`Un cuento sobre una cometa que se convierte en Espíritu Santo.

**El teodolito.** Jamás en aquel confín se había tenido idea de un **teodolito**. Por eso, cuando vieron a Howard asentar el sospechoso aparato en el suelo, mirar por los tubitos y correr tornillos, la gente tuvo por él, sus cintas métricas, niveles y banderitas un respeto casi diabólico.

Howard, **agrimensor**, había ido al fondo de Misiones, sobre la frontera del Brasil, a medir una propiedad que el dueño quería vender con urgencia. Trabajo rudo: bosque inextricable y quebradas a prueba de nivel. Lo hizo del mejor modo posible, hasta que llegó el verano y el bosque zumbó de mosquitos y **barigüí**s, y le faltó valor para afrontarlos. Como su trabajo no era urgente, se dispuso a descansar quince días.

**La pandorga.** Al caer el sol, la loma se doraba y el ambiente cobraba tal transparente frescura que un atardecer, en los treinta y ocho años de Howard, revivieron agudas sus grandes glorias de la infancia. ¡Una **pandorga**! ¿Qué cosa más bella que remontar a esa hora el barrilete? A esa hora, cuando el sol desaparece y el viento cae con él, la cometa se aquieta, la cola pende inmóvil, el hilo forma una honda curva, y allá arriba, muy alto, la pandorga en equilibrio constela triunfalmente el cielo de nuestra industriosa infancia.

Recordó con sorprendente viveza toda la técnica infantil, y al cortar las tacuaras tuvo buen cuidado de afinarlas en los extremos y muy poco en el medio, porque una pandorga que se quiebra por el centro deshonra para siempre a su ingeniero. Hicieron la estrella con dos cuadros en cruz, la revistieron con un pliego de seda roja que Howard tenía en su archivo, y a falta del clásico orillo de casimir el agrimensor transformó la pierna de un pantalón suyo en científica cola de pandorga. Y por último los **roncadores**.

Al día siguiente la ensayaron: un sencillo prodigio de estabilidad, tiro y ascensión. El sol traspasaba la seda en escarlata vivo, y la vibrante estrella ascendía tirante, aureolada de trémulo ronquido.

**La comparsa.** En pleno remonte oyeron un tambor. Por el sendero subía una comitiva con estandarte al frente: el hombre del tambor, un indio descalzo; una negra gordísima con un mulatillo en brazos levantando un estandarte de satiné punzó empenachado de cintas; una vieja con un terrible cigarro; un hombre con el saco al hombro; una muchachita; otro en calzoncillos; mujeres con chicos de pecho; un negro canoso.

Aquello era **El Divino**, como podía verse por la palomita de cera forrada de trapo atada en el extremo del estandarte. El Divino recorría la comarca en ciertas épocas curando los males, y si se daba dinero en recompensa, tanto mayor eficacia. ¿Y el tambor? Es su música.

Howard y su ayudante gozaban de excelente salud, pero aceptaron de buen grado la intervención paliativa. Howard tuvo que sostener al Divino de pie mientras el tambor hacía su piruetesco acompañamiento y la comitiva cantaba que ahí estaba el Divino que lo venía a visitar y que Dios le diera la salud, y que el señor y la señora recibieran mucha felicidad — aunque Howard estuviera exento de toda señora, la canción no variaba.

Pero Howard vio muy claramente que los acólitos no pensaban sino en la pandorga que sostenía el ayudante. La devoraban con los ojos, de modo que sus loas, al igual de sus bocas abiertas, estaban rectamente dirigidas a la estrella. Jamás habían visto eso. Hubo que recogerla y remontarla de nuevo. La comparsa no cabía en sí de gozo y lírico asombro, y se fue con un par de pesos atados al cuello del pájaro.

**La transubstanciación.** Al caer del segundo día la procesión volvió, y expuso su pedido: querían la cometa para hacer un Divino. Le atarían la paloma en la punta. Y el ruido de los roncadores. La comparsa sonreía estúpidamente de anticipado deleite; morirían sin duda si no obtenían aquello.

¡Su pandorga, convertida en Espíritu Santo! Howard halló la circunstancia profundamente casuística: ¿tendría él, aunque agrimensor y fabricante de su cometa, derecho de impedir aquella como transubstanciación? Como no creyó tenerlo, entregó el ser sagrado. En un momento ataron la paloma a la estrella, la enarbolaron en una tacuara y se fueron a gran acompañamiento de tambor, llevando triunfalmente en lo alto la cometa de Howard con sus roncadores vibrantes, transformada en Dios.

Fue el más grande éxito registrado en cien leguas a la redonda: aquel brillante Divino con ruido y cola, y que volaba — o más bien que había volado, pues nadie se atrevió a restituirle su antiguo proceder. Howard lo vio pasar muchas veces, siempre triunfante y otorgadora de bienes, echando melancólicamente de menos su pandorga celestial. No se atrevió a hacer otra por algo de mística precaución.

**El final.** Un viejo del lugar, algo leguleyo por haber vivido un tiempo en países más civilizados, se quejó vagamente de que Howard se hubiera burlado de aquella pobre gente dándoles la cometa. De ningún modo, se disculpó Howard. Sí, de ningún modo… sí, sí, repitió pensativo el viejo, tratando de recordar qué querría decir de ningún modo. Pero no pudo conseguirlo, y Howard pudo concluir su mensura sin que el viejo ni nadie se atreviera a afrontar su sabiduría.

**Qué mirar:** el cuento se ríe de todos a la vez, y de nadie con crueldad. Para la comparsa el teodolito y la cometa son igual de mágicos; para Howard el problema es teológico; y el único que intenta un reclamo no logra acordarse de qué quería decir.`},

{t:"El canto del cisne", x:`El cuento más breve y más extraño del libro.

**La antipatía.** El narrador confiesa que no le gustan los cisnes blancos: le han parecido siempre gansos griegos, pesados, patizambos y bastante malos. Y cuenta que vio morir uno en Palermo sin el menor trastorno poético: estaba echado de costado en el ribazo, y cuando se acercó trató de levantarse y picarlo; sacudió las patas, se golpeó dos o tres veces la cabeza contra el suelo, quedó rendido abriendo desmesuradamente el pico, estiró rígidas las uñas, bajó lentamente los párpados duros y murió. No le oyó canto alguno, aunque sí una especie de ronquido sibilante.

Pero él es hombre, y ella no estaba. Y ella está absolutamente segura de que oyó eso.

**El cisne distinto.** En el lago de una quinta de Martínez había varios cisnes blancos, uno de los cuales se individualizaba en la insulsez genérica por su modo de ser. Casi siempre estaba en tierra, con las alas pegadas y el cuello inmóvil en honda curva. Nadaba poco, jamás peleaba, y vivía completamente apartado de la pesada familia, como un fino retoño que hubiera roto ya para siempre con la estupidez natal. Cuando alguien pasaba a su lado se apartaba unos pasos y volvía a su vaga distracción. Al caer la tarde, sobre todo, su silueta inmóvil y distinta se destacaba de lejos sobre el césped sombrío.

**La aversión.** Celia bajaba todas las tardes al lago, y los cisnes la conocían bien por las galletitas que les tiraba. Únicamente aquel evitaba su aproximación. Lo notó un día y fue decidida a su encuentro, y el cisne se alejó más aún. Repitió su deseo de familiaridad con igual resultado, y desde entonces, aunque usó de toda malicia —fingir que iba a otra parte, acercarse en oblicuo—, no pudo nunca acercarse a él. Una tarde lo corrió hasta perder el aliento y dos pinchos. Fue en vano. Solo cuando Celia no se preocupaba de él, él la seguía con los ojos.

Y sin embargo, le diría ella después, estaba tan segura de que me odiaba.

**El crepúsculo.** Fue en una tarde apacible. Celia, bajando las escaleras, lo vio de lejos echado sobre el césped a la orilla del lago. Sorprendida de esa confianza poco habitual, avanzó incrédula; el animal siguió tendido. Llegó hasta él, y recién entonces pensó que podía estar enfermo. Se agachó apresuradamente y le levantó la cabeza. Sus miradas se encontraron, y Celia abrió la boca de sorpresa, lo miró fijamente y se vio obligada a apartar los ojos.

El cisne cerró los ojos.

*—Me muero —dijo.*

Celia dio un grito y tiró violentamente lo que tenía en las manos.

*—Yo no la odiaba —murmuró él lentamente, el cuello tendido en tierra.*

Cosa rara: ella contó después que al verlo así, por morir, no se le ocurrió un momento preguntarle cómo hablaba. Los pocos momentos que duró la agonía se dirigió a él y lo escuchó como a un simple cisne, aunque hablándole sin darse cuenta de tú, por su voz de hombre.

Se arrodilló y afirmó sobre su falda el largo cuello, acariciándolo. ¿Sufre mucho? Sí, un poco. ¿Por qué no estaba con los demás? ¿Para qué? No podía. ¿Por qué no me quería? No, no es eso; mejor era que me apartara. Sufrir más.

Tuvo una convulsión, y una de sus grandes alas desplegadas rodeó las rodillas de Celia. Y la causa de todo, y sobre todo de esto, dijo mirándola por última vez y muriendo en el crepúsculo: ha sido mi amor a ti.

**Qué mirar:** el cuento empieza burlándose de la leyenda del canto del cisne y termina cumpliéndola en serio. Fíjate también en el truco del narrador: él no estuvo ahí. Toda la escena le llegó por su hermana, que la oyó de Celia.`},

{t:"Los temas y el estilo", x:`**La selva no es paisaje: es personaje.** Misiones, el Chaco, el Paraná. En Quiroga el lugar actúa: el río crece, el frío mata un naranjal en una noche, el estero manda nubes de mosquitos a la hora de la cena, el bambú vuelve a brotar aunque lo claven al revés. Nunca está puesto para adornar.

**El hombre contra la naturaleza — y la naturaleza indiferente.** Los personajes trabajan, calculan, miden, y casi siempre pierden. No hay castigo ni justicia en lo que les pasa: hay un río que corre y un viento que sopla.

**La muerte en seco.** Quiroga la cuenta sin música y sin moraleja: el hombre muere en cuatro minutos, el chico queda idiota, Málter se va a su casa a morir. El final llega y no consuela a nadie.

**La fiebre, la obsesión, la locura.** Son el mismo mecanismo en cuatro cuentos distintos: un tic en *El simún*, unas rayas en *Las rayas*, una lengua en *La lengua*, un pañuelo blanco en *La mancha hiptálmica*. Siempre empieza por un detalle mínimo y crece hasta ocuparlo todo.

**El trabajo y el fracaso.** *Los fabricantes de carbón*, *El monte negro*, *El mármol inútil*, *Los cascarudos*. Quiroga admira a los que hacen cosas con las manos, y casi nunca los deja ganar. Pero el fracaso no los ridiculiza: "hemos hecho lo que debíamos hacer".

**El heroísmo involuntario.** *En la noche*. La mujer hace una epopeya por cinco pesos de ganancia. La pregunta del cuento es cuánto ideal hay dentro de la acción, aunque el motivo que la encendió sea mezquino.

**El humor.** Más de la mitad del libro se ríe: la burocracia en *Polea loca*, la cometa en *El divino*, la crema en *La crema de chocolate*, los bichitos en *Los cascarudos*, el té en *Dieta de amor*. Es humor seco, nunca chistoso, y suele terminar en una frase breve que cierra como una puerta.

**Los animales que hablan.** En *Anaconda* y *El canto del cisne*. No son fábulas con moraleja: las víboras tienen política, vanidad y leyes, y el cisne tiene un amor imposible.

**El estilo.** Frase corta. Dato exacto: grados, kilos, metros, 1680 clavos, treinta y cinco minutos sobre el lomo del rápido. Esa precisión técnica es la que hace creer todo lo demás. El narrador suele ser testigo y arranca como una conversación: "un amigo mío se fue a Fernando Poo", "oí hablar de un hombre". Y casi siempre hay un último dato que reordena el cuento entero: el sueño en *Miss Dorothy Phillips*, las dos rayas en el albañal, la fecha de la salida en *El vampiro*.`},

{t:"Preguntas para repasar", x:`**Sobre Anaconda**
1. ¿Qué es en realidad la Casa, y para qué sirve el suero que fabrican?
2. ¿Por qué las víboras necesitan a las culebras, y por qué las desprecian?
3. ¿Qué descubre la Ñacaniná escuchando a los hombres?
4. Explica el plan de Hamadrías. ¿Qué es el punto de apoyo y por qué es la clave?
5. ¿Por qué el ataque a la caballeriza termina salvando a los caballos?
6. ¿Quién tenía razón sobre qué atacar, y por qué no la escucharon?
7. ¿Por qué los hombres deciden salvar a Anaconda?
8. ¿Qué diferencia establece Anaconda entre matar de frente y matar a traición? ¿Cómo se refleja eso en quién muere y quién sobrevive?

**Sobre los demás cuentos**
1. ¿Qué es el cafard, y cómo destruye la amistad de Briand con su teniente?
2. En *Gloria tropical*, ¿por qué la fertilidad de la isla es una amenaza y no una bendición?
3. ¿Qué es el yaciyateré, y qué le pasa realmente al chico del rancho?
4. ¿Por qué se destruye el horno de Dréver y Rienzi, y cómo reaccionan los dos?
5. ¿Qué es lo que de verdad ofende a Braccamonte en *El monte negro*?
6. En *En la noche*, ¿por qué emprenden el viaje, y qué tiene que hacer la mujer en el rápido del Teyucuaré?
7. ¿Qué es una polea loca, y qué quiere decir con eso el gobernador?
8. ¿Cuál es, según él mismo, la única falla de la religión del doctor Swindenborg?
9. ¿Qué dos mentiras arma Guillermo Grant para acercarse a Dorothy Phillips, y qué lo hace confesarlas?
10. ¿Cuál es la última línea de *Miss Dorothy Phillips, mi esposa*, y cómo cambia todo el cuento?
11. ¿Por qué Gómez Alcain termina pagando más de lo convenido a los indios?
12. ¿Qué tienen que ver las rayas del libro de contabilidad con las del albañal?
13. ¿Por qué Howard entrega su cometa, y qué razonamiento usa?
14. ¿Qué arruina la quinta de monsieur Robin?

**Para pensar y escribir**
1. Elige dos cuentos: uno donde la naturaleza gana y otro donde el hombre aguanta. ¿Qué cambia entre los dos?
2. Varios cuentos empiezan con un narrador que escuchó la historia de otro. ¿Qué gana Quiroga con ese rodeo?
3. Quiroga llena los cuentos de datos técnicos exactos. ¿Para qué sirven, si no son la historia?
4. Compara el humor de *Polea loca* con el horror de *La lengua*. ¿Hay algo en común en cómo están construidos?
5. ¿Por qué crees que Quiroga sacó nueve cuentos del libro? Elige uno de los suprimidos y defiende si debía quedarse o irse.
6. Varios cuentos terminan con un solo dato que lo cambia todo. Elige tres y explica qué cambia en cada uno.

*(Las respuestas están todas en los resúmenes anteriores.)*`}
]},

id:"dr", lang:"en", title:"Dracula", author:"Bram Stoker", voice:"From the journals and letters of the people who lived it",
chapters:[
{t:"The Road to the Castle", x:`*Jonathan Harker's Journal*

**3 May. Bistritz.** I have travelled east through Munich, Vienna and Budapest, and I have the feeling that I have left the West behind me. My client, Count **Dracula**, lives on the border of three states - **Transylvania**, Moldavia and Bukovina - in the Carpathian Mountains. I am a young English **solicitor**, and this is the first time my office has sent me abroad. The Count is buying a **property** in England, and somebody must carry the papers to him.

I could not find a map that showed exactly where he lives, but I found Bistritz, a town nearby. The countryside on the way was beautiful: **steep** hills, little towns, wide rivers.

At the hotel a letter was waiting for me.

*My friend. Welcome to the Carpathians. I look forward to meeting you. At three tomorrow you have a place on the coach for Bukovina, which travels through the Borgo **Pass**. My carriage will meet you there and bring you here. Your friend, Dracula.*

**4 May.** As I was leaving the hotel, I asked the landlord and his wife about Count Dracula. Neither of them would speak. The landlady said, 'Must you go? Herr Harker, must you go?' Tomorrow was the eve of **St George's Day**, she told me, and after midnight all the evil things in the world would have power.

Then she took the **crucifix** from her own neck and put it on me. I am an Englishman of the nineteenth century, and I thought it was nonsense. I was also, I admit, frightened.

The people outside the hotel made the sign of the cross and pointed two fingers towards me. I asked another passenger and he explained, in an embarrassed way, that it was to protect me from the **evil eye**.

I wrote down the words I heard them repeating and looked them up in my **polyglot** dictionary: *Ordog* - Satan. *Pokol* - hell. *Stregoica* - witch. *Vrolok* and *vlkoslak* - werewolf, or vampire.`},

{t:"The Driver with Red Lips", x:`*Jonathan Harker's Journal (continued)*

**5 May.** We drove fast into the Carpathian Mountains. The clouds above us were heavy and the air was oppressive. The driver stopped only once, to light the lamps, and at the Borgo Pass the long sandy road stretched in front of us. There was no carriage.

'There is no carriage here,' the driver said. 'You are early tonight, Herr Harker. Come on to Bukovina with us and return tomorrow.'

But while he was still speaking, four coal-black horses appeared beside our coach. They were driven by a tall man with a long brown beard and a black hat that hid his face. His eyes seemed red in the light of the lamps. His lips were red too, and his teeth were sharp and white as **ivory**.

'You are early tonight, my friend,' he said to the driver.

I got into his carriage and we drove off into the darkness. It was cold, and I pulled a **cloak** around my shoulders and knees. It was nearly midnight. I heard the **howling** of wolves from the mountains. The horses shook with fear, and the driver was not **disturbed** at all. The horses got white with sweat, and snow fell, and the howling came closer.

Then I saw a faint blue flame burning in the darkness. The driver stopped, jumped down and disappeared towards it. We continued, but I think we were driving in circles.

The last time he came back there was a ring of wolves all around us, with white teeth and red tongues. I called out. Suddenly the moon came out from behind the clouds, and I saw the driver standing in the roadway, moving his arms as if he were pushing something away. The wolves moved backwards and disappeared.

We moved quickly through the darkness until we stopped in front of a huge, dark, ruined castle.`},

{t:"Welcome to My House", x:`*Jonathan Harker's Journal*

**5 May. The Castle.** I stood in front of the great door and waited. There was no knocker and no bell. What type of terrible adventure was this? Is it normal for a solicitor to be sent to a strange land, to explain to a client, a foreigner, how to buy a house in London?

The door opened, and a tall old man stood there, with a long moustache, dressed all in black.

'Welcome to my house! Enter freely and of your own will.'

As I stepped inside he shook my hand. It seemed cold like a dead man's hand.

'Count Dracula?' I asked.

'I am Dracula,' he replied. He carried my luggage up a **winding** stair himself, and opened a heavy door into a well-lit room where supper was laid for me.

'Please sit and eat,' said the Count. 'Excuse me for not joining you, but I have **dined** already.'

After dinner we talked, and I looked at him carefully. He had a thin nose and a high forehead, with lots of hair at the back of his head. His eyebrows were massive and nearly met over his nose. The mouth under his moustache looked cruel, with strange, sharp white teeth which showed over his very red lips. His ears were pale and pointed. His hands were broad, with long fingers and long sharp nails cut to a point. Strangely, there was hair on his palms.

Then he moved towards me and his hands touched me, and I felt sick.

'You must be tired,' he said at last. 'You can sleep as long as you like. I will be away until tomorrow afternoon.'

**7 May.** I slept until late. Breakfast was waiting for me. The Count was not there. Afterwards I found a library full of English books, and I began to look at them.

'I am glad you found my library,' he said suddenly behind me. 'These books have given me many hours of pleasure.'

'Can I go anywhere in the castle?' I asked.

'Certainly,' he answered. 'You may go anywhere in the castle, except where the doors are locked.'

Later we looked at the papers for his London house - a big, old, **lonely** **estate** called **Carfax**, with a chapel, and next to it an **asylum**.`},

{t:"A Man with No Reflection", x:`*Jonathan Harker's Journal*

**8 May.** I began to think I was writing too much detail in this diary, but now I am glad, because writing down the facts stops my imagination from going wild.

This morning I hung my **shaving** **mirror** on the window and I was shaving when suddenly I felt the Count's hand on my shoulder.

'Good morning,' he said.

I jumped, because I had not seen him in the mirror. I turned to greet him, and when I turned back I cut my face with the **razor**. I was surprised, and I began to feel uneasy. The Count saw the blood on my face, and his eyes **blazed**, and his hand touched my throat. I moved back, and his hand touched the crucifix the landlady had given me, and his expression changed immediately.

'Be careful how you cut yourself,' he said. 'It is more dangerous in this country than you think.' Then he took my shaving mirror and threw it down into the courtyard, where it broke into pieces. He left the room without a word.

I had breakfast alone. I have still not seen the Count eat or drink.

After breakfast I explored the castle. A mirror, he had said once, is a dangerous **vanity** of man's - but I think now that he threw it away because it would not show him.

From a window on the southern side I looked over a magnificent view of forests and river valleys. I realized the castle was on the **edge** of a terrible **precipice** - a drop of 300 metres. I explored further. There were doors everywhere, but they were all locked. There was no way out except through the windows.

I am a prisoner!`},

{t:"The Letters", x:`*Jonathan Harker's Journal*

**12 May.** Yesterday evening the Count asked me about legal **matters** in England: could a man have two solicitors, or more, and in different parts of the country? He wanted to know everything. People who do not want one person to know all of their business often have more than one solicitor, I thought.

Then he asked, suddenly, 'Have you written to your employer, Mr Hawkins in Exeter, or anyone else, since you arrived?'

'No,' I answered.

'Then write,' he said. 'Say that you will stay here for a month.'

'Do you want me to stay for so long?' I asked, my heart growing cold.

'Yes,' he answered. 'And please only write about business.'

I wrote formal notes to Mr Hawkins in Exeter and to my dear girlfriend, **Mina**. The Count wrote several letters himself, then he left the room. I saw that they were addressed to someone in Whitby in northeast England, to a German in Varna, and to a bank in London.

On returning, he said: 'I must work this evening. Let me **warn** you not to fall asleep in other parts of the castle. Hurry back here where you are safe.'

**Later.** I went up to the room with the southern view. I felt like a prisoner. The moonlight was as bright as day. I leaned out of the window and saw the Count coming out of a window one floor lower, and **crawling** down the castle wall. He moved with great speed, like a **lizard**. I felt terribly afraid.`},

{t:"The Three Women", x:`*Jonathan Harker's Journal*

**15 May.** I saw the Count leave in his lizard way again. I explored the castle, and finally entered another room by pushing the door hard. Moonlight **flooded** through the windows. I felt comfortable here, so I sat at a little desk and wrote this diary.

**16 May.** Last night I went back to the room. I remembered the Count's warning, but I decided to sleep there. I lay on an old sofa and looked out at the moonlit view.

I suppose I fell asleep, but I fear that what I saw was real. I saw three young women with the moonlight behind them, and they had no shadows. Two were dark, and reminded me of the Count, and the other had wavy golden hair and blue eyes. Each one had white shiny teeth and red lips. I felt afraid but I wanted to kiss them. They whispered and laughed in a strange inhuman way. The two dark women said: 'Go on! You are first. He is young and strong; there are kisses for all of us.'

I lay, looking under my eyelashes, as the fair girl bent over me. I felt her breath on me. She licked her lips like an animal and then I felt her two sharp teeth pushing against the skin of my neck.

At that moment, I was conscious of the presence of the Count. In a terrific **rage** he took hold of the woman. His red eyes **blazed** in fury.

'How **dare** you touch him when I have forbidden it? He belongs to me. But I promise you that when I have finished with him, you shall kiss him as much as you want. Now go!'

It was the same gesture he used to control the wolves on the night I arrived. His voice was only a whisper, but it **rang out**.

'Are we to have nothing tonight?' asked one of them, pointing to a bag he had thrown on the floor. The bag moved as if there was something alive inside it. He nodded. Then they disappeared with the terrible bag, **fading** into the rays of the moonlight and passing out through the window. Horror **overcame** me and I became unconscious.`},

{t:"The Boxes of Earth", x:`*Jonathan Harker's Journal*

**18 May.** I woke in my own bed. I think the Count carried me here. I went to look at the room in daylight, but the door was locked, so I fear it wasn't a dream.

**17 June.** Two large **horse-drawn carts** came into the courtyard, driven by gypsies. They were carrying lots of large, empty, wooden boxes. The gypsies **unloaded** the boxes and left. Somewhere below me I could hear the sound of **spades**.

**24 June.** I went to watch for the Count again last night. I saw him come out of his window. As I waited for his return, I noticed some pretty little **specks** **floating** in the moonlight. The specks danced in front of me, almost hypnotizing me, until they changed into the three women from the night before.

Suddenly I heard a woman crying in the courtyard. I opened my window and looked down. She shouted up at me: 'Monster, give me my child!' Then she beat violently at the great door. I heard the Count calling out, and the wolves answered him with their howls. A **pack** of wolves ran into the courtyard. The woman stopped crying, and the wolves left, licking their lips.

How can I escape from this terrible nightmare?`},

{t:"The Man in the Box", x:`*Jonathan Harker's Journal*

**25 June, morning.** I realized that I have always been in danger and I have never seen the Count in the daylight. Maybe he sleeps while we are awake. I decided to try and get into his room. I shall try to crawl over to his window.

**Same day, later.** I got safely back! I took off my boots and climbed across the big rough stones. The Count's room was empty except for **dusty** furniture and a **heap** of golden coins. There was a door in a corner that led down a dark, circular stairway. At the bottom, I opened another door into a ruined chapel which was used as a **graveyard**. The wooden boxes from yesterday were on the floor. The Count was lying in one of them. He was either dead or asleep. His eyes were open and **stony**, but there was no breath, no beating of the heart. His cheeks were warm and his lips still red. I wanted to search him for his keys, but there was such a look of hate in his dead eyes that I left and crawled back.

**29 June.** This morning the Count said: 'Tomorrow, my friend, we must part. You return to England, and I am leaving to complete some work, so we may never meet again. The gypsies still have work to do, and the carts will come back. My carriage will take you to the Borgo Pass to meet the coach to Bistritz.'

I was **suspicious**, so I asked: 'Why may I not go tonight?'

'Because my coachman and horses are away on business.'

'But I could walk.'

'And your luggage?'

'Do not stay an hour extra against your **will**,' he said with a soft smile.

I followed him downstairs, but when he opened the main door, the howling of the wolves outside was loud and angry. I knew I could not go against the Count's wishes. With 'friends' like these I could do nothing against him.

'Shut the door! I will wait until morning,' I shouted.

He **slammed** the door shut. In silence I went to my room. Count Dracula kissed his hand towards me, with a red light of **triumph** in his eyes.`},

{t:"The Spade", x:`*Jonathan Harker's Journal*

**30 June, morning.** As soon as morning came, I felt safe. I ran down the hall to the front door, but it was locked. I desperately needed to get the key. Without thinking I ran back upstairs and climbed out of my window and down into the Count's room again. I went in, opened the door and went down into the old chapel again.

The Count's box was in the same place. The **lid** was on it, with the nails ready to be hammered down. I knew I needed to search the Count for the key to get out so I lifted the lid and rested it against the wall.

The Count looked much younger. His hair and moustache were dark grey, and his mouth was redder than before. The thought that I was helping him to go to London to feed on people's blood **drove me mad**. I wanted to kill him. I picked up a **spade** and hit his hateful face. But as I did so the head turned, and his horrible eyes **stared** at me. The spade turned in my hand and I hit his forehead. Then the lid fell, hiding him from my sight.

I then heard the sound of carts and voices. The gypsies were coming. I ran back up to the Count's room, planning to escape when the door was opened. But nobody entered. Then I heard a door opening and people moving. When the noise of voices and feet went away, I turned to go back downstairs to the chapel, hoping to find a new entrance. But a sudden wind blew the stair door shut, and I could not open it. I was a prisoner again!

As I write, I can hear the sound of the gypsies moving the boxes and **hammering** the nails into Dracula's box. I hear voices and moving feet. A door is shut, the key turns; another door opens and shuts, another key turns.

I am alone in the castle with these awful women. But I will climb the castle wall, taking some gold with me, and now they are going off into the distance. I will not remain here. I will find a way out of this terrible place!`},

{t:"Whitby", x:`*Letter from Miss Mina Murray to Miss Lucy Westenra*

**9 May.** Dearest Lucy, forgive my delay in writing. I am **longing** to see you, my dear friend, and to be able to talk freely. I am practising **shorthand** for Jonathan. When we are married I will help him with his work. I am also practising with the typewriter. I have just had a few lines from Jonathan from Transylvania. He is well and he will stay there for about a week. There is the ten o'clock bell ringing. Goodbye. Your loving Mina.

*Mina Murray's Journal*

**24 July. Whitby.** Lucy met me at the station and we drove to The Crescent, where she and her mother have rooms. Whitby is lovely: the immense Abbey ruins, the parish church, and the **harbour** below. Lucy told me about Arthur Holmwood, the only son of Lord Godalming, and their coming marriage. That made me sad, as I haven't heard from Jonathan for a month!

**26 July.** Mr Hawkins sent me a very short letter from Jonathan. He was very formal, but he said he was on his way home. Something is not right. I am also anxious about Lucy because she has started walking in her sleep again.

**3 August.** Another week has passed and no news of Jonathan. Each night I am **awakened** by Lucy moving about the room. She tries the door, and finding it locked, she searches for the key.

**6 August.** Another three days, and no news. I wish I knew where to write.

*Taken from The Dailygraph*

**8 August. Whitby.** One of the greatest storms on record hit Whitby very suddenly last night. A strange noise was heard around midnight, then the **sea-fog** came to the land. The wind blew hard, the sea **roared**, and there was lightning and loud thunder that shook everything.

The returning fishing boats were greatly helped by the new searchlight on the **cliff** top. Suddenly it cleared, and we saw a **schooner** coming into the harbour. We all shivered when we saw that a dead man was tied to the **steering wheel**. As the ship crashed into a bank of sand, a huge dog appeared on deck, jumped down and ran straight up the cliff towards the churchyard.

The schooner is called *Demeter*. It sailed from Varna, on the Black Sea, to the English coast. It has a **cargo** of wooden boxes filled with earth. A Whitby solicitor, Mr S. F. Billington, has formally taken possession of the boxes.

The *Demeter's* **log book** was found and it seems some strange and terrible things happened on the ship. First the **crew** felt the presence of a tall thin man, then one by one the crew disappeared until only the captain was left. He was the dead man found tied to the wheel, with a crucifix in his hand.`},

{t:"The Marks on Lucy's Neck", x:`*Mina Murray's Journal*

**8 August.** Lucy was restless all night. The storm was frightening. She got up and dressed twice, but I put her back to bed. We went down to the harbour to see the damage from the storm. The sea was still very dark and dangerous.

**11 August, 3 a.m.** Lucy's bed was empty, in her nightdress. I ran outside to find her and saw her on the opposite cliff, on our favourite long **bench**. I ran all the way there. At the top I could see something white and black bending over Lucy, with a white face and red, gleaming eyes. On **reaching** her, she was alone and she was breathing with difficulty. I put my **shawl** around her and **pinned** it at her neck to keep her warm. Then I woke her and helped her home.

**Same day, noon.** Lucy looks much better. I noticed that, unfortunately, my pin must have hurt her, for there are two little red marks on her neck.

**12 August.** Twice last night I was disturbed by Lucy trying to get out.

**13 August.** I woke in the night. Lucy was pointing to a large **bat** which flew quite close.

**14 August.** We spent today on our bench. Coming home, we stopped to look at the sunset. Suddenly Lucy murmured: 'His red eyes! They are just the same.' She was looking towards our seat, where a dark figure, with large burning eyes, was sitting.

**17 August.** Lucy seems to be growing weaker. I keep the key to our room tied on my wrist. At night she walks around and sits at the open window. I looked at my **pinpricks** on her throat, and saw that the **wounds** are larger.

*Letter from Samuel F. Billington & Son, Solicitors, Whitby, to Messrs. Carter, Paterson & Co., London*

**17 August.** Dear Sirs, Enclosed is the **invoice** for goods sent by Great Northern Railway, to be delivered immediately to **Carfax**, near Purfleet, on arrival tomorrow. Please place the fifty boxes in the chapel, marked 'A' on the enclosed house plan.

*Mina Murray's Journal*

**18 August.** Lucy is much better. I asked her about that night on the bench. She said: 'I didn't quite dream, but it all seemed real. I vaguely remember something dark with red eyes, like what we saw at sunset, and something very sweet and bitter around me.'

**19 August.** Joy, joy, joy! At last, news of Jonathan. He has been ill. Mr Hawkins sent me a letter. I am leaving this morning to help nurse Jonathan, and bring him home.

*Letter from Sister Agatha, Hospital of St Joseph and St Mary, Budapest, to Miss Wilhelmina Murray*

**12 August.** Dear Madam, I am writing at the request of Jonathan Harker, who is not strong enough to write. He has been here for six weeks, suffering from a violent **brain fever**. He needs more rest. P.S. My patient is asleep. I opened the letter to write some more. He has had a terrible shock, and in his delirium talked of wolves, blood, ghosts and demons. He is getting better and in a few weeks I'm sure he will be well again.`},

{t:"Lucy Grows Weaker", x:`*Letter from Mina Harker to Lucy Westenra*

**24 August. Budapest.** Dearest Lucy, I am here with Jonathan. He is very pale and weak. He has had a terrible shock and doesn't remember anything. However, he gave me his journal to keep. His secret is inside. He says I can read it if I want, but I mustn't tell him what is in there without a serious reason. Lucy, we were married today in the hospital, so Jonathan is now my husband. Your ever-loving, Mina Harker.

*Lucy Westenra's Diary*

**24 August. Hillingham.** I must imitate Mina and write things down. Last night I dreamt again. Perhaps it is because I am back home.

**25 August.** Another bad night. At midnight I woke up and there was **scratching** at the window. I am frightened, weak and exhausted.

*Letter from Arthur Holmwood to his friend Dr Seward*

**31 August. Albemarle Hotel.** Dear John, I need help. Lucy is ill. She looks awful and she is getting worse every day. She has agreed to see you. Go to Hillingham for lunch tomorrow and examine her. I am filled with anxiety and want to talk to you alone as soon as you have seen her. Arthur.

*Letter from Dr Seward to Arthur Holmwood*

**2 September. Purfleet Asylum.** My dear friend, I was sorry you had to visit your father when I was at Hillingham. I hope he is better. I can find no physical reason for Lucy's problems. She seems **bloodless**, but without the usual signs of anaemic patients. It must be something mental. She complains of difficulty in breathing, heavy sleep and dreams which frighten her, but which she cannot remember.

I have asked my old friend and university professor, Professor **Van Helsing**, to come from Amsterdam. He knows much about such **obscure** diseases. Yours always, John Seward.

*Letter from Dr Seward to Arthur Holmwood*

**3 September.** My dear Arthur, Van Helsing came and made a careful examination, and he said that there is no physical cause for her illness. There is blood loss but no anaemia. But there is always a cause for everything. We must send him a telegram every day, and if necessary, he will return. Yours always, John Seward.

*Telegram from Dr Seward to Van Helsing*

**6 September.** Terrible change for the worse. Come immediately.`},

{t:"Van Helsing and the Garlic", x:`*Dr Seward's Diary*

**7 September.** At Hillingham, Van Helsing saw Lucy and said, 'She will die from lack of blood! She must have a **transfusion** at once.' Arthur was there and agreed to give his blood. Soon life came back into Lucy's cheeks, while Arthur's grew paler and weaker. Afterwards, as Van Helsing moved the pillow, the black velvet band round Lucy's throat moved, and I saw two holes over the **jugular vein**. They were not large, but they were unpleasant-looking.

Van Helsing said, 'I must return to Amsterdam tonight. Do not let her out of your sight. You must not sleep all night. I shall be back as soon as possible.'

**9 September.** I sat up with Lucy for two nights. I got very tired when I got to Hillingham tonight. Lucy made me a bed on a sofa in the next room, and left the doors open. I slept immediately.

**10 September.** I woke with the Professor's hand on my shoulder. 'How is our patient?' he asked. 'She was well, when she left me,' I answered. But when we entered the bedroom, Lucy was whiter than ever. 'We must begin again,' he said. 'You must give your blood.' We started the transfusion immediately. When some slight colour came back into her cheeks and lips, we stopped.

**11 September.** A parcel of **garlic** flowers arrived for the Professor. In Lucy's room he shut the windows securely, then rubbed the flowers over the **frames**. He did the same around the door. He then made a **wreath** of garlic flowers for Lucy's neck. When Lucy went to bed, he fixed the wreath in place and said: 'Take care not to disturb it, and do not open the windows or the door.' Lucy promised him, and then we left.

**13 September.** At Hillingham, Van Helsing and I were met by Mrs Westenra, who said happily: 'I was worried about Lucy last night, so I took those strong-smelling flowers away and opened the window for a bit of fresh air.'

The Professor's face turned grey. 'As I expected,' he murmured. We hurried up to the room. Lucy was whiter than ever.

We did the transfusion again. Afterwards he told Mrs Westenra that the flowers were part of the cure and must not be removed. He said he would watch Lucy himself tonight.

*Lucy Westenra's Diary*

**17 September.** I am getting strong again. My bad dreams have gone. The **flapping** at the window and the voices that commanded me to do things I can't remember have stopped, too.

**Night.** Tonight I went to bed, taking care that the flowers were in position. I was woken by a flapping at the window, and then a strong wind blew in. I could see the head of a great grey wolf at the window. Mother cried out in fright, sat up, and tore the flowers from my neck, then fell over dead. There was more flapping, followed by a loud crash, and a lot of little specks blew in through the broken window, circling around. I tried to move, but could not.

Alone with the dead! I dare not go out. The air seems full of specks, floating and circling in the wind from the window.`},

{t:"The Death of Lucy", x:`*Dr Seward's Diary*

**18 September.** A telegram from Van Helsing telling me to watch Lucy last night, arrived twenty-two hours late! I rushed to Hillingham by ten o'clock, but nobody answered the door. Van Helsing arrived and I explained the situation.

'I fear we are too late,' he said.

We entered through the kitchen window. In Lucy's bedroom, she and her mother were on the bed. Lucy was white, with a look of terror on her face. Her throat showed the two little **wounds**. Van Helsing listened to Lucy's chest, got some brandy and rubbed it onto Lucy's lips, **gums**, wrists and palms.

Afterwards, I found Van Helsing reading Lucy's diary. He gave it to me.

A friend of Arthur's, Quincey Morris, arrived. He immediately agreed to a transfusion, too.

**19 September.** Lucy seemed weaker each time she woke. We noticed that her teeth were growing longer and sharper. In the afternoon we telegraphed Arthur. She brightened a little when he arrived.

'What does it all mean?' I asked.

'You will understand later,' he answered.

**20 September.** I watched Lucy last night. There was garlic around the windows and doors, and she had a wreath of it around her neck. Once I saw a large **bat** circling and hitting the window with its wings. At six o'clock Van Helsing relieved me and bent down to examine Lucy. When he lifted the flowers, the wounds on her neck had gone.

'She is dying,' he said. 'Wake Arthur!'

Arthur came and sat by her bed, holding her hand. She said in a soft, **voluptuous** voice: 'Arthur, my love, kiss me!'

Van Helsing immediately jumped up and threw him across the room. 'Not for your life!' he said. 'Not for your living soul and hers!'

A look of **rage** crossed Lucy's face, and her sharp teeth showed. Then her eyes closed and her breathing became difficult and then stopped.

'She is dead!' said Van Helsing.

I took Arthur into the sitting-room, where he sat down and **sobbed**, then I returned to Lucy's room.

'There is peace for her at last,' I said.

'No,' said Van Helsing. 'I'm afraid it is only the beginning!'

When I asked him what he meant, he shook his head and answered: 'Wait and see.'`},

{t:"The Lady in White", x:`*Dr Seward's Diary*

**22 September.** Lucy is buried in Hampstead, close to Hillingham. Arthur has gone back home with his friend, Quincey Morris. Van Helsing is going back to Amsterdam, but he will return tomorrow. He says that he has got work to do in London. He can stay with me when he returns.

*The Westminster Gazette, 25 September*

**A HAMPSTEAD MYSTERY.** Recently several young children have come home late after playing on Hampstead Heath. The children say that a mysterious 'beautiful lady' asked them to go for a walk with her. This has always happened in the evening and on some occasions the children were only found in the early morning, with **wounds** in their throats, perhaps made by a rat or small dog. The police are watching carefully any young children in and around the Heath.

*Mina Harker's Journal*

**22 September, train to Exeter.** Today we were in central London and walked down Piccadilly. Jonathan was holding me by the arm when I felt him **clutch** it tightly. I turned to him quickly and saw that he was very pale. He was staring in terror at a tall, thin man with a long nose and a black moustache and beard. The man was looking at a beautiful girl sitting in a carriage, and he didn't notice us. I looked at him carefully. He had a hard, cruel face with big white teeth and very red lips.

'Do you see who it is?' Jonathan asked.

'No, dear,' I said. 'I don't know him, who is it?'

'It is the Count!' he answered. 'But he has grown younger!'

Jonathan was very distressed. We found a comfortable seat in a **shady** place in Green Park, and he fell asleep. When he awoke, he had forgotten about the stranger, and we caught the train back to Exeter.

In the evening a telegram from Van Helsing told us that Mrs Westenra and Lucy were both dead.

**24 September.** When I came home to Exeter I read Jonathan's journal. What horror! Is it true, or only his imagination? In Piccadilly he seemed certain about the dark man, and he wrote in his journal that the terrible Count was coming to London. I began writing out his journal with my typewriter.

*Letter from Van Helsing to Mrs Harker*

**24 September.** Dear Madam, Arthur allowed me to read Lucy's papers, could I visit you to discuss certain matters? Van Helsing.

*Mina Harker's Journal*

**25 September.** Before Van Helsing arrived I sat at the typewriter and copied out my journal. When he arrived he said: 'Madam Mina, this opens a door to me!' Then he asked about Jonathan.

'He had almost recovered,' I said. 'But in London someone reminded him of the terrible things that led to his brain fever.' Then he said: 'I shall stay in Exeter tonight. I want to think about your husband's troubles.' Later, I gave him the typewritten version of Jonathan's journal. We arranged to meet in the morning.`},

{t:"Miss Lucy", x:`*Letter from Van Helsing to Mrs Harker*

**25 September, 6 o'clock.** Dear Madam Mina, As soon as I got to my hotel I read your husband's journal. You may sleep without doubt. Strange and terrible as it is, it is true! I will have much to ask him when I see him tomorrow morning. Yours faithfully, Abraham Van Helsing.

*Jonathan Harker's Journal*

**26 September.** I know about Van Helsing's visit and that he believes my story about the Count. Now I know that I am not afraid, not even of the Count. He is in London; it was him I saw. And Van Helsing will hunt him out. When we met, Van Helsing said: 'I have a great **task** **ahead**, and I need information. Please tell me everything that happened to you.'

This morning, I took him to the station, and got him the papers. He read intently, and suddenly noticed something in the *Westminster Gazette* and grew white. He read it and said to himself: 'My God! So soon!'

*Dr Seward's Diary*

**26 September.** Van Helsing returned to London this morning, giving me the *Westminster Gazette*. 'What do you think of that?' he asked. I read about children being taken away and found with small **wounds** in their throats.

'It's like poor Lucy's,' I said.

'Do you still not understand what Lucy died of? How was all that blood lost?' he asked.

I shook my head, and he went on. 'Were the holes in the children's throats made by the same thing that made them in Miss Lucy's throat?' I nodded my head. 'You are wrong. I wish that was true, but it is far worse. They were made by Miss Lucy!'

'Are you mad?' I shouted.

'I wish I was,' he answered. 'It is difficult to believe, but tonight I will prove it.'

Later that night, we walked to Hampstead churchyard. When we got to the Westenra **tomb**, Van Helsing opened the lid of Lucy's coffin. It was empty! Then we went outside to watch for Lucy. It was a long, cold wait, but suddenly I saw something white moving. The Professor went hurriedly towards it. I followed. A **dim**, white figure moved in the direction of the Westenra tomb. Reaching the Professor, I found he was holding a tiny child in his arms.

'Are you satisfied now?' he said.

I **lit** a **match** and looked at the child's throat. There was no mark of any kind.

'We were just in time,' said the Professor thankfully.

**27 September.** At two o'clock this afternoon, Van Helsing opened the coffin again; there lay Lucy. She was beautiful - her mouth redder, and her cheeks pink. He pulled back her lips.

'See,' he said, 'her teeth are sharper now, because of these children. Are you convinced now, John? She has been dead a week. Most corpses do not look like this. She is **Undead**. I will cut off her head, fill her mouth with garlic and **drive** a **stake** through her body.'`},

{t:"The Tomb", x:`*Note left by Van Helsing at the Berkeley Hotel, for Dr John Seward*

**27 September.** Dear John, I am going back to the churchyard. I don't want the Undead, Miss Lucy, to leave tonight. I shall fix garlic and a crucifix on the door of the tomb to prevent her from going out. But the 'other one' has the power to find her tomb. He is **cunning**. He already **fooled** us when he played us for Miss Lucy's life and we lost. So, if he goes there tonight, he will find me. Read the papers that are with this letter, Harker's diary and the rest, then we will find this great Undead, and cut off his head and turn or drive a stake through his heart, so that the world may rest from him. Van Helsing.

*Dr Seward's Diary (continued)*

**29 September.** Last night, Arthur, Quincey and I met Van Helsing in his room at the Berkeley Hotel. We discussed plans. Arthur was against his plans. So we decided to go to Lucy's grave.

At midnight Van Helsing lit a lamp and we stood around Lucy's coffin.

'John,' he asked, 'was Miss Lucy's body in this coffin yesterday?'

'It was,' I replied.

We opened the coffin. It was empty.

He then put some **Holy Communion wafers** around the tomb.

'So the Undead cannot enter,' he explained.

We all went outside and hid. Later, the Professor pointed to a white figure coming towards us in the moonlight. It was carrying a fair-haired child. As the figure bent over the child, we could see that Lucy's sweetness was now cruelty, and her purity was **voluptuousness**. There was fresh blood **trickling** from her mouth. Van Helsing moved out and **gestured** to us to join him. We stood in a line in front of the tomb door. We **shuddered** with horror.

She moved towards Arthur with her arms open, saying: 'Come to me, Arthur. My arms are hungry for you. Come, and we can rest together!'

Her voice had a terrible sweetness to it, but Van Helsing jumped between them holding up a golden crucifix. She moved backwards, and with rage in her face, rushed past. Then Van Helsing said: 'Arthur, shall I continue my work?'

'Certainly! There can be no horror like this any more.'

Van Helsing removed the holy wafers and Lucy passed back into the coffin. He then put the holy wafers back in place.

'We can do no more until tomorrow,' he said. 'Be here at two.'

**29 September.** Today, when we opened the coffin, there lay Lucy.

'Is it really Lucy's body?' asked Arthur.

'It is and yet it isn't. But soon you will see her as she was, and is,' replied Van Helsing.

He took his equipment from his bag, including a one-metre round, wooden stake with a pointed end, and said: 'Before we start, let me tell you this. When people become Undead, they cannot die. They continue forever, adding new victims. Everyone who dies from the bite of the Undead becomes Undead themselves. Those children whose blood she sucks are not yet in danger, but if she continues, they will change, too. However, if she dies, they will become normal again. When this Undead is changed into a true dead person, then Lucy's soul will be free. So the hand that strikes the blow to set her free is also a blessed hand.'

We all looked at Arthur. He stepped forward and said: 'Tell me what to do and I will do it.'

Van Helsing gave Arthur the stake and a hammer and told him to hammer it through her heart. As he did so, Van Helsing read out a special prayer for the dead. The *thing* in the coffin screamed, shook and **twisted**, and blood poured from the heart, but Arthur didn't stop until the body lay still. When we looked in the coffin, we saw the Lucy we knew, with her sweet, pure face.

Arthur turned to Van Helsing and said: 'Thank you! You have given my dear Lucy her soul again, and given me peace.'

We sent Arthur and Quincey out of the tomb and then we cut off the head and filled the mouth with garlic. We closed up the coffin, **gathered** our **belongings** and came out. The Professor locked the door and gave Arthur the key.

'Now, my friends, one step of our work is done. But there remains a greater task: to find the creator of all this **sorrow** and destroy him. Will you help me?'

We each took his hand in turn and promised to help.

'In two nights we will meet and dine together,' explained the Professor. 'Two other people who you do not know will come, and I will tell you my plans.'`},

{t:"What the Vampire Can Do", x:`*Dr Seward's Diary*

**30 September.** When we arrived at the hotel, Van Helsing found a telegram waiting for him. *Am coming by train. Jonathan is at Whitby. Important news. Mina.*

I collected Mrs Harker and took her home with me. I read her husband's journal again, and she copied my diaries with her typewriter.

*Jonathan Harker's Journal*

**29 September.** Met Mr Billington in Whitby to trace the Count's cargo. I saw the invoice for 'Fifty cases of common earth', and the Count's letters and instructions. I also got copies of the letters to and from Carter Paterson in London.

**30 September.** I met the station master at King's Cross and saw the records: the number of boxes was the same. I then went to Carter Paterson's office and saw their documents. I now know that *all* the fifty boxes which arrived in Whitby from Varna on the *Demeter* were put into the chapel at Carfax.

*Mina Harker's Journal*

**30 September.** We met in Dr Seward's study. The Professor said: 'We have all read the facts. There are such beings as **vampires**. The vampire which is amongst us is strong and **cunning**. He can, within limitations, appear when and where he wants, and in various forms. He can to some extent control storms, fog and thunder, and creatures such as rats, bats, owls, and wolves. He can change size, **vanish** and reappear. It is a terrible task we are beginning. Are you all with me in this?'

We stood up, and making a circle of hands, agreed. Van Helsing continued: 'Vampires need the blood of the living, which makes them grow younger. They do not eat, make shadows or reflections, and they are extremely strong. Our vampire can change himself into a wolf or a bat. He can come in a mist that he creates, and as dust on rays of moonlight. He can enter and leave any place. However, he has limitations. He may not enter any place until he is invited. His power stops with daylight and he must sleep in the boxes of earth he brought from his castle. Some things remove his power: garlic, the crucifix or a rose branch on the coffin all stop him from leaving it. And the stake and the head cut off give him rest, as we have seen with Lucy. Thus, when we find where he lives, we must keep him in his coffin and kill him.

'Now, we will go next door to see whether the fifty boxes are still there; if not, we must find each one. And finally, Madam Mina, your work is ended now. You are too precious to put at risk.'`},

{t:"Carfax and the Rats", x:`*Jonathan Harker's Journal*

**1 October, 5 a.m.** We were given a crucifix, a wreath of garlic flowers, a revolver, a knife, an electric lamp, and an envelope containing holy wafers. Seward opened the Carfax door with a **skeleton key** and said: 'You copied the plans, Jonathan. Take us to the chapel.'

The Professor opened the small **oak** door. There was a terrible smell of old air, fresh blood and earth.

'Count the boxes,' said Van Helsing.

There were only twenty-nine! While searching, I saw a mass of **phosphorescence**, **twinkling** like stars. Then the whole place filled with rats. Arthur, who seemed prepared, went to a door and opened it. Taking out a silver **whistle**, he blew it; three dogs came running in. With the arrival of the dogs all the rats vanished.

We searched the whole house, and found a **receipt** left by Mr Joseph Smollet, a **carrier**, from Walworth. As dawn came, we left. Van Helsing took the front-door key off the bunch of keys, locked the door and kept the key.

When I came back to our room, I found Mina sleeping. She looked paler than usual.

*Mina Harker's Journal*

**1 October.** Last night, after the men left, I wasn't sleepy. I went to bed, but got up again to look out. A thin white mist was **creeping** over the grass towards the house. I went back to bed and had a strange dream: the mist was thicker, climbing up to the windows. I lay against the house and couldn't move, and fog filled the room, covering everything with heavy, cold air. The fog turned into a column, and the red of the gaslight on the wall turned into two red eyes. The last thing I remember was a white face bending over me.

*Jonathan Harker's Journal*

**1 October, evening.** Visited Joseph Smollet in Walworth. He remembered going to Carfax and moving the missing boxes. He said that six were left at 197 Chicksand Lane, Mile End, and six at Jamaica Lane, Bermondsey. He is **enquiring** about the others. Mina is fast asleep, and looks very pale. I expect she is worried.

**2 October, evening.** This morning Smollet told me a Mr Bloxam had moved nine boxes to a Piccadilly address; he described the house. I went to Piccadilly and located it easily. After much research I eventually found out that a foreign nobleman called Count de Ville was the owner of 347 Piccadilly.`},

{t:"The Mist in the Bedroom", x:`*Dr Seward's Diary*

**3 October.** Last night, a mental patient who lived at the asylum had an accident. His name was **Renfield**. His **skull** was fractured and his back broken. When Van Helsing arrived, we relieved the pressure on Renfield's brain, hoping he could then talk. Arthur and Quincey joined us.

Renfield's eyes opened and he said: 'I have had a terrible dream.'

'Tell us your dream, Mr Renfield,' said Van Helsing in a quiet, serious tone.

'No,' said Renfield. 'It was not a dream. It was terribly real!' He paused, and then continued: 'He came to the window in a mist, as he always does. The first time he was solid, and his eyes were bright and angry. He was laughing with his red mouth and his sharp white teeth. Then he promised me things, so I invited him in. After that he **slid** in through the cracks in the window whenever he wanted. But tonight he didn't stay with me - he went after somebody else. I was angry because I wanted him to stay with me. I **grabbed** him, but his eyes burned me and I let go. He lifted me up and threw me down, and the mist **flowed** away under the door.'

'We know the worst now,' said Van Helsing. 'We need all our **arms** - there is not a moment **to spare**!'

Van Helsing turned the **door handle** of the Harker's door. It did not open. We threw ourselves against it. With a crash it **burst** open. The moonlight **shone** brightly through the window and lit up a terrible scene in front of our eyes.

Jonathan was lying on the bed. Kneeling on the side of the bed, dressed in white, was Mina. A black figure stood beside her. It was the Count. He was holding her face against his chest with his hand, forcing her to drink blood. Her white nightshirt was covered in blood.

When we burst into the room, the Count's eyes flamed red, and his sharp, white teeth moved like an animal's. Van Helsing held up his envelope of holy water. We all lifted our crucifixes and advanced towards him. The Count stopped and moved backwards. The moon went behind a cloud, and when Quincey turned on the gaslight, we saw a **faint** mist going under the door.

Arthur and Quincey went to search for him. When Arthur returned he said: 'I could not see him anywhere, and he has destroyed the manuscripts and phonograph recordings.'

'Thank goodness there is another copy in the **safe**!' I interrupted.

'Downstairs there was no sign of him either,' Arthur continued, 'so I went to Renfield's room. The poor **fellow** is dead. What about you, Quincey?'

'I went outside and saw a bat rise from Renfield's window and fly westwards. I expected to see him go into Carfax, but he obviously went to another hiding place. The sky is already red in the east.'

Van Helsing spoke to Mina.

'The Count came into my room,' she said. 'He wanted to kill Jonathan if I was not quiet, then he **sucked** my blood. I felt **compelled** to let him. Then he got angry with me because I was helping you all. As my punishment he forced me to drink his blood from a cut that he made in his chest.'`},

{t:"The Boxes Are Sterilized", x:`*Jonathan Harker's Journal*

**3 October.** We met at 6.30. Van Helsing had a plan. He wanted us to find all of the Count's boxes and **sterilize** them with holy wafers. That way the Count could not use them.

Before Van Helsing left he placed some things in Mina's room to stop Dracula from entering. Then he placed a wafer on her forehead to protect her against the Count. There was a terrible scream as the wafer burned Mina as soon as it touched her skin.

I left with a heavy heart. First, we went into Carfax and we sterilized the boxes there. Next we decided to go to the Piccadilly house. We went to central London by train and found a **locksmith** to help us get in. There was a terrible smell inside. We found eight boxes in the dining-room, and we put a piece of holy wafer in each.

However, one box was missing, and to finish our work we needed to find it. The rest of the house was empty. On a table there were documents for the houses in Piccadilly, Bermondsey and Mile End, and some keys. Arthur and Quincey took the keys and left to sterilize the boxes in Bermondsey and Mile End. The two doctors and I waited for their return - or for the coming of the Count.

*Dr Seward's Diary*

**3 October.** A telegraph boy brought a message: *12.45. Look out for D. He has left Carfax now and gone south.* Soon, Arthur and Quincey arrived. They had sterilized the other boxes.

'He will be here soon,' said Van Helsing. 'Have all your arms ready.'

We were all in position when we heard the key turn in the lock. But the Count was prepared. He jumped into the room, getting past us before we could move. Harker blocked the other door and **struck** at him with his long knife, but the Count was too quick. The knife cut his coat, and banknotes and gold coins fell out. I moved forward, with the crucifix and wafer in my hand. The others did the same, and the Count threw himself backwards. He grabbed some money from the floor, **dashed** across the room and jumped through the window.

We ran to it and saw him climb up the steps and across the yard. He opened the stable door, locked it behind him, and turned, saying: 'You think you can beat me! You will all be sorry for this! You think I have no place to rest, but I have. Your girls are already mine, and soon you will be mine, too!'

We moved into the hall, and the Professor spoke: 'He fears us, and he fears time. Why was he in such a hurry? Why did he take the money? Follow him quickly, and I will stay here and make sure he can use nothing if he returns.'

The Professor put the remaining money and house documents into his pockets. It was nearly sunset. Arthur and Quincey soon returned. They found no trace of Dracula. It was time to return to my house, where Mrs Harker was waiting for us. After supper, the Professor prepared the Harkers' room against the coming of the Vampire.`},

{t:"Hypnosis", x:`*Jonathan Harker's Journal*

**4 October, early morning.** Mina woke me, saying: 'Call the Professor. He must hypnotise me before dawn. I feel that I will be able to speak freely then.'

He arrived and quickly moved his hands around her head. When Mina was hypnotised, he asked: 'Where are you?'

'It is dark,' she said. 'I can hear water moving outside.'

'Are you on a ship?' he asked.

'Yes! I can hear footsteps overhead, and the sound of chains.'

'What are you doing?'

'I am still as death,' answered Mina. Her eyes closed as the sun rose.

'Now we know what was in the Count's mind. He wanted to escape and we must follow,' said the Professor. 'But first let us rest. We are safe, because there is water between him and us which he cannot cross.'

'But why do we need to follow him, now he has gone?' asked Mina.

'Because, my dear Madam Mina, he can live for centuries, and you are a mortal woman,' said Van Helsing. 'Time is important now, because his mark is on your throat.'

*Mina Harker's Journal*

**5 October, 5 p.m.** This is the situation: the Count is returning to Transylvania by ship. The only ship that left for the Black Sea between today and yesterday was the *Czarina Catherine*. The Count and his box are on board and on their way to Varna.

*Dr Seward's Diary*

**5 October.** Van Helsing said: 'Madam Mina is changing, and we must be prepared. The characteristics of the vampire are in her face, - sharper teeth and harder eyes. I fear the Count can read her mind.'

I nodded my agreement.

'We must not tell her our plans,' he went on, 'so she has nothing to tell him.'

**11 October.** At sunset yesterday Mina said: 'I know I will change like Lucy. Please promise me that you will drive a stake through me and cut off my head!'

We all took her hand and promised.

Then she continued: 'That time, if it comes, will perhaps come quickly and without warning. You must act immediately. At such a time I will be your enemy.'

**28 October.** We left England on the twelfth, travelling across land by train, and got to Varna on the fifteenth to await the *Czarina Catherine*. But today we received a telegram saying the ship was entering Galatz, a port on the Danube. Van Helsing fears that the Count read Mina's mind, and knew we were in Varna, and so changed his travel plans to escape from us.`},

{t:"The Last Journey", x:`*Jonathan Harker's Journal*

**30 October.** We visited the *Czarina Catherine*. We discovered that the box was delivered to a man called Skinsky. However, while we were talking, a man arrived saying that Skinsky was dead. His throat was torn open as if by a wild animal!

Mina has examined the maps and believes the box is being taken by boat to join the River Bistritza which flows round the Borgo Pass, the nearest place to Dracula's castle. We decided that Arthur and I will travel down the river in a fast steamboat, while Quincey and Seward will ride along the bank on horses. Meanwhile, Van Helsing and Mina will travel by train to Veresti, then by carriage to Castle Dracula.

*Memorandum by Abraham Van Helsing*

**4 November.** To John Seward, of Purfleet, London, in case I do not see him again.

I am writing by a fire. It is extremely cold, and it will soon snow. Madam Mina sleeps all the time. We reached the Borgo Pass after sunrise yesterday. I hypnotised Mina and she said: 'Darkness and the moving of water.' We **started** up the **by-road**. At sunset I was unable to hypnotise Madam Mina. She stared at me with bright eyes. When she is asleep she looks increasingly healthy. It frightens me.

**5 November, morning.** Yesterday, we camped below the castle. I drew a ring around Madam Mina in the snow and spread **crumbled** holy wafer round it.

'Come here,' I said, testing her.

She stopped after one step. 'I cannot,' she said.

Later it started snowing, and I could see three figures of women **whirling** in the mist. I wanted to put more wood on the fire, but Madam Mina said: 'Stay inside the ring. Here you are safe.'

The whirling figures came closer, but they never entered the circle. Then they materialised into the three women that Jonathan saw in the castle. They pointed at Madam Mina.

'Come, sister, come to us,' they said in sweet voices.

There was horror in Madam Mina's eyes. I was happy because it means she is not yet one of them.

*Dr Seward's Diary*

**5 November.** At dawn we saw some gypsies moving away from the river with a large cart. Snow is falling lightly and wolves are howling.

*Dr Van Helsing's Memorandum*

**5 November, afternoon.** I left Madam Mina in the holy circle, and went to the castle alone. I soon found the old chapel and saw the three women lying in their vampire sleep. They were so beautiful that I almost lost my **nerve**. But then I thought of Madam Mina, and I nerved myself to my work.

I searched all the tombs in the chapel and found only these three Undead phantoms. Another, bigger tomb had just one word on it: **Dracula**.

This was the Undead home of the King-Vampire. I laid some holy wafer in it, to keep him out forever. Then I began my terrible task. The **screeching** and **writhing** of the three women was terrible as the stakes went into their bodies, but in each one I saw the happiness in their faces as their souls were won back. As my knife finished cutting off each head, the whole body crumbled away into dust.

When I stepped into the circle where Madam Mina slept, she woke up and said: 'Let us go to meet my husband. He is coming.'`},

{t:"Sunset", x:`*Mina Harker's Journal*

**6 November.** The Professor and I started walking in the direction that I knew Jonathan was coming from. We could hear wolves howling in the distance.

I was tired and the Professor found a protected place under a large rock and made a bed of furs for me. He then took out his binoculars and searched the horizon.

Suddenly he shouted: 'Look! Madam Mina! Look!'

I saw gypsies on horses pulling a large cart. On the cart was a great square box and I was afraid when I saw it. While I was looking, the Professor drew a ring around us and crumbled some holy wafer around it.

'At least you will be safe from him here!' he said. He looked again. 'They are moving fast to get there before sunset.' Then he shouted again: 'Look! Quincey and Seward are coming from the south!'

I took the glasses and looked. I saw the two men. Then I saw Jonathan and Arthur approaching fast from the north side. I told the Professor and he shouted happily: 'They are all converging. We will have the gypsies covered on all sides.'

He took out his **Winchester** and I got my pistol. Through the binoculars I saw wolves gathering from all directions.

The gypsies and our friends got closer. The Professor and I waited with our guns ready. Suddenly, Jonathan and Quincey shouted: 'Halt!'

The gypsy leader ordered his companions to proceed. But the four men raised their rifles and ordered them to stop. The gypsies quickly surrounded the cart and were determined to finish their task before the sun went down. Jonathan jumped onto the cart and began taking the lid off the box with his big knife. Quincey fought his way through to help him at the other side, one hand holding a wound in his stomach.

The gypsies **gave in**. The sun was almost down on the mountain tops by now. The Count lay in the box on the earth, his red eyes glaring as they saw the **sinking** sun. There was a look of triumph in them.

Then Jonathan's great knife flashed as it cut through the Count's throat, and at the same moment, Quincey's knife **plunged** into his heart. With incredible speed, Dracula's whole body crumbled into dust. And at that moment, a look of peace crossed the Count's face.

The gypsies turned without a word and rode away, and the wolves followed.

At this point Quincey Morris fell to the ground, blood still pouring through his fingers. I ran to him, and so did the two doctors. He took my hand and smiled at me.

'I am happy to have been of service,' he said. 'It was worth dying for.' And to our **bitter grief**, he died.

*NOTE*

Seven years ago we all went through hell. The happiness some of us have enjoyed since then is, we think, **worth** the pain we experienced. It is an added joy to Mina and me that our son, Quincey, has his birthday on the same day that Quincey Morris died.

In the summer of this year we went to some of the places which are full of terrible memories. It was almost impossible to believe the things we saw and heard were true. The castle still stood high above the desolate forests and mountains.

Arthur and Seward are both happily married. When I took all the papers out of the safe, where they were put years ago, apart from the later notebooks and Van Helsing's memorandum, I realised it was all a **mass** of typed pages, and not one authentic document to prove any of the story.

Van Helsing summed it up: 'We don't need **proof**, and we don't ask anyone to believe us. Your little boy Quincey will some day know what a brave woman his mother is. He already knows her sweetness and loving care; later on he will understand how some men loved her so much, that they risked everything **for her sake**.'

*Jonathan Harker*`},

{t:"Check Yourself", x:`*Six questions. The answers are all in the sections above.*

1. Jonathan Harker notices three strange things about the Count before he understands what he is: at the dinner table, in front of the mirror, and on the castle wall. What are they, and what does each one mean?

2. The Count comes to England hidden in fifty boxes. Why boxes, and why earth? What does Van Helsing do to them, and why does that stop the Count?

3. Lucy and Mina are attacked in almost the same way, but only one of them is saved. What is different in Mina's case? Think about the men, about Mina herself, and about what the Count does to her that he never did to Lucy.

4. Van Helsing lists the Count's powers and then his limitations. Make two columns. Which limitation finally kills him?

5. Mina is sent away from the planning, 'because you are too precious to put at risk', and it is exactly then that the Count reaches her. Later she is the one who finds him, by hypnosis and by reading the maps. What is Bram Stoker saying about her?

6. *Dracula* is told entirely through journals, letters, telegrams and newspaper articles - nobody stands outside the story and explains it. Pick one moment that is frightening *because* of who is telling it, and say why it would be less frightening if somebody else told it.`}
]},
{
id:"sl", lang:"en", title:"The Kingdom of the Snow Leopard", author:"Elspeth Rawstron", voice:"Reading guide in English",
chapters:[
{t:"How to use this guide", x:`This is a **reading guide**, not the book. *The Kingdom of the Snow Leopard* was written by Elspeth Rawstron and published in 2011, so it is still **in copyright** and the text itself cannot be copied in here. What you have instead is the whole story told section by section, the vocabulary the book teaches you, and questions to check that you really understood it.

Read a section here, then read the same part in your own copy. The guide tells you *what* happens. The book is where you hear *how* it is told - and that is what the teacher will ask you about.

Every **bold** word can be tapped. The definition comes up in English and in Spanish.
