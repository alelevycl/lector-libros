**La comparsa.** En pleno remonte oyeron un tambor. Por el sendero subía una comitiva con estandarte al frente: el hombre del tambor, un indio descalzo; una negra gordísima con un mulatillo en brazos levantando un estandarte de satiné punzó empenachado de cintas; una vieja con un terrible cigarro; un hombre con el saco al hombro; una muchachita; otro en calzoncillos; mujeres con chicos de pecho; un negro canoso.

Aquello era **El Divino**, como podía verse por la palomita de cera forrada de trapo atada en el extremo del estandarte. El Divino recorría la comarca en ciertas épocas curando los males, y si se daba dinero en recompensa, tanto mayor eficacia. ¿Y el tambor? Es su música.

Howard y su ayudante gozaban de excelente salud, pero aceptaron de buen grado la intervención paliativa. Howard tuvo que sostener al Divino de pie mientras el tambor hacía su piruetesco acompañamiento y la comitiva cantaba que ahí estaba el Divino que lo venía a visitar y que Dios le diera la salud, y que el señor y la señora recibieran mucha felicidad — aunque Howard estuviera exento de toda señora, la canción no variaba.

Pero Howard vio muy claramente que los acólitos no pensaban sino en la pandorga que sostenía el ayudante. La devoraban con los ojos, de modo que sus loas, al igual de sus bocas abiertas, estaban rectamente dirigidas a la estrella. Jamás habían visto eso. Hubo que recogerla y remontarla de nuevo. La comparsa no cabía en sí de gozo y lírico asombro, y se fue con un par de pesos atados al cuello del pájaro.

**La transubstanciación.** Al caer del segundo día la procesión volvió, y expuso su pedido: querían la cometa para hacer un Divino. Le atarían la paloma en la punta. Y el ruido de los roncadores. La comparsa sonreía estúpidamente de anticipado deleite; morirían sin duda si no obtenían aquello.

¡Su pandorga, convertida en Espíritu Santo! Howard halló la circunstancia profundamente casuística: ¿tendría él, aunque agrimensor y fabricante de su cometa, derecho de impedir aquella como transubstanciación? Como no creyó tenerlo, entregó el ser sagrado. En un momento ataron la paloma a la estrella, la enarbolaron en una tacuara y se fueron a gran acompañamiento de tambor, llevando triunfalmente en lo alto la cometa de Howard con sus roncadores vibrantes, transformada en Dios.

Fue el más grande éxito registrado en cien leguas a la redonda: aquel brillante Divino con ruido y cola, y que volaba — o más bien que había volado, pues nadie se atrevió a restituirle su antiguo proceder. Howard lo vio pasar muchas veces, siempre triunfante y otorgadora de bienes, echando melancólicamente de menos su pandorga celestial. No se atrevió a hacer otra por algo de mística precaución.

**El final.** Un viejo del lugar, algo leguleyo por haber vivido un tiempo en países más civilizados, se quejó vagamente de que Howard se hubiera burlado de aquella pobre gente dándoles la cometa. De ningún modo, se disculpó Howard. Sí, de ningún modo… sí, sí, repitió pensativo el viejo, tratando de recordar qué querría decir de ningún modo. Pero no pudo conseguirlo, y Howard pudo concluir su mensura sin que el viejo ni nadie se atreviera a afrontar su sabiduría.

**Qué mirar:** el cuento se ríe de todos a la vez, y de nadie con crueldad. Para la comparsa el teodolito y la cometa son igual de mágicos; para Howard el problema es teológico; y el único que intenta un reclamo no logra acordarse de qué quería decir.`},

{t:"El canto del cisne", x:`El cuento más breve y más extraño del libro.

**La antipatía.** El narrador confiesa que no le gustan los cisnes blancos: le han parecido siempre gansos griegos, pesados, patizambos y bastante malos. Y cuenta que vio morir uno en Palermo sin el menor trastorno poético: estaba echado de costado en el ribazo, y cuando se acercó trató de levantarse y picarlo; sacudió las patas, se golpeó dos o tres veces la cabeza contra el suelo, quedó rendido abriendo desmesuradamente el pico, estiró rígidas las uñas, bajó lentamente los párpados duros y murió. No le oyó canto alguno, aunque sí una especie de ronquido sibilante.

Pero él es hombre, y ella no estaba. Y ella está absolutamente segura de que oyó eso.

**El cisne distinto.** En el lago de una quinta de Martínez había varios cisnes blancos, uno de los cuales se individualizaba en la insulsez genérica por su modo de ser. Casi siempre estaba en tierra, con las alas pegadas y el cuello inmóvil en honda curva. Nadaba poco, jamás peleaba, y vivía completamente apartado de la pesada familia, como un fino retoño que hubiera roto ya para siempre con la estupidez natal. Cuando alguien pasaba a su lado se apartaba unos pasos y volvía a su vaga distracción. Al caer la tarde, sobre todo, su silueta inmóvil y distinta se destacaba de lejos sobre el césped sombrío.

**La aversión.** Celia bajaba todas las tardes al lago, y los cisnes la conocían bien por las galletitas que les tiraba. Únicamente aquel evitaba su aproximación. Lo notó un día y fue decidida a su encuentro, y el cisne se alejó más aún. Repitió su deseo de familiaridad con igual resultado, y desde entonces, aunque usó de toda malicia —fingir que iba a otra parte, acercarse en oblicuo—, no pudo nunca acercarse a él. Una tarde lo corrió hasta perder el aliento y dos pinchos. Fue en vano. Solo cuando Celia no se preocupaba de él, él la seguía con los ojos.

Y sin embargo, le diría ella después, estaba tan segura de que me odiaba.

**El crepúsculo.** Fue en una tarde apacible. Celia, bajando las escaleras, lo vio de lejos echado sobre el césped a la orilla del lago. Sorprendida de esa confianza poco habitual, avanzó incrédula; el animal siguió tendido. Llegó hasta él, y recién entonces pensó que podía estar enfermo. Se agachó apresuradamente y le levantó la cabeza. Sus miradas se encontraron, y Celia abrió la boca de sorpresa, lo miró fijamente y se vio obligada a apartar los ojos.

El cisne cerró los ojos.

*—Me muero —dijo.*

Celia dio un grito y tiró violentamente lo que tenía en las manos.

*—Yo no la odiaba —murmuró él lentamente, el cuello tendido en tierra.*

Cosa rara: ella contó después que al verlo así, por morir, no se le ocurrió un momento preguntarle cómo hablaba. Los pocos momentos que duró la agonía se dirigió a él y lo escuchó como a un simple cisne, aunque hablándole sin darse cuenta de tú, por su voz de hombre.

Se arrodilló y afirmó sobre su falda el largo cuello, acariciándolo. ¿Sufre mucho? Sí, un poco. ¿Por qué no estaba con los demás? ¿Para qué? No podía. ¿Por qué no me quería? No, no es eso; mejor era que me apartara. Sufrir más.

Tuvo una convulsión, y una de sus grandes alas desplegadas rodeó las rodillas de Celia. Y la causa de todo, y sobre todo de esto, dijo mirándola por última vez y muriendo en el crepúsculo: ha sido mi amor a ti.

**Qué mirar:** el cuento empieza burlándose de la leyenda del canto del cisne y termina cumpliéndola en serio. Fíjate también en el truco del narrador: él no estuvo ahí. Toda la escena le llegó por su hermana, que la oyó de Celia.`},

{t:"Los temas y el estilo", x:`**La selva no es paisaje: es personaje.** Misiones, el Chaco, el Paraná. En Quiroga el lugar actúa: el río crece, el frío mata un naranjal en una noche, el estero manda nubes de mosquitos a la hora de la cena, el bambú vuelve a brotar aunque lo claven al revés. Nunca está puesto para adornar.

**El hombre contra la naturaleza — y la naturaleza indiferente.** Los personajes trabajan, calculan, miden, y casi siempre pierden. No hay castigo ni justicia en lo que les pasa: hay un río que corre y un viento que sopla.

**La muerte en seco.** Quiroga la cuenta sin música y sin moraleja: el hombre muere en cuatro minutos, el chico queda idiota, Málter se va a su casa a morir. El final llega y no consuela a nadie.

**La fiebre, la obsesión, la locura.** Son el mismo mecanismo en cuatro cuentos distintos: un tic en *El simún*, unas rayas en *Las rayas*, una lengua en *La lengua*, un pañuelo blanco en *La mancha hiptálmica*. Siempre empieza por un detalle mínimo y crece hasta ocuparlo todo.

**El trabajo y el fracaso.** *Los fabricantes de carbón*, *El monte negro*, *El mármol inútil*, *Los cascarudos*. Quiroga admira a los que hacen cosas con las manos, y casi nunca los deja ganar. Pero el fracaso no los ridiculiza: "hemos hecho lo que debíamos hacer".

**El heroísmo involuntario.** *En la noche*. La mujer hace una epopeya por cinco pesos de ganancia. La pregunta del cuento es cuánto ideal hay dentro de la acción, aunque el motivo que la encendió sea mezquino.

**El humor.** Más de la mitad del libro se ríe: la burocracia en *Polea loca*, la cometa en *El divino*, la crema en *La crema de chocolate*, los bichitos en *Los cascarudos*, el té en *Dieta de amor*. Es humor seco, nunca chistoso, y suele terminar en una frase breve que cierra como una puerta.

**Los animales que hablan.** En *Anaconda* y *El canto del cisne*. No son fábulas con moraleja: las víboras tienen política, vanidad y leyes, y el cisne tiene un amor imposible.

**El estilo.** Frase corta. Dato exacto: grados, kilos, metros, 1680 clavos, treinta y cinco minutos sobre el lomo del rápido. Esa precisión técnica es la que hace creer todo lo demás. El narrador suele ser testigo y arranca como una conversación: "un amigo mío se fue a Fernando Poo", "oí hablar de un hombre". Y casi siempre hay un último dato que reordena el cuento entero: el sueño en *Miss Dorothy Phillips*, las dos rayas en el albañal, la fecha de la salida en *El vampiro*.`},

{t:"Preguntas para repasar", x:`**Sobre Anaconda**
1. ¿Qué es en realidad la Casa, y para qué sirve el suero que fabrican?
2. ¿Por qué las víboras necesitan a las culebras, y por qué las desprecian?
3. ¿Qué descubre la Ñacaniná escuchando a los hombres?
4. Explica el plan de Hamadrías. ¿Qué es el punto de apoyo y por qué es la clave?
5. ¿Por qué el ataque a la caballeriza termina salvando a los caballos?
6. ¿Quién tenía razón sobre qué atacar, y por qué no la escucharon?
7. ¿Por qué los hombres deciden salvar a Anaconda?
8. ¿Qué diferencia establece Anaconda entre matar de frente y matar a traición? ¿Cómo se refleja eso en quién muere y quién sobrevive?

**Sobre los demás cuentos**
1. ¿Qué es el cafard, y cómo destruye la amistad de Briand con su teniente?
2. En *Gloria tropical*, ¿por qué la fertilidad de la isla es una amenaza y no una bendición?
3. ¿Qué es el yaciyateré, y qué le pasa realmente al chico del rancho?
4. ¿Por qué se destruye el horno de Dréver y Rienzi, y cómo reaccionan los dos?
5. ¿Qué es lo que de verdad ofende a Braccamonte en *El monte negro*?
6. En *En la noche*, ¿por qué emprenden el viaje, y qué tiene que hacer la mujer en el rápido del Teyucuaré?
7. ¿Qué es una polea loca, y qué quiere decir con eso el gobernador?
8. ¿Cuál es, según él mismo, la única falla de la religión del doctor Swindenborg?
9. ¿Qué dos mentiras arma Guillermo Grant para acercarse a Dorothy Phillips, y qué lo hace confesarlas?
10. ¿Cuál es la última línea de *Miss Dorothy Phillips, mi esposa*, y cómo cambia todo el cuento?
11. ¿Por qué Gómez Alcain termina pagando más de lo convenido a los indios?
12. ¿Qué tienen que ver las rayas del libro de contabilidad con las del albañal?
13. ¿Por qué Howard entrega su cometa, y qué razonamiento usa?
14. ¿Qué arruina la quinta de monsieur Robin?

**Para pensar y escribir**
1. Elige dos cuentos: uno donde la naturaleza gana y otro donde el hombre aguanta. ¿Qué cambia entre los dos?
2. Varios cuentos empiezan con un narrador que escuchó la historia de otro. ¿Qué gana Quiroga con ese rodeo?
3. Quiroga llena los cuentos de datos técnicos exactos. ¿Para qué sirven, si no son la historia?
4. Compara el humor de *Polea loca* con el horror de *La lengua*. ¿Hay algo en común en cómo están construidos?
5. ¿Por qué crees que Quiroga sacó nueve cuentos del libro? Elige uno de los suprimidos y defiende si debía quedarse o irse.
6. Varios cuentos terminan con un solo dato que lo cambia todo. Elige tres y explica qué cambia en cada uno.

*(Las respuestas están todas en los resúmenes anteriores.)*`}
]}
];

/* ============ STATE ============ */
let book = 0, chap = 0, page = 0, pages = 1, theme = 0;
let size = (window.innerWidth >= 760) ? 23 : 21;
const THEMES = ["ink","amber"];

const NAMES = { m:"Mauricio", g:"Gabriel" };
const T = {
  en:{ chap:"Chapter", page:"Page", spread:"Spread", of:"of",
       back:"\u2190 Back", next:"Next \u2192", toc:"Chapters in this book",
       mark:"Bookmark saved", unmark:"Bookmark removed", mine:"My bookmark" },
  es:{ chap:"Cap\u00edtulo", page:"P\u00e1gina", spread:"Doble p\u00e1gina", of:"de",
       back:"\u2190 Atr\u00e1s", next:"Seguir \u2192", toc:"Secciones de este libro",
       mark:"Marcador guardado", unmark:"Marcador quitado", mine:"Mi marcador" }
};
const t = () => T[(BOOKS[book]||{}).lang || "en"];
function blank(){
  const p = {};
  BOOKS.forEach(b=>{ p[b.id] = {chap:0,frac:0}; });
  return { pos:p, marks:{}, size:size, theme:0 };
}
let readers = null;   // built after BOOKS is defined
let user = null;
const me = () => readers[user] || readers.m;
let live = false;   // true solo cuando el lector abrió un libro de verdad
function initReaders(){ readers = { m:blank(), g:blank() }; }

const $ = s => document.querySelector(s);
const flow = $("#flow"), vp = $("#viewport"), gloss = $("#gloss");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function markup(text){
  return text.split(/\n\n+/).map(p=>{
    let h = esc(p).replace(/\*\*(.+?)\*\*/g,(m,w)=>{
      const key = w.toLowerCase().replace(/[.,!?;:']$/,"");
      if(G[key] || ES[key]) return '<span class="w" data-k="'+key+'">'+w+'</span>';
      return "<strong>"+w+"</strong>";
    });
    h = h.replace(/\*([^*]+?)\*/g, "<em>$1</em>");
    return "<p>"+h+"</p>";
  }).join("");
}

function render(goLast){
  const b = BOOKS[book], c = b.chapters[chap];
  $("#hBook").textContent = b.title;
  $("#hChap").textContent = (chap+1)+". "+c.t;
  document.documentElement.style.setProperty("--size", size+"px");
  flow.innerHTML = '<h2><span class="num">'+t().chap+' '+(chap+1)+'</span>'+esc(c.t)+"</h2>"+markup(c.x)+'<hr class="rule">';
  $("#btnPrev").textContent = t().back;
  $("#btnNext").textContent = t().next;
  flow.style.transition = "none";
  flow.style.transform = "translateX(0)";
  hideGloss();
  requestAnimationFrame(()=>{
    measure();
    page = goLast ? pages-1 : 0;
    requestAnimationFrame(()=>{ flow.style.transition=""; paint(); });
  });
}

function metrics(){
  const pad = window.innerWidth >= 760 ? 80 : 40;   // matches #viewport padding
  const gap = window.innerWidth >= 760 ? 64 : 44;
  const w = vp.clientWidth - pad;
  const cols = w >= 720 ? 2 : 1;
  return { w:w, gap:gap, col:(w - gap*(cols-1))/cols };
}

function measure(){
  const m = metrics();
  flow.style.columnWidth = m.col+"px";
  flow.style.columnGap = m.gap+"px";
  flow.style.width = m.w+"px";
  pages = Math.max(1, Math.round((flow.scrollWidth + m.gap) / (m.w + m.gap)));
}

function paint(){
  const m = metrics();
  flow.style.transform = "translateX("+(-page*(m.w+m.gap))+"px)";
  const b = BOOKS[book];
  const L = t();
  const unit = metrics().col < metrics().w ? L.spread : L.page;
  const chapPart = L.chap+" "+(chap+1)+" "+L.of+" "+b.chapters.length;
  $("#count").textContent = pages > 1
    ? unit+" "+(page+1)+" "+L.of+" "+pages+"  ·  "+chapPart
    : chapPart;
  const done = (chap + (page+1)/pages) / b.chapters.length;
  $("#prog").style.width = (done*100).toFixed(1)+"%";
  if(live) me().pos[b.id] = { chap: chap, frac: done };
  syncMarkBtn();
  save();
}

function next(){
  hideGloss();
  if(page < pages-1){ page++; paint(); }
  else if(chap < BOOKS[book].chapters.length-1){ chap++; render(false); }
}
function prev(){
  hideGloss();
  if(page > 0){ page--; paint(); }
  else if(chap > 0){ chap--; render(true); }
}

/* glossary card */
function showGloss(el){
  document.querySelectorAll(".w.on").forEach(n=>n.classList.remove("on"));
  el.classList.add("on");
  const k = el.dataset.k;
  gloss.querySelector("b").textContent = el.textContent;
  gloss.querySelector(".en").textContent = G[k] || "";
  gloss.querySelector(".en").style.display = G[k] ? "block" : "none";
  gloss.querySelector(".es").textContent = ES[k] || "";
  gloss.querySelector(".es").style.display = ES[k] ? "block" : "none";
  gloss.querySelector(".es").style.borderTopWidth = G[k] ? "1px" : "0";
  gloss.querySelector(".es").style.marginTop = G[k] ? "7px" : "0";
  gloss.style.display = "block";
  const r = el.getBoundingClientRect(), s = $("#stage").getBoundingClientRect();
  const below = r.bottom - s.top + 10;
  const fits = below + gloss.offsetHeight < s.height - 8;
  gloss.style.top = (fits ? below : Math.max(8, r.top - s.top - gloss.offsetHeight - 10))+"px";
}
function hideGloss(){
  gloss.style.display="none";
  document.querySelectorAll(".w.on").forEach(n=>n.classList.remove("on"));
}

/* bookmark */
function markOf(bi){ return me().marks[BOOKS[bi].id]; }
function atMark(){
  const m = markOf(book);
  return !!m && m.chap === chap && m.page === page;
}
function syncMarkBtn(){
  $("#btnMark").classList.toggle("on", atMark());
}
function toggleMark(){
  const id = BOOKS[book].id;
  if(atMark()){ delete me().marks[id]; toast(t().unmark); }
  else{ me().marks[id] = { chap:chap, page:page }; toast(t().mark+" · "+t().chap+" "+(chap+1)); }
  syncMarkBtn(); save();
}
function goMark(bi){
  const m = markOf(bi); if(!m) return;
  live = true;
  book = bi; chap = Math.min(m.chap, BOOKS[bi].chapters.length-1);
  $("#home").classList.remove("open");
  $("#toc").classList.remove("open");
  const b = BOOKS[book], c = b.chapters[chap];
  $("#hBook").textContent = b.title;
  $("#hChap").textContent = (chap+1)+". "+c.t;
  document.documentElement.style.setProperty("--size", size+"px");
  flow.innerHTML = '<h2><span class="num">'+t().chap+' '+(chap+1)+'</span>'+esc(c.t)+"</h2>"+markup(c.x)+'<hr class="rule">';
  $("#btnPrev").textContent = t().back;
  $("#btnNext").textContent = t().next;
  flow.style.transition = "none"; flow.style.transform = "translateX(0)"; hideGloss();
  requestAnimationFrame(()=>{
    measure();
    page = Math.min(m.page, pages-1);
    requestAnimationFrame(()=>{ flow.style.transition=""; paint(); });
  });
}
let tt;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* contents */
function buildToc(){
  const b = BOOKS[book];
  let h = '<div class="grp">'+b.title+' · '+b.author+'</div>';
  const mk = me().marks[b.id];
  if(mk){
    h += '<button class="item bm" data-mark="'+book+'"><span class="n">&#9873;</span>'
       + t().mine+' · '+t().chap+' '+(mk.chap+1)+'</button>';
  }
  b.chapters.forEach((c,ci)=>{
    const cur = (ci===chap) ? " cur":"";
    h += '<button class="item'+cur+'" data-b="'+book+'" data-c="'+ci+'"><span class="n">'+(ci+1)+'</span>'+c.t+'</button>';
  });
  $("#tocList").innerHTML = h;
  $("#tocSub").textContent = t().toc;
}

/* library home */
function buildChips(){
  $("#chips").innerHTML = '<span class="lbl">Lector</span>' + Object.keys(NAMES).map(u=>
    '<button class="chip'+(u===user?" on":"")+'" data-u="'+u+'">'+NAMES[u]+'</button>').join("");
}
function buildShelf(){
  $("#shelf").innerHTML = BOOKS.map((b,i)=>{
    const p = me().pos[b.id] || {chap:0,frac:0};
    const mk = me().marks[b.id];
    const started = p.frac > 0.001;
    const L = T[b.lang || "en"];
    const label = started
      ? (b.lang==="es" ? "Seguir · Capítulo "+(p.chap+1)+" de "+b.chapters.length
                       : "Continue · Chapter "+(p.chap+1)+" of "+b.chapters.length)
      : (b.lang==="es" ? "Empezar · "+b.chapters.length+" secciones"
                       : "Start reading · "+b.chapters.length+" chapters");
    return '<button class="card" data-b="'+i+'">'
      + '<div class="card-in">'
      +   '<div class="spine"><em>'+esc(b.title)+'</em></div>'
      +   '<div><h3>'+esc(b.title)+'</h3>'
      +     '<div class="by">'+esc(b.author)+' · '+esc(b.voice)+'</div>'
      +     '<div class="meta">'+label+'</div>'
      +     (mk ? '<div class="mark"><b>&#9873;</b> '+(b.lang==="es"?"Marcador en el capítulo ":"Bookmark in chapter ")+(mk.chap+1)+'</div>' : '')
      +   '</div>'
      + '</div>'
      + '<div class="cardbar"><i style="width:'+(p.frac*100).toFixed(1)+'%"></i></div>'
      + '</button>';
  }).join("");
}
function openHome(){
  live = false;
  $("#who").hidden = !!user;
  $("#shelfWrap").hidden = !user;
  if(user){ buildChips(); buildShelf(); }
  $("#home").classList.add("open");
  $("#toc").classList.remove("open");
  hideGloss();
}
function openBook(i){
  live = true;
  book = i;
  chap = Math.min((me().pos[BOOKS[i].id]||{}).chap || 0, BOOKS[i].chapters.length-1);
  $("#home").classList.remove("open");
  render(false);
}
function setUser(u){
  user = u;
  size = me().size || size;
  theme = me().theme || 0;
  document.documentElement.dataset.theme = THEMES[theme];
  save();
  openHome();
}

/* optional resume */
const KEY = "readinglamp-v2";
let memStore = null;

function writeStore(v){
  memStore = v;
  try{ localStorage.setItem(KEY, v); }catch(e){}
  try{ if(window.storage) window.storage.set(KEY, v); }catch(e){}
}
async function readStore(){
  try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return r.value; } }catch(e){}
  return memStore;
}

async function save(){
  if(user){ me().size = size; me().theme = theme; }
  try{ writeStore(JSON.stringify({user,book,readers})); }catch(e){}
}
async function load(){
  try{
    const raw = await readStore();
    if(raw){
      const s = JSON.parse(raw);
      if(s.readers){
        ["m","g"].forEach(u=>{
          if(s.readers[u]) readers[u] = Object.assign(blank(), s.readers[u]);
        });
      }
      if(s.user && NAMES[s.user]) user = s.user;
      if(typeof s.book==="number" && BOOKS[s.book]) book = s.book;
      if(user){ size = me().size || size; theme = me().theme || 0; }
    }
  }catch(e){}
}

/* events */
$("#btnNext").onclick = next;
$("#btnPrev").onclick = prev;
$("#btnBig").onclick = ()=>{ size = Math.min(32, size+2); render(false); };
$("#btnSmall").onclick = ()=>{ size = Math.max(16, size-2); render(false); };
$("#btnTheme").onclick = ()=>{ theme = (theme+1)%THEMES.length; document.documentElement.dataset.theme = THEMES[theme]; save(); };
$("#btnHome").onclick = openHome;
$("#shelf").onclick = e=>{ const c = e.target.closest(".card"); if(c) openBook(+c.dataset.b); };
$("#btnReset").onclick = ()=>{
  const keep = { size:size, theme:theme };
  readers[user] = Object.assign(blank(), keep);
  readers[user].pos = blank().pos;
  chap = 0; page = 0; save(); buildShelf();
  toast("Avance borrado");
};
$("#btnMark").onclick = toggleMark;
$("#who").onclick = e=>{ const b = e.target.closest(".who-btn"); if(b) setUser(b.dataset.u); };
$("#chips").onclick = e=>{ const c = e.target.closest(".chip"); if(c && c.dataset.u!==user) setUser(c.dataset.u); };
$("#btnToc").onclick = ()=>{ buildToc(); $("#toc").classList.add("open"); };
$("#btnClose").onclick = ()=> $("#toc").classList.remove("open");
$("#tocList").onclick = e=>{
  const it = e.target.closest(".item"); if(!it) return;
  if(it.dataset.mark !== undefined){ goMark(+it.dataset.mark); return; }
  book = +it.dataset.b; chap = +it.dataset.c;
  $("#toc").classList.remove("open");
  render(false);
};

flow.addEventListener("click", e=>{
  const w = e.target.closest(".w");
  if(w){ e.stopPropagation(); showGloss(w); }
  else hideGloss();
});
gloss.addEventListener("click", e=>{ e.stopPropagation(); hideGloss(); });

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
  if(e.key==="Escape"){ hideGloss(); $("#toc").classList.remove("open"); }
});

$("#stage").addEventListener("touchmove", e=>{ e.preventDefault(); }, {passive:false});
document.addEventListener("touchmove", e=>{
  if(!e.target.closest("#home, .list")) e.preventDefault();
}, {passive:false});

let sx=0, sy=0;
$("#stage").addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
$("#stage").addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); }
}, {passive:true});

let rt;
window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(()=>render(false), 180); });

/* start */
(async()=>{
  initReaders();
  await load();
  document.documentElement.dataset.theme = THEMES[theme];
  chap = Math.min((me().pos[BOOKS[book].id]||{}).chap || 0, BOOKS[book].chapters.length-1);
  render(false);
  openHome();
})();
</script>
