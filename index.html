**El Congreso.** Para las víboras, Hombre y Devastación son la misma palabra. Lanceolada da la alarma y en la caverna de Terrífica —una serpiente de cascabel vieja, con treinta y dos cascabeles, con colmillos largos y muy poca inteligencia— se reúne el Congreso de las Víboras. Están Lanceolada, la pequeña Coatiarita, la esbelta Neuwied, Cruzada, Atroz y Urutú Dorado, la **yararacusú**, ciento setenta centímetros de terciopelo negro con bandas de oro.

**La propuesta incómoda.** Cruzada dice lo que ninguna quiere oír: necesitan a las **culebras**, las primas sin veneno, que ellas llaman las Cazadoras. Las víboras las desprecian —"gusanos corredores", "ojos de pescado"—, pero Cruzada tiene razón: hay que ir hasta la casa, ver y volver, y para eso nadie sirve como la **ñacaniná**, que es veloz, trepadora y valiente.

**Qué mirar:** el cuento arranca con un parlamento político. Las víboras tienen leyes, protocolo, reinas, rivalidades de belleza y vanidad — y esa vanidad va a matarlas.`},

{t:"Anaconda · 2", x:`**La espía.** Cruzada va a buscar a la Ñacaniná, que acepta de mala gana: se parece demasiado a las venenosas, y esa semejanza la condena. Llega a la casa, se instala sobre un tirante entre la pared y el techo, y escucha a cuatro hombres hablando.

**Lo que oye.** La casa es ahora un Instituto de **Seroterapia** Ofídica del gobierno. Fabrican suero contra el veneno de víbora. Tienen un caballo y una mula en vías de **inmunización**, y necesitan víboras: muchas. La Ñacaniná primero se compadece de ellos —se les rompieron cinco tubos de ensayo, los caballos están caídos— hasta que oye la frase que lo cambia todo: van a hacer una famosa cacería de víboras en el país.

**La noticia en el Congreso.** La Ñacaniná vuelve y explica lo que nadie había entendido. No van a matarlas: van a encerrarlas, darles de comer y sacarles el veneno cada veinte días. Lo grave es el resultado: un suero antivenenoso significa hombres y animales inmunizados, y entonces la Familia entera queda condenada a morirse de hambre en su propia selva.

Cruzada se ofrece para empezar la campaña, sin plan: va a ir a tropezarse con alguien. La Ñacaniná la advierte: hay jaulas vacías, y hay un perro negro muy peludo que sigue el rastro de las víboras.

**Qué mirar:** el Instituto existe para salvar vidas humanas. Visto desde el otro lado, es el fin del mundo. El cuento no elige: muestra las dos cosas a la vez.`},

{t:"Anaconda · 3", x:`**Cruzada cae presa.** Va a la casa a matar al primer hombre que aparezca, pero el que aparece es el perro. Lo muerde en la cabeza y lo da por muerto. Llega el hombre de los lentes ahumados, la atrapa con una prensa en la punta de un palo y la tira al **serpentario**.

**Hamadrías.** Ahí, en una jaula de tejido de alambre, hay una serpiente desconocida que infla el cuello de un modo monstruoso: la **hamadrías** o cobra capelo real, de la India, dos metros sesenta, **ofiófaga** —se alimenta de víboras americanas, entre otras cosas. Cruzada le contesta a la altura: le habla de su prima Anaconda, que se alimenta de víboras asiáticas.

Hamadrías le informa de lo peor: el perro no murió ni va a morir, está inmunizado. Y le cuenta su propia historia. Lleva año y medio encerrada, maltratada, torturada cada tanto, manejada como un trapo — y, lo que más la humilla, condenada a entregar su veneno para fabricar el suero que protege a sus enemigos.

**El plan.** Tiene un solo medio de venganza, y depende de una cosa técnica: el **punto de apoyo**. Una serpiente grande, colgando en el aire, no puede desplegar su fuerza; si consigue agarrarse de algo, es otra. Cruzada acepta, aunque puede morir en el intento.

Entonces Hamadrías se abalanza y la muerde tres veces en el cuello. Las otras víboras gritan que es una traidora.

**Qué mirar:** el plan es tan bueno que el lector tampoco lo entiende todavía. Quiroga esconde la clave en una conversación en voz baja.`},

{t:"Anaconda · 4", x:`**Lo que era el plan.** El empleado encuentra a Cruzada tirada, la da vuelta con el pie, ve las marcas de colmillos y la arroja por encima de la barrera de cinc: un bicho menos que vigilar. Pero Cruzada no está muerta, solo paralizada.

Cuando la parálisis empieza a soltarla, recuerda todo y entiende que está a treinta metros y le falta un minuto de vida. Se arrastra desesperada hasta el laboratorio y llega en el instante exacto: el peón sostiene a la Hamadrías colgando en el aire, con las dos manos, y el hombre de los lentes ahumados le está metiendo el vidrio en la boca para apretarle las glándulas.

Cruzada estira los colmillos y muerde el pie descalzo del peón. El hombre grita y baila. El cuerpo colgante de la cobra oscila lo justo para alcanzar la pata de la mesa y enroscarse en ella. Con ese punto de apoyo arranca la cabeza de entre las manos del peón y clava los colmillos hasta la raíz en la muñeca izquierda del hombre de los lentes, justo en una vena.

A los cuatro minutos el hombre está muerto. Las dos serpientes huyen sin que nadie las persiga.

**Qué mirar:** el cuento se tomó páginas para explicarte qué es un punto de apoyo. Ahora sabes para qué. Así construye Quiroga: nada de lo que explica es decoración.`},

{t:"Anaconda · 5", x:`**El Congreso pleno.** Vuelven a reunirse, ahora con más especies: Coralina, Drimobia, Cipó, Radínea, Boipeva, Trigémina, Esculapia. Y entra alguien a quien todas reciben a gritos: **Anaconda**, una boa joven de dos metros cincuenta, amiga de la Ñacaniná, que se lleva bien con el Hombre y detesta a las venenosas. El Congreso es inviolable, así que la dejan pasar.

Llega Cruzada con Hamadrías y cuenta la hazaña: dos hombres fuera de combate.

**La discusión.** Hay dos planes. Hamadrías quiere atacar a los caballos: mientras vivan, un solo hombre puede preparar miles de tubos de suero. La Ñacaniná y Cruzada quieren matar al perro: un perro inmunizado y adiestrado para seguir el rastro es el enemigo más temible que pueden tener, y van a dar la batida antes de veinticuatro horas.

Entre la asiática y la Ñacaniná hay odio inmediato. Hamadrías se burla de las culebras, que no son la Muerte y a quienes el hombre no teme. Y entonces habla Anaconda, con una calma peor que un insulto: el que es fuerte, ágil y veloz se apodera de su enemigo con nervios y músculos, como el gavilán, el tigre, ellas; pero el que es torpe, pesado e incapaz de luchar de frente tiene un par de colmillos para asesinar a traición — como esa dama importada que las quiere deslumbrar con su gran sombrero.

Casi se matan ahí mismo. El Congreso las separa. Gana el plan de Hamadrías. La Ñacaniná advierte que se van a arrepentir.

**Qué mirar:** la pelea de fondo del cuento no es víboras contra hombres, es venenosas contra cazadoras. Matar a traición o matar de frente: ahí está el juicio moral del cuento.`},

{t:"Anaconda · 6", x:`**El asalto.** Sesenta u ochenta víboras inundan la caballeriza. El caballo y la mula se defienden a patadas; los hombres entran con un farol y varas; el perro Daboy pelea en todas partes. El farol se rompe, se hace la oscuridad, y las víboras entienden que tienen que retirarse antes del día.

**La ironía.** La Ñacaniná salió última y oyó, tras la puerta, lo que ninguna otra oyó: un caballo que se está inmunizando necesita el veneno como el agua, y se muere si le llega a faltar. Los caballos se estaban extenuando por falta de veneno. En vez de matarlos, acaban de salvarlos.

**La huida.** Cuentan sus fuerzas: veintitrés muertas, y todas las demás magulladas y sangrando. Ladra el perro sobre el rastro. La Ñacaniná grita la única medida salvadora: desbandarse, separarse, que no las encuentren juntas. Las víboras titubean; les basta una voz de apoyo.

Pero Hamadrías, humillada y vencida por segunda vez, prefiere hundirse del todo y arrastrar a las demás: a la caverna, todas juntas. Y todas la siguen, despavoridas, a la muerte.

La Ñacaniná lo entiende y, pudiendo salvarse sola por su velocidad, se va con ellas.

**Qué mirar:** quien tenía razón no es escuchada, y quien se equivocó dos veces arrastra a todas. El cuento le llama a eso el fin del Imperio.`},

{t:"Anaconda · 7", x:`**El duelo.** Frente a la caverna, Anaconda anuncia que en diez minutos no va a quedar viva ninguna, que el Congreso y sus leyes están concluidos — y que antes de morir quiere una cosa. Hamadrías ya viene hacia ella.

El primer choque lo gana la cobra: le hunde los colmillos en el cuello. Pero Anaconda hace la maniobra de las boas, devuelve el ataque convertido en abrazo y la envuelve. La cobra no suelta presa; Anaconda siente crujir su propia cabeza entre los dientes de la otra. Un último esfuerzo decide la balanza: la boca de la cobra se desprende babeando, y entonces la boca de Anaconda empieza a subir a dentelladas cortas por el cuerpo, por el cuello, por el capuchón, hasta clavarse en la cabeza de su enemiga con un largo crujido de huesos.

Anaconda cae exánime sobre el cuerpo de la asiática: por lo menos está contenta.

**La masacre.** Llegan el nuevo director, Fragoso y el perro. Las víboras, que diez minutos antes atropellaban la entrada de la caverna aterradas, se acomodan contra el murallón de piedra con el cuello erguido y los ojos hechos ascua, y esperan. Caen todas, sin pedir perdón: Terrífica y Neuwied, Urutú Dorado, Cipó, Lanceolada, Esculapia, y las últimas, Cruzada y Ñacaniná. Daboy fue mordido sesenta y cuatro veces y aguanta.

**El final.** Los hombres encuentran a Anaconda, que empieza a revivir, y deciden salvarla: no es de aquí, se enemistó con la cobra real y los vengó a su manera; si logran curarla, tal vez un día los salve de toda esa chusma venenosa. Se la llevan colgada de un palo.

Anaconda no murió. Vivió un año con los hombres, observándolo todo, y una noche se fue. Lo que vino después —el viaje remontando el Paraná, la gran inundación, los **camalote**s— el narrador lo deja para otro relato.

**Qué mirar:** las que mueren son las que atacaron a traición; la que sobrevive es la que peleó de frente y se entiende con el Hombre. Y el último golpe: Anaconda se va pensando en la Ñacaniná, cuyo destino, con un poco menos de altivez, podía haber sido el suyo.`},

{t:"El simún", x:`Un empleado del Ministerio de Agricultura es nombrado inspector de estaciones meteorológicas. Sabe perfectamente de qué se trata, porque él mismo, cuando tuvo una estación a su cargo, llenaba las planillas a ojo mientras cazaba mariposas. Lo mandan a un **obraje** en territorio brasileño, al norte del Iguazú.

**El viaje.** Remonta el Paraná, que después de Posadas se encajona entre murallones negros de cien metros. Es hermoso, y durante cinco días no ve otra cosa que dos colores: el negro de la piedra y el gris del agua.

**El hombre.** El encargado es Briand, un francés de color cetrino y muchas patas de gallo, cortés y de pocas palabras. Contra lo esperado, la estación funciona impecable: todo sube, baja, gira y registra. Incluso inventó un aparatito para medir el rocío. Este hombre no caza mariposas.

**La lluvia.** Entonces empieza a llover y no para en siete días. No hay fósforo que prenda, el cigarro no tira, y el inspector se pasa la semana sentado en el corredor mirando la gotera, la lluvia y el río blanco. Lo que más lo irrita es la calma de Briand, que espera el final del diluvio como quien calcula que faltan quince años. A las tres de la tarde propone tomar caña, y acaba murmurando insultos en voz alta: sangre de pato, borracho perdido, tropical farsante.

**La historia.** Briand se sienta enfrente y le dice con voz muy clara que es una criatura, que no tiene idea de lo que es el aburrimiento. Él estuvo siete meses en un fortín del Sahara: dos oficiales y ochenta soldados, nadie más en doscientas leguas, cuarenta y ocho grados a la sombra, arena en los dientes, en la sopa y en la máquina del reloj, escorpiones. Y el **guebli**, que es el **simún**: cuando sopla hay que acostarse entre sábanas mojadas que se secan antes de que uno se acuerde de cambiarlas, dos días, tres, a veces siete. La tinta se seca entre el tintero y el papel. Un repollo fresco se dobla, amarillea y se seca en un minuto.

Y encima el **cafard**, que es lo que el aislamiento le hace a la cabeza. Briand fue allá con un teniente que era su amigo íntimo, más de lo que ellos dos podrán serlo en veinte generaciones.

**Qué mirar:** el narrador que se queja es el que no entiende nada. El cuento es una lección dada a un chico de ciudad por alguien que estuvo en el infierno.`},

{t:"El simún · el tic", x:`Lo que quiebra la amistad de Briand con su teniente no es el calor ni la arena: es un tic.

El amigo tenía, desde siempre, un movimiento seco de cabeza, como si le apretara el cuello de la camisa. Veinte años de amistad, y Briand ni lo notaba. Pero un día, con amenaza de siroco, levantó los ojos del plato y lo vio hacerlo. Bajó los ojos. Volvió a levantarlos: otra vez. Y entonces vino la pregunta enferma: ¿por qué lo hace? ¿Para provocarme? ¿Por qué justo cuando lo miro? Resistió, y al fin estalló: le gritó que hasta cuándo iba a estar con esas estupideces.

El amigo tiró la servilleta contra la silla y dijo que mejor comer solo en adelante.

Hicieron las paces esa misma noche. Pero ya era tarde. Briand no se atrevía a levantar los ojos porque sabía que en ese momento el otro estaba sacudiendo la cabeza; y descubrió que había una tortura peor: saber que lo estaba haciendo sin que él lo viera. Lo terrible es que el amigo pasaba por exactamente lo mismo, con los razonamientos al revés.

Dejaron de comer juntos. Dejaron de hablarse salvo lo indispensable del servicio. Abandonaron el tú y se trataron de usted, y de capitán y teniente. Cuando tenían que cruzar dos palabras no se miraban, por miedo de ver la provocación en los ojos del otro — y al no mirarse sentían igual la hostilidad. Movían los platos con precaución inmensa, porque al menor movimiento brusco habrían saltado como dos fieras.

Pidieron el relevo. Los dos últimos meses fueron una pesadilla. Briand se dio con alma y vida a cuidar cinco o seis legumbres; el teniente, en el otro extremo del fortín, puso su amor en un chanchito. La noche en que llegó la caravana que los relevaba, Briand estaba agachado en su huerta, acechando con un fusil al chanchito para matarlo de un tiro.

Y termina tranquilo: ahora está acá, tomando caña con un buen amigo mientras llueve. Siete días de lluvia. ¿Y usted quiere que me pegue un tiro por esto? Cuando le vuelvan a parecer pesados siete días de lluvia, acuérdese del tic, del cafard y del chanchito.

**Qué mirar:** el detalle más pequeño posible —un movimiento de cabeza que llevaba veinte años ahí— destruye la amistad más sólida. No hace falta un monstruo; basta el aislamiento y el viento.`},

{t:"Gloria tropical", x:`Un amigo del narrador, Málter, se va a Fernando Poo, en la Guinea española, y vuelve a los cinco meses casi muerto.

**Las dos advertencias.** Antes de irse recibe dos. Un viajante comercial, encanecido de fiebres y contrabandos, le dice que si va no vuelve: no se juega con el Níger, y ser americano no lo protege de nada. Un arboricultor, en cambio, lo envidia con los ojos húmedos: allá los duraznos prenden de gajo, y las hojas caídas de los naranjos echan raíces. ¿El **paludismo**? Una buena plantación de quina y asunto concluido.

Málter se va, con el empleo más raro posible en el país del tse-tsé: dactilógrafo. Anota cuántas toneladas de maní y aceite de palma se mandan a Liverpool.

**La huerta.** A los dos meses se aburre y se acuerda del arboricultor. Baja a tierra y arma su huerta junto a la costa; para hacerlo tiene que machetear un espléndido bambú que estaba en medio. Cerca todo con varas recién cortadas y las usa también de tutores y divisiones. Siembra y espera.

**El chucho.** Al tercer día, mientras riega, siente un hormigueo en los dedos del pie y después en toda la espalda. Media hora más tarde llega al pontón tiritando con treinta y nueve grados de calor ambiente. Sus compañeros, aniquilados por la anemia, levantan la vista al techo: ya empieza Málter. Quince días de accesos, con el catre bailando sobre sus cabezas.

**El chiste cruel.** En la primera tregua baja a ver su huerta. Los porotos brotaron con vigor sorprendente — y también prendieron todos los tutores, todas las estacas de los canteros y del cerco, y el bambú volvió con cinco retoños. Arranca todo, rehace, extirpa el bambú a fondo de azada. Nuevo acceso de fiebre. Vuelve: lo mismo, el bambú con veinte retoños a dos metros. Entonces se pone porfiado: reemplaza las varas por gajos de un árbol deshojado y leproso, y para mayor seguridad los clava al revés, a contrasavia. Nuevo acceso. Vuelve: los gajos leprosos clavados al revés prendieron todos, y el bambú aniquilado agujerea la tierra con brotes como habanos verdes.

**El final.** Tres meses más. Llegan las lluvias de junio: la ropa se enmohece sobre el cuerpo, la carne se podre en tres horas. Cuando su hígado ya no es más que una cosa informe y envenenada, Málter vuelve a Montevideo. En el muelle los amigos esperan a un hombre pálido y ven bajar un cadáver amarillo con un pescuezo que baila dentro del cuello postizo.

El arboricultor lo encuentra poco después y, sin ver la ruina que tiene delante, lo interrumpe: pero allá aquello es maravilloso, ¿eh? ¡Qué vegetación! Málter asiente con la sonrisa más triste y se va a su casa a morir.

**Qué mirar:** la misma fuerza que hace brotar una estaca clavada al revés es la que lo mata. La fertilidad y la fiebre son la misma cosa, y a eso el título le llama gloria.`},

{t:"El yaciyateré", x:`Empieza con una advertencia: cuando uno ha visto a un chiquilín reírse a las dos de la mañana como un loco, con cuarenta y dos de fiebre, mientras afuera ronda un **yaciyateré**, las supersticiones le llegan hasta el fondo de los nervios.

En el sur, dice el narrador, el yaciyateré es solo un pajarraco desgarbado que canta de noche, con un cantito fino y melancólico. En el norte es otra cosa: es el que viene a robar o a enloquecer a los niños.

**La tormenta.** Un amigo y él salen a probar una vela nueva en el Paraná, en una canoa de carrera que ellos mismos construyeron, de proporción 1 a 8: poco estable, pero rapidísima. Hace un calor insoportable y no hay viento. Derivan hasta el **Teyucuaré**. Entonces la tormenta llega de golpe: cruzan una línea invisible y el viento les arranca la vela como un pañuelo. Los arrastra de costado, embarcando veinte litros de agua por ola, con la cara dolorida por los latigazos de la lluvia. En Misiones se pasa de cuarenta grados a quince en un cuarto de hora. Una ola los lanza cinco metros dentro de tierra y se consideran felices.

**El rancho.** Caminan, se meten en el monte en una noche de tinta y tropiezan con un rancho. Hay un peón, su mujer, tres chiquilines y, en una arpillera colgada como hamaca, una criatura muriéndose de un ataque cerebral. ¿Qué tiene? Es un **daño**, responden los padres sin volver casi la cabeza, y siguen sentados mirando el fogón, indiferentes. Los chicos son todo ojos hacia afuera.

Lejos, canta el yaciyateré. Los muchachos se tapan la cara con los brazos.

**La escena.** Los dos hombres toman mate con el torso desnudo, las camisas humeando contra el fuego, sin hablar. El pájaro canta otra vez, más cerca, y el chico enfermo se agita. Les hablan a los padres de paños de agua fría; no los entienden, y además, ¿qué iba a hacer eso contra el yaciyateré? A media cuadra, el canto otra vez: y la criatura responde con una carcajada. Tiene **meningitis** y vuela de fiebre, y le contesta al llamado con una risa. El pájaro canta en el bananal; el chico vuelve a reírse; los muchachos gritan y el fogón se apaga.

Los dos hombres se van: cualquier cosa antes que esa risa.

**Cuatro años después.** Volviendo de levantar el censo de 1914, el narrador pasa por el mismo lugar. En el ribazo del arroyo, contra el bananal oscuro, hay un muchacho desnudo de siete u ocho años, con las piernas flaquísimas y el vientre enorme, una vara de pescar en una mano y una banana a medio comer en la otra. Le habla; es inútil. Al fin el chico se echa a reír, y le cae un espeso hilo de baba hasta el vientre. Es el muchacho de la meningitis. Lo sigue furtivamente hasta la playa para quedarse mirando, con los ojos abiertos, la canoa blanca.

**Qué mirar:** el narrador sabe que es una enfermedad y sabe que es un pájaro. Lo que le eriza la piel es la coincidencia: el canto y la risa contestándose. El cuento no decide si hubo o no un yaciyateré — y el chico quedó igual.`},

{t:"Los fabricantes de carbón · 1", x:`El cuento más tierno del libro, y está contado como un informe técnico.

**Los dos hombres.** Duncan Dréver, hijo de inglés, vive en Misiones. Marcos Rienzi, hijo de italiano, le escribe desde Buenos Aires: quiere ir, cree que una pequeña industria bien entendida podría dar resultado. Dréver contesta tres palabras: véngase y estudiaremos el asunto carbón y **alquitrán**. Rienzi se embarca.

**La caldera.** No tienen capital: tienen la leña del monte, las herramientas, cuatro chapas que sobraron del galpón y las manos. Deciden la **destilación** en vaso cerrado y montan una caldera rectangular de 4,20 por 0,70 metros. Como no pueden ajustar los bordes, deben remacharla a uno por centímetro: 1680 remaches para la unión de las chapas, y como no tienen remaches, cortan 1680 clavos. Rienzi remacha desde afuera; Dréver, apretado adentro con las rodillas en el pecho, soporta el golpe. Se turnan cada hora.

De noche, en la cama, conversan de cualquier cosa, se callan porque tienen sueño, y en pleno silencio uno dice: "yo creo que diecisiete debe ser bastante". Y el otro: "creo lo mismo". ¿Diecisiete qué? Centímetros, remaches, días. Los dos saben perfectamente de qué hablan.

**La ayudante.** Dréver quedó viudo a los tres años de llegar, y crió solo a su hija. Tiene cinco años, es rubia y conoce las herramientas una por una; sabe qué presión hace falta para partir diez cocos y a qué olor se le puede llamar con propiedad **piroleñoso**. Lee, y escribe todo con mayúsculas. Lo llama piapiá.

*—¿Y vas a ganar platita? —No creo, chiquita. —¡Pobre piapiacito querido! No podés nunca ganar mucha plata. —Así es… —Pero vas a hacer un ensayo lindo, piapiá.*

Con Rienzi la relación es otra: vueltas de carnero, carreras a babucha, trampolín, y uno que otro jarro de agua en la cara cuando él se tira al sol sobre el pasto. Rienzi jura, grita "¡es la maldita viejita!", y hace las paces enseguida.

**El horno.** Eligen lo más arriesgado que cabe en el asunto: calefacción en espiral para una caldera horizontal. Tienen sus razones. El día que encienden por primera vez y el humo sale por la chimenea después de haber bajado cuatro veces bajo la caldera, los dos se sientan a fumar sin decir nada, con aire distraído: el aire de los hombres de carácter cuando les sale bien un trabajo en el que pusieron todo.

**Qué mirar:** la precisión. Los milímetros, los grados, los 1680 clavos. Esa exactitud es lo que hace creíble todo lo demás, y es lo que hace que importe cuando se rompe.`},

{t:"Los fabricantes de carbón · 2", x:`**El frío.** Rienzi llegó esperando un país subtropical de calor asfixiante. En cambio: treinta grados al mediodía, cuatro a las ocho de la noche, y bajo cero antes del amanecer. Una madrugada el termómetro marca seis bajo cero; a la mañana siguiente, siete. Dréver duda de su termómetro y va a caballo a verificar en la estación meteorológica de un amigo: son nueve bajo cero. Desde Buenos Aires piden que rectifique la cifra, porque allá se ríen. Dréver anota: 27 de junio, nueve grados bajo cero. El amigo telegrafía once.

—No se ha visto jamás cosa igual.
—Así es.

**La enfermedad.** Entonces la chica se enferma. Dréver la encuentra una tarde acostada en el suelo, fatigada, con treinta y nueve de fiebre. A las siete tiene 40,8. Bañar, cuidar y atender a una criatura de cinco años en una casa de tablas peor ajustada que una caldera, con un frío de hielo y por dos hombres de manos encalladas, no es tarea fácil: hay cuestiones de camisitas, ropas minúsculas, bebidas a horas fijas, detalles que están por encima de las fuerzas de un hombre. Lo hacen igual, con los brazos arremangados.

Seis días. Dréver duerme dos horas de mañana; Rienzi, de noche; cuando la fiebre amenaza, los dos están despiertos y se preparan café que toman en el comedor, instándose mutuamente a descansar y contestándose con un encogimiento de hombros. La chica, que tiene el carácter del padre, contesta con monosílabos secos y sin volver los ojos: ¿cómo te sientes? bien. ¿quieres agua? no. A veces se duerme con la mano del padre entre las suyas, y si él intenta retirarla, aprieta los dedos; entonces Dréver se queda sentado sin moverse, mirándole la carita.

Rienzi hace bromas a la viejita que se hace la enferma y no tiene nada, y después se va a la caldera silbando, porque no es cosa de ponerse a pensar estupideces.

**Las tres horas.** La quinta madrugada la fiebre baja demasiado: treinta y cinco grados, la chica helada, inmóvil, con tics en la cara. Dréver dice lo que teme —una anemia cerebral fulminante— y agrega dos palabras: tengo suerte. Tres horas rodeada de ocho botellas de agua hirviendo. Rienzi camina muy despacio por la pieza con el ceño fruncido. Y en esas tres horas Dréver se da cuenta exacta del lugar inmenso que ocupa en su corazón esa pobre cosita que le quedó de su matrimonio.

A las cinco Rienzi oye que Dréver se incorpora, entra, y desde la puerta ve el brillo de la frente empapada en sudor: salvada.

Salen a la meseta. Dréver se sienta en el sube y baja y echa la cabeza sobre los brazos. Rienzi se va al otro lado del bungalow, porque los hombros de su amigo se sacuden.

**Qué mirar:** las tres horas más importantes del cuento se cuentan sin una sola palabra de emoción. Toda la ternura está en los gestos: la mano que no se puede retirar, el café, los hombros que se sacuden donde el amigo no mira.`},

{t:"Los fabricantes de carbón · 3", x:`**El derrumbe.** La convalecencia va rápido. Rienzi arregla los vasos de condensación, enciende el horno y lo deja al cuidado del peón, un mestizo de indio flaco, de ralo bigote, con siete hijos, que nunca contesta una pregunta sin consultar un rato el cielo y después dice "puede ser". Nunca aceptó encargarse del fuego, pero elige el combustible con un gusto notable: cuando encuentra un buen palo noble para el fuego lo lleva en la carretilla como si ignorara el tesoro que conduce.

A las doce viene a avisar que el fuego sale por otra parte: se hundió el horno. Los dos hombres tienen al instante la misma idea. ¿Abriste la toma de aire? Abrí. ¿Qué leña pusiste? Lapacho.

Eso era todo. El peón, para apresurar la calefacción en beneficio de sus patrones, abrió toda la puerta del cenicero justo cuando sostenía el fuego con lapacho — y el lapacho es a la llama lo que la nafta a un fósforo. La temperatura barrió con la arcilla, el tejido de alambre y la chapa misma. Cuando llegan, la llamarada asciende por el boquete, apretada y rugiente.

Retiran la leña. No hay nada más que hacer.

—Pensar que con cincuenta pesos más hubiéramos hecho un horno en forma…
—¡Bah! Hemos hecho lo que debíamos hacer. Con una cosa concluida no nos hubiéramos dado cuenta de una porción de cosas. Y tal vez hubiéramos hecho algo un poco para la galería.
—Puede ser.

**La despedida.** Rienzi se va: ya hicieron ahí lo que podían; si Dréver consigue unos pesos, él le manda de Buenos Aires lo que necesite y vuelve a ayudarlo. Por lo menos pueden darse el gusto de creer que no hay muchos tipos en el país que sepan sobre carbón lo que ellos.

El último día van a ver la obra. La caldera aparece como una crisálida quemada, abollada y torcida; las chapas se descascaran en escamas azules, y la chica se llena con ellas el bolsillo del delantal. Y recién entonces Rienzi ve lo que nueve grados bajo cero le hacen a una vegetación de trópico: los bananos podridos en pulpa de chocolate, hundidos dentro de sí mismos como en una funda; una planta de doce años quemada hasta la raíz. En el naranjal busca en lo alto el reflejo de oro de siempre y no lo encuentra: el suelo está todo amarillo de naranjas, que el día de la gran helada cayeron todas al salir el sol, con un sordo tronar que llenaba el monte.

En el puerto, los dos amigos se miran sonriendo. *—À bientôt. —Ciao.* La despedida con la chica es más expresiva: desde la playa le grita que vuelva pronto.

Subiendo la barranca, Dréver va callado y su hija le tiende los brazos para que la alce:

*—Se te quemó la caldera, pobre piapiá… Pero no estés triste. ¡Vas a inventar muchas cosas más, ingenierito de mi vida!*

**Qué mirar:** el cuento es la historia de un fracaso técnico completo, y termina siendo una de las cosas más cálidas que escribió Quiroga. Los dos hombres no se quejan: dicen que hicieron lo que debían hacer.`},

{t:"El monte negro", x:`La historia de un hombre que trabaja hasta la extenuación por una razón que es puro orgullo.

**El fracaso.** Braccamonte, italiano, era gerente de una empresa de **quebracho** y **tanino** en el Chaco. Cuando los asuntos se pusieron mal, los capitalistas le quitaron la gerencia; a los dos meses la empresa, sin su vivacidad, fue a la liquidación. Lo acusan de todo: de no haber visto que el quebracho era pobre, que la distancia a puerto era mucha, que los bueyes eran viejos y las **alzaprima**s más. Él grita que nunca le mandaron la cantidad exacta que pedía: si pedía 4000, llegaban 3500; si 2000, 1800.

Queda en la calle con diez mil pesos de deuda, y la condena pública es absoluta. En Resistencia se hace broma: lo primero que se dicen dos personas al encontrarse es "¿y usted no tiene cuentas con Braccamonte?". Le conceden ojo para adivinar un negocio, pero nada más; lo creen incapaz de una tarea ruda, y hasta señalan el cuidado que tiene de su figura: no es hombre de trabajo.

**El motivo.** Lo que más le duele no es la duda sobre su honradez. Lo que lo exaspera es que lo crean incapaz de ganar dinero.

**La empresa.** Un mes nervioso, dos o tres viajes a Rosario, y da con el negocio: comprar por nada una legua de campo al suroeste de Resistencia y abrirle salida al Paraná, aprovechando el alza del quebracho. Se asocia con Banker, un inglés viejo contrabandista de obraje, y a los tres meses de su bancarrota marcha al Salado con bueyes, carretas, mulas y útiles.

**El trabajo.** Las cinco leguas hasta el Paraná están cortadas por **estero**s y riachos. Hay que hacer catorce puentes. Se cortan palmas, se derrumban en la zanja, se cubre con tierra, pasan las carretas y se avanza. El puente grande, de sesenta metros, les lleva dos meses y 2700 palmas: pilares de troncos nivelados en capas cruzadas hasta alcanzar la barranca.

El verano es terrible. Los bueyes se pierden de noche. El agua del riacho amanece un día plateada de peces muertos. Comen **locro** mañana y noche, con el plato alejado sobre las rodillas para que el sudor no caiga dentro, bajo cuatro chapas de cinc donde no se siente entrar el aire. Duermen la siesta bajo mosquiteros de gasa que levantan la temperatura, porque es preferible al martirio de los **polvorines**. De tarde, metidos hasta las rodillas en el fondo podrido del riacho, sosteniendo un tronco en alto con los riñones, los **tábano**s los aguijonean a mansalva. De vez en cuando los detiene la vibración de una serpiente de cascabel, que solo se hace oír cuando están a punto de pisarla.

Pero el momento verdaderamente duro es la cena, cuando el estero empieza a zumbar y manda nubes de mosquitos tan densas que hay que comer caminando de un lado a otro. Llueve cinco días, se termina el charque, y pasan quince días a locro guacho, maíz cocido en agua. Una tarde Banker, paseándose dentro de un nimbo oscuro de mosquitos sin hablar una palabra, tira de pronto el plato contra el suelo y dice que eso no es vida, que se va. Braccamonte lo calma con toda su elocuencia y con el recuerdo del contrato — y después pasa tres días maldiciéndose a sí mismo por esa estúpida empresa.

**El final.** Terminan el puente grande tras dos meses. La mañana en que echan la última palada y las carretas lo cruzan entre la gritería de los peones, los dos socios se quedan parados uno al lado del otro mirando largo rato su obra común, cambiando observaciones cortas que ambos comprenden sin oírlas casi.

En seis meses construyeron catorce puentes con la sola ingeniería de su experiencia. Salen de ahí con las mejillas excavadas, las manos jaspeadas de cicatrices y unas ganas rabiosas de sentarse en paz a una mesa con mantel. Braccamonte vende en 22.000 pesos el campo que compró en 8000 y paga a todos sus acreedores, que ya no lo esperaban — y que siguen creyendo que en la cabeza de ese italiano hay más fantasía que otra cosa.

**Qué mirar:** gana, paga y nadie cambia de opinión sobre él. El cuento no le da la recompensa que buscaba, que era el respeto.`},

{t:"En la noche · 1", x:`Para muchos lectores, el mejor cuento del libro.

**El marco.** El narrador baja el Paraná en plena creciente, desde San Ignacio al ingenio San Juan, en una canoa de sesenta centímetros de ancho, treinta kilos y dos milímetros de espesor, donde un golpe de dedo firme hace daño. Lo manda el griego, su maestro de río, un viejo marinero que fue contrabandista de caña: cuando el agua tape la **restinga**, andá a abrir la boca ante el **Teyucuaré** por los cuatro lados, y si volvés podrás decir que tus puños sirven para algo. Llevá otro remo, porque vas a romper uno o dos. Y así y todo es posible que te ahogues.

**Los burgueses.** Al volver se detiene en Santa Ana, porque de noche los rápidos con el río hinchado son otra cosa. Bajan de la barranca un hombre y una mujer, extranjeros, pulcros, con ese aire de satisfacción y bienestar que se asegura a expensas del trabajo de cualquier otro. Tienen un boliche desde dos años atrás. Lo invitan, y cena mucho mejor que en su propia casa.

El hombre repite que hace bien en quedarse: el Teyucuaré no se puede pasar así como así de noche. No hay nadie capaz de pasarlo — con excepción de mi mujer.

El narrador se da vuelta. Ella coquetea con el cinturón de hule: oh, sí, una sola vez, y sin ningún deseo de hacerlo; entonces éramos un par de locos. El hombre se levanta el pantalón y le muestra, a la luz de un fósforo, una profunda cicatriz cruzada de costurones plateados en la pantorrilla. Es un recuerdo de aquella noche. Una **raya** — y no muy grande, tampoco.

Y el narrador recuerda una historia vagamente entreoída, de una mujer que había remado un día y una noche enteros llevando a su marido moribundo. ¿Y era esa mujer, aquella burguesita arrobada de éxito y de pulcritud?

**Qué mirar:** el cuento empieza por el final y por los protagonistas convertidos en comerciantes prósperos y risueños. Todo lo heroico está contado hacia atrás, y por eso pega más.`},

{t:"En la noche · 2", x:`**Por qué.** Engañados sobre los recursos del país, el matrimonio había agotado en errores de colono recién llegado el poco capital que trajo. Con los últimos pesos compraron una **chalana** inservible, le recompusieron las cuadernas con infinita fatiga y emprendieron un tráfico ribereño: compraban miel, naranjas, tacuaras y paja a los pobladores de la costa y los iban a vender a Posadas, casi siempre malbaratando la mercadería porque al principio ignoraban el pulso del mercado — llevaban miel cuando el día anterior habían llegado barriles, y naranjas cuando la costa amarilleaba.

El 23 de diciembre ella propone llevar el tabaco y las bananas, y traer de vuelta tortas de Navidad y velitas de color para venderlas en los boliches. Bajan esa tarde y remontan de madrugada, con el río hinchado de aguas sucias, sin un remanso donde descansar. No titubean un instante en remontar sesenta kilómetros de ese río por ganar unos cuantos pesos.

Quince horas de remo, ella en los remos y él a la pala en popa, duplicando el esfuerzo cada veinte minutos en cada restinga.

**La picadura.** Ya a la vista de Santa Ana, al pisar el barro, el hombre lanza un juramento y salta a la canoa: sobre el tendón de Aquiles tiene un agujero negruzco de bordes lívidos. Una raya. ¿Te duele mucho? De un modo bárbaro.

Nada hay comparable a ese dolor. Ella recuerda un remedio: aplicaciones de **ají macho** quemado. Lo acuesta en popa y rema tres horas en silencio hasta Santa Ana. No hay ají macho en toda la costa, y no se puede soñar con llegar al pueblo. Entonces recuerda que en el fondo del Teyucuaré, al pie del bananal de Blosset y sobre el agua misma, vive un naturalista alemán que curó a dos vecinos de mordeduras de víbora.

Y vuelve a remar.

**Qué mirar:** nadie en el cuento habla de heroísmo. Hablan de tortas de Navidad y de cinco pesos más. El narrador lo dice al final: ahí estaba el heroísmo, a la espalda de dos míseros comerciantes, desconocido de ellos mismos.`},

{t:"En la noche · 3", x:`Lo que viene es la lucha más vigorosa que pueda entablar un pobre ser humano contra la voluntad implacable de la Naturaleza.

**El río.** Todo la empuja hacia atrás: el río creciendo, el espejismo nocturno que vuelca el bosque sobre la canoa cuando en realidad está trabajando en plena corriente, sus propias manos que mojan el puño del remo de sangre y agua serosa. En la cancha interminable entre el Yabebirí y los primeros cantiles no tiene un instante de tregua: cada tres golpes de remo levantan **camalote**s en vez de agua, que cruzan sobre la proa, se enganchan y hay que ir a arrancarlos bajo el agua.

**Los gritos.** El hombre venía aguantando. Se le escapa un grito y se disculpa: no quise gritar, se me escapó, no lo voy a hacer más. Sabía muy bien lo que significa, ante una mujer que está realizando lo imposible, perder el ánimo. Pero al fin su resistencia queda deshecha, y sin darse cuenta, con la boca entreabierta para no perder tiempo, los gritos se le repiten a intervalos acompasados.

Ella no vuelve la vista. No piensa, no oye, no siente: rema. Hasta que suelta los remos y echa los brazos sobre la borda.

*—No grites…
—¡No puedo! ¡Es demasiado sufrimiento!
—¡Ya sé…! ¡Comprendo…! Pero no grites… ¡No puedo remar!
—Comprendo también… ¡Pero no puedo!*

Queda largo rato aplastada sobre los brazos, inmóvil, muerta. Al fin se incorpora y reanuda muda la marcha.

**El rápido.** Lleva dieciocho horas de remo. Tiene que afrontar en las tinieblas el rápido sur del Teyucuaré, que la lanza diez veces a los remolinos. Diez veces intenta sujetarse al peñón para doblarlo y fracasa. Vuelve al rápido, consigue incidirlo con el ángulo debido, y se mantiene sobre su lomo treinta y cinco minutos remando vertiginosamente para no derivar: con los ojos escocidos por el sudor que la ciega, sin poder soltar los remos un instante, con el peñón a tres metros que no puede doblar, ganando apenas centímetros cada cinco minutos y con la sensación desesperante de estar batiendo el aire, porque el agua huye. Por único estimulante, el alarido acompasado de su marido en popa.

Cuando la canoa embica por fin en la arcilla del puerto de Blosset y ella pretende bajar para asegurar la embarcación, se encuentra de repente sin brazos, sin piernas y sin cabeza —no siente nada de sí misma sino el cerro que se vuelca sobre ella— y cae desmayada.

**La vuelta al presente.** Estuvo dos meses en cama. Él termina el relato poniéndole la mano en el hombro: si no es por esta, no hubiera podido contarle el cuento, señor. Y la mujercita se ríe, y los dos sonríen, tranquilos, limpios y establecidos por fin con un boliche lucrativo, que había sido su ideal.

**Qué mirar:** la pregunta final del narrador es la del cuento entero. ¿Cuánto ideal hay en la entraña misma de la acción, cuando prescinde del motivo que la encendió? Ellos remaron por cinco pesos, y lo que hicieron fue una epopeya.`},

{t:"Polea loca", x:`El cuento más divertido del libro, y una burla perfecta a la burocracia.

**El buscador.** El narrador tuvo alguna vez veleidades de ser empleado nacional, y le frenaba una sola cosa: la obligación de contestar todas las notas. Porque nadie ignora que el delicado mecanismo de la administración requiere que toda nota recibida sea fatal y pacientemente contestada: una sola comunicación puesta de lado trastorna el engranaje hasta lo más hondo de sus dientes.

Entonces oye hablar de un hombre que estuvo dos años en un puesto público sin contestar una sola nota. "He aquí un hombre superior", se dice, y va a verlo.

**El escalón siguiente.** El hombre, un español culto y ya mayor, se ríe: no es cierto, él fue apenas encargado escolar y dejó pasar poco más de un año. Pero conoce algo mejor: un tipo que dejó pasar dos años y algo más sin dignarse echar una ojeada a lo que recibía. ¿Y qué puesto desempeñaba? Gobernador.

Abra usted la boca, le dice. Y cuenta, porque él fue el gobernador que lo sucedió.

**El gobernador.** Lo mandan a una de las cuatrocientas y tantas islas de Filipinas, tan a trasmano de toda ruta que si no es el fin del mundo es la tumba de toda comunicación civilizada. Lleva en el bolsillo su nombramiento y la destitución del otro. Espera un tipo macizo, atrabiliario y gruñón, y se encuentra con un muchacho alto, delgado, muy calvo para su edad, de grandes ojos azules de pájaro alegre y confiado, que lo recibe ofreciéndole chocolate.

El chocolate es el gran enigma de su vida: consiguió diez libras del mejor cacao, encargó la manufactura a un indígena inteligentísimo, todo a su vista y con extremas precauciones — y resultó una cosa imposible. Quiere que el otro lo pruebe y le escriba desde España cómo se hace eso.

**El barril.** El nuevo gobernador pide ver la correspondencia oficial. Con mucho gusto: aquí está. Y pone la mano en el borde de un gran barril abierto, en un rincón del despacho. Está lleno de notas — todas con su sobre intacto, hacinadas como diarios viejos con faja aún. No solo no contestó ninguna: ni las leyó.

**La teoría.** Y aquí viene la idea que da título al cuento. El prejuicio, dice el muchacho, viene de creer que la administración de una nación es una máquina de engranajes y correas tan ligados que el tropiezo de una rueda detiene todo el mecanismo. Error profundo. Entre la augusta mano que firma Yo y la de un carabinero que debe poner todos sus títulos para que se sepa que existe, hay una porción de manos que podrían abandonar sus barras sin que el buque pierda el rumbo. La maquinaria es maravillosa, y cada hombre es una rueda dentada, en efecto. Pero las tres cuartas partes son **polea loca**s, ni más ni menos: giran también, y parecen solidarias del gran juego administrativo, pero en verdad dan vueltas en el aire.

Y señala la prueba: usted cruzó el mundo, vio la isla, vio las caras de sus habitantes —bastante más gordos que yo—, vio al gobernador general. ¿Notó señales de trastorno en alguna parte? ¿Algún balanceo peligroso en la nave del Estado? Me destituyen, usted me reemplaza y aprenderá a hacer buen chocolate. Ese es el trastorno.

**Dos manías más.** Los libros de cuentas se arreglan en cuatro horas, con una paciencia demoniaca, porque el gobernador no entiende la multiplicación: le resultan diabólicos esos números sin ton ni son que se van disparando todos hacia la izquierda. Así que el secretario Urquijo no puede poner "veinticinco meses de sueldo al guardafaro, a tanto por mes"; tiene que escribir primer mes, segundo mes, tercer mes, y sumar. Entonces sí: esto es bien claro, y sobre todo honesto.

Y a la hora de dormir, no usa mosquitero: no soporta la idea de ahogarse dentro de uno. Su solución es la puerta del dormitorio cerrada por una verdadera selva de telarañas, tan tupida y polvorienta que parece un muro, donde no cabe la cabeza de un fósforo sin hacerlo temblar. Jamás entró un mosquito. ¿Y usted por dónde entra? Por aquí, agachado, en cuatro patas; haciéndolo con cuidado la cosa no tiene mayor dificultad. Y hay, concluye con la mirada soñadora, una especie de descanso primitivo en este sueño defendido por millones de arañas que velan celosamente la quietud de uno.

**El final.** Nunca volvió a saber de él; supone que habrá resuelto al fin el misterio del chocolate. Y da su veredicto: las tres cuartas partes de las ideas del peregrino mozo son ciertas. El narrador agrega que así lo comprendió también la Administración, rehusando admitirlo a él en el manejo de su delicado mecanismo.

**Qué mirar:** el cuento no se ríe de un vago. Se ríe de la idea de que todos somos indispensables.`},

{t:"Dieta de amor", x:`Un cuento corto, cómico y con final de humor negro.

**La chica.** El narrador se cruza en la calle con una muchacha delgada, de vestido un poco más largo que lo regular, bastante mona, que pasa con un aire de modesta prisa y una indiferencia tan cabal hacia el badulaque que se da vuelta a mirarla, que lo encanta — aunque el badulaque sea él. La sigue. Ella entra en un zaguán de casa de altos. Y en la pared, en una gran chapa de bronce, él lee:

DOCTOR SWINDENBORG · **FÍSICO DIETÉTICO**

¡Dietético! ¿A quién se le puede ocurrir hilvanar como una sábana estos dos términos disparatados: amor y dieta? Si algo debe comer, y comer bien, es el amor.

Al día siguiente ella lo mira. Y él se enamora igual.

**El pedido de mano.** Lo reciben en el comedor: el padre de pie, con un inmenso sobretodo peludo, las manos en los bolsillos, un grueso pañuelo al cuello y una barba muy grande; una tía desconfiada; y Nora, sentada a la mesa, que no se levanta. El padre lo mira largo rato y hace dos preguntas. La primera: ¿usted está bien seguro de amar a la muchacha? La segunda, la que importa: ¿usted come mucho? Regular, contesta él tratando de sonreírse. La tía lo señala con el dedo como quien señala un cuadro: el señor debe comer mucho. El padre objeta que no importa, que no podrían poner trabas en su vía, le pregunta a la hija si quiere, y al oír que sí lo empuja del hombro: usted es ya de la casa; siéntese y coma con nosotros.

**El régimen.** Desde entonces almuerza y cena ahí todos los días. Y todos los días es lo mismo: una sopa clara y una liviana taza de té. El caldo es la comida y el té es el postre; nada más. De mañana no toma nada, por paternal consejo del doctor.

La primera semana es una lucha: hay en el fondo de todos nosotros un instinto de rebelión bestial que muy difícilmente es vencido, y a las tres de la tarde empieza. Después, la calma: su corazón pasa de sesenta pulsaciones a cuarenta, y ya le cuesta trabajo pensar que los bellos ojos de una muchacha puedan evocar otra cosa que una inefable y helada dicha sobre el humo de dos tazas de té.

Cada vez que intenta tomarle la mano a Nora, el doctor lo ve y lo mira con paternal ternura — y esa noche cenan a las once, y solo té. Al segundo intento ya no tiene fuerzas más que para levantar la mano y dejarla caer inerte sobre la mesa, sonriendo de debilidad como una criatura. El doctor había dominado la última sacudida de la fiera.

**El final.** No son ya sino dos sonámbulos de amor que pasan las horas sentados uno al lado del otro, helados de extraterrestre felicidad, con la sonrisa fija en las paredes. Él escribe seguro de que uno de estos días lo van a encontrar muerto, no hace la menor recriminación al doctor, y pide que no se culpe a nadie de su muerte.

Deja un consejo: nunca, jamás, en el más remoto de los jamases, pongan los ojos en una muchacha que tiene mucho o poco que ver con un físico dietético. Porque la religión del doctor Swindenborg —la de más alta idealidad que él haya conocido, y de ello se vanagloria al morir por ella— tiene una sola falla: haber unido en un abrazo de solidaridad al Amor y la Dieta. Hay muchas religiones que rechazan el mundo, la carne y el amor, y algunas son notables; pero admitir el amor y darle por único alimento la dieta no se le ha ocurrido a nadie.

Y sospecha que por ese comedor vagan de noche cuatro o cinco desfallecidos fantasmas de amor, anteriores a él.

**Qué mirar:** el cuento es una broma llevada hasta el final con total seriedad. Nadie es malvado: el doctor es un idealista, y eso es lo que lo hace fatal.`},

{t:"Miss Dorothy Phillips, mi esposa · 1", x:`El cuento más largo del libro después de *Anaconda*, y el más raro: una comedia romántica sobre el cine, escrita cuando el cine era mudo.

**El enamorado de la pantalla.** Guillermo Grant, treinta y un años, alto, delgado y trigueño, jefe de sección de un ministerio en Buenos Aires, pertenece al grupo de los pobres diablos que salen noche a noche del cinematógrafo enamorados de una estrella. Su teoría: no hay hermosura completa si los ojos no son el primer rasgo bello del semblante. Si fuera dictador, decretaría la muerte de toda mujer que presumiera de hermosa teniendo los ojos feos — y tal vez de dos o tres amigas.

El cine le da algo que la vida no: ver a una mujer hermosa a diez centímetros, media hora seguida. Vive dos vidas, una en la oficina y otra de noche, y sueña con Edith Roberts, Wanda Hawley, Dorothy Phillips, Miriam Cooper.

**La decisión.** Estuvo dos veces a punto de casarse y rompió las dos. De ahí saca su apotegma: no hay mujer en el mundo de la cual un hombre pueda decir cómo será una vez casada. Y de ahí su conclusión: la única esperanza para el que resistió hasta los treinta es casarse de inmediato con la primera chica que le gustó al pasar, sin saber quién es ni cómo se llama; ignorándolo todo menos que es joven y tiene bellos ojos.

Hace entonces un cuadro de diagnóstico diferencial entre cuatro estrellas, y elige: miss Dorothy Phillips. Es casada, pero no importa.

**El fraude.** Las estrellas son difíciles de obtener, y él está apenas en regular posición. Necesita dos cosas: pasar por hombre de fortuna y tener alguna responsabilidad en el orden artístico. Entonces va a un impresor y le encarga un número único de una revista ilustrada de lujo, tipo *L'Illustration* de Navidad pero cuatro veces más voluminosa, llena de retratos de estrellas. El impresor le advierte que no se va a vender un solo ejemplar. Ya lo sé, contesta: haga diez, por diez mil pesos.

Con ese número en la mano se presentará como su director — es decir, como el sudamericano millonario que se ríe de unas decenas de miles de pesos para hacer su gusto. Él mismo lo admite: primera estafa, y segunda estafa más rasante que la anterior. Y hace su defensa: juega mucho para ganar muy poco, porque dos ojos, por hermosos que sean, no han constituido nunca un valor de bolsa. Si al final obtiene esos ojos y ellos le devuelven en una mirada el honor que perdió por conquistarlos, estará en paz con el mundo, consigo mismo y con el impresor.

**Qué mirar:** el narrador te cuenta su estafa antes de cometerla y con todos los argumentos a favor. El cuento no te pide que lo apruebes: te pide que entiendas por qué lo hace.`},

{t:"Miss Dorothy Phillips, mi esposa · 2", x:`**Los avisos.** En Nueva York lo recibe un alto personaje del cine, casado con una estrella, que le da el diagnóstico en dos frases: las estrellas de día lucen poco, tienen manchas y arrugas; y usted o se va a Europa con una de ellas y lo mata la vanidad de su estrella, o se casa y se la lleva a su estancia, y entonces es usted el que la mata a lazo limpio. ¿Su fortuna la ganó o la heredó? La heredé. Se conoce; gástela a gusto. Y de despedida: en el cielo del cine hay estrellas, asteroides y cometas de larga cola sin ninguna sustancia dentro.

En Los Ángeles lo atiende Tom H. Burns, accionista de todo, del mismo tipo rápido y cortante, que le hojea la revista y le cuenta los retratos: hay lo menos ocho de la Phillips. Demasiado repetidos para un simple editor. ¿Le gusta? Bastante. ¿Mucho? Locamente. Es un buen modo de decir. Lo espero a las tres en la Universal.

**Dolly.** En el bar, con quince personas en la mesa, él queda en un rincón sin que nadie le hable. Burns se acuerda de él a mitad de la tarde, lo cambia de asiento y lo presenta. Los retratos no eran ocho: eran doce. Ella los hojea sonriendo, pide quedarse con el número y lo mira por primera vez en los ojos: estoy encantada. El único galanteo de él es su respuesta: el solo hecho de haber publicado doce fotografías suyas lo excusa de contestar.

Después ella se vuelve al vecino de la derecha y no se preocupa más de él. Al despedirse en el auto se acuerda de gritarle que no se olvide de ir al taller esa noche — a una invitación que nadie le había hecho.

**El taller.** Esa noche asiste a la filmación y descubre lo artificial que es todo: el actor solo, quieto, mientras la máquina se le acerca a la cara y el director le grita que mire con melancolía a una escoba o a un tramoyista. Su conclusión sobre arte le gana el respeto de Stowell y de Dolly: lo que vale en una obra, como en las cartas de amor, es la sinceridad, y todo el concepto latino del cine, que pivota sobre la afectación, vale menos que un humilde film yanqui de diez centavos.

Las conversaciones siguen. A Dolly, que lee español porque su abuela era de Texas, la literatura latinoamericana no le gusta: es tan parecido todo, tan mexicano. Burns remata: allá hay sinsontes, pálidas desposadas y declamación en todo.

**La escena.** Una tarde salen solos en auto y ella le pregunta de frente por qué la miraba con tanta atención. Él contesta la verdad: porque durante dos años pensó en ella cuanto puede un hombre pensar en una mujer. Y le explica qué fue lo que valoró: en los momentos de sus películas en que la persona a la que ella ama cree no merecerla, y ella lo mira sin que él lo advierta, esa mirada y ese lento cabeceo y el mohín de sus labios hinchados de ternura no pueden surgir sino de un corazón que sabe hondamente lo que es amar.

Bajan, caminan, ella se deja caer en un banco de la alameda. Él queda inmóvil frente a ella, y de pronto se da cuenta de que la escena es exactamente un film: el automóvil detenido en la calzada, el banco de piedra que él conocía bien, Dorothy Phillips esperando — solo que el que se acerca no es Stowell, es él.

Y antes de bajar del auto, ella le hace la pregunta con voz clara y grave: Grant, respóndame con toda franqueza, ¿usted tiene fortuna? En el espacio de un décimo de segundo él revive toda la historia y ve la sima que él mismo abrió, y en la que se precipita.

Sí, responde.

A ella se le iluminan los ojos y le tiende la mano: ¡hasta pronto, entonces!

**Qué mirar:** Grant construyó la mentira para llegar a ella, y cuando funciona lo destruye. Lo único que no había calculado es la vergüenza.`},

{t:"Miss Dorothy Phillips, mi esposa · 3", x:`**La trampa.** Grant entiende que consiguió lo que fue a buscar y que eso no le sirve: no puede robar, aun tratándose de faldas, un beso, un roce de vestido, una simple mirada que no conquistó pobre. Cada día la quiere más, y precisamente por eso debe terminar. Si ella fuera a esa aventura matrimonial con indiferencia hacia él, acaso hallara fuerzas para llegar al fin: negocio contra negocio. Pero cuando encuentra su mirada y el tiempo se detiene sobre los dos, su amor le oprime la mano como a un viejo criminal y vuelve en sí.

**La borrachera.** En un banquete, cuando quedan solos los hombres y empieza el concierto de ron, el alcohol lo pone agresivo. Stowell —que es, en el fondo, un buen muchacho con suerte— le aparece una y otra vez por delante, y Grant se levanta a brindar: por los grandes ases del cinematógrafo, intérpretes del impulso y del amor, intérpretes y negociantes del arte, por la gran fortuna del arte y por el amor artístico a esa fortuna, William S. Stowell, compañero. Ve las caras contraídas de disgusto, alcanza a medir el fondo de su propia actitud y se retira saludando, ofreciéndose por si alguno quiere seguir hablando mañana.

A la mañana siguiente va a pedirle perdón a Stowell, que le aprieta la mano sonriendo.

**La confesión.** Decidido a irse, cuando está poniendo orden en la valija, suena el teléfono: Dolly, estoy un poco triste, ¿no va a venir? Y va, con el ánimo de quien vuelve a sacrificarse por insignificancias de honor.

Ella le ve la cara y le pone los dedos en el brazo: Grant, ¿qué tiene usted hoy? Y entonces él se lo dice todo: que es un simple miserable, un pillete, un ladronzuelo vulgar; que ella cree que él tiene fortuna porque él mismo se lo dijo y lo dejó decir a todo el mundo; que no tiene nada, ni un millón, ni nada.

¿Por qué me engañó, Grant?

Él salta: eso no. No la engañó, porque acaba de hacer lo que no sabe si todos harían, y es lo único que lo levanta ante sí mismo. Engaño antes, puede ser. Pero quince días decía usted: eran dos años. Y nadie en el mundo la valoró como él, y nadie la va a querer jamás todo cuanto la quiere.

Se sienta en un taburete y apoya los codos en las rodillas, postura cómoda cuando el firmamento se desploma sobre nosotros. Dice que se va mañana, que por eso se lo dijo. Y en ese silencio final oye, como en sueños, una palabra:

**—¡Zonzote!**

Levanta la cabeza y la ve a su lado, con los ojos inmensos y húmedos de amor entregado, y el mohín de los labios hinchados de ternura, exactamente como la soñaba. Ella lo sabía desde el principio. Lo sabía todo Los Ángeles: cuando uno pretenda ser millonario, le explica después Burns, hay que suprimir las informaciones telegráficas. Mal negociante, Grant.

Se casan. Burns, que le recuerda que no tiene un centavo y que Dolly vale dos o tres Grant, le da la idea práctica: ponga en orden el film que ha hecho con Dolly, tal cual, reforzando la escena del bar; el final ya lo tienen pronto; y véndalo a la **Blue Bird**.

**El último golpe.** Y entonces, en la última línea:

*Pero esto es un sueño. Punto por punto, como acabo de contarlo, lo he soñado.*

No le queda más que la emoción, y el pobre paliativo de mandarle el relato a Dolly, con una dedicatoria en que le ruega perdonar las impertinencias de este sueño, muy dulce para el autor.

**Qué mirar:** el cuento se llama *Miss Dorothy Phillips, mi esposa* y es verdad — en el sueño. Fíjate que el relato se vende a sí mismo: lo que Burns le aconseja escribir es exactamente el cuento que acabas de leer.`},

{t:"Los cuentos suprimidos", x:`Acá empieza la segunda parte del libro. Son los nueve cuentos que Quiroga eliminó cuando el libro se reeditó, todos escritos antes de 1916.

Su explicación fue una sola línea: que los suprimía para darle mayor unidad al volumen. Esta edición los recupera por razones filológicas, es decir, para que se pueda leer la obra completa.

**Qué cambia.** Se nota por qué los sacó. Son más tempranos y más desparejos: hay dos o tres que son ejercicios de horror, bastante distintos del resto del libro, y otros que son anécdotas cómicas. Juntos no forman un conjunto; sueltos, varios son muy buenos.

**Aviso.** Tres de estos cuentos son duros: *La lengua*, *El vampiro* y *La mancha hiptálmica*. Los tres están narrados por hombres que perdieron la razón, y hay mutilación, cadáveres y una muerte que el cuento deja sin explicar. Los resúmenes que siguen no entran en detalles, pero conviene saberlo antes.

Los otros seis —*El mármol inútil*, *Las rayas*, *La crema de chocolate*, *Los cascarudos*, *El divino* y *El canto del cisne*— no tienen nada de eso.`},

{t:"El mármol inútil", x:`Un escultor cuenta sus dos fracasos como comerciante. Es un cuento cómico con un fondo moral serio.

**El cálculo.** En una exposición de sus obras, alguien se ríe de la idea de que Gómez Alcain pudiera ser comerciante. Él responde que ya lo fue dos veces, y su mujer también, y cuenta.

Después de su exposición de 1903 estaba harto de celebridades teatrales, crónicas y críticas. Llegó del Chaco un conocido entusiasta que le habló de su vida libre y sus plantaciones de algodón, y él hizo las cuentas en el papel: una hectárea admite quince mil algodoneros, que dan tres mil kilos; a dieciocho centavos el kilo son quinientos cuarenta pesos por hectárea; el primer año treinta hectáreas, el segundo cien, el tercero doscientas — cien mil pesos anuales y libertad para siempre.

Vendió en siete mil pesos todo lo que le quedaba de la exposición. Los ochocientos sobrantes desaparecieron antes de ponerse en viaje: por ahí empezaba su sabiduría comercial. Allá se construyó un edificio muy raro, con algo de rancho y mucho de semáforo, hizo un carrito de asombrosa inutilidad y plantó cien palmeras alrededor de la casa. Para lo fundamental le quedó capital para diez hectáreas, que por sequía y mala semilla fueron cuatro o cinco.

**El desquite.** El verdadero escollo del algodón es el brazo. Consiguió cinco indios viejos que recogían seis o siete kilos diarios en vez de quince o veinte, y después cuatro. Lo robaban descaradamente.

Él sabía que los indios no tenían idea de los números: le pedían veinte pesos por un cuero y veinte por un arco, y quedaban perfectamente satisfechos cuando les ponía dos pesos en la mano; a uno que le pedía cinco pesos por un cachorro le contó con lento énfasis tres monedas de diez centavos —uno, tres, cinco— y el vendedor quedó luminosamente convencido.

Así que decidió desquitarse en la balanza. El primer día le acusó cuatro kilos al que trajo seis, dos al que trajo cuatro, tres al que trajo seis: setenta centavos recuperados. Se decía que era lo más lícito del mundo, porque ellos le robaban con toda conciencia.

Pero en vez de aplacarse, la rabia crecía. Al cuarto día acusó el peso cabal a los dos primeros. Y la rabia seguía creciendo: al tercer indio le aumentó dos kilos, al cuarto tres, al quinto ocho. Porque a pesar de todas sus razones, él estaba sencillamente robando, y su famosa compensación no encerraba ni una pizca más de valor moral que el franco robo de los indios. De ahí su rabia contra sí mismo.

A la tarde siguiente volvió a aumentar las pesadas, pagó más de lo convenido, perdió los adelantos y perdió la confianza de los indios, que por las inesperadas oscilaciones del peso llegaron a darse cuenta de que él y su romana eran dos raros sujetos.

**El restaurante.** El segundo episodio lo hizo con su mujer, que siempre sostuvo que él no tenía idea de lo que es el dinero —y le recordaba el asunto de la harina: fue muy contento a decirle que habían ganado cuarenta centavos, y ella le preguntó cuánto le costaba la harina, cosa que él no sabía porque ni había mirado la factura.

Abrieron un restaurante para peones: en vez de las sardinas y malos asados del almacén, un buen puchero a bajo precio. No pretendían ganar nada, y por eso había cierta probabilidad de que les fuera bien. Tres días perfectos. Al cuarto llegó un peón de miserable flacura a avisar que no podría pagar; comió un mes entero y se fue para siempre. Después un indio con un hijo de cinco años que miraba comer a su padre con inmensos ojos de gula; le sirvieron, y el chico seguía con hambre, porque en su casa eran ocho criaturas. La mujer le dio tasajo, galletitas y dos latas de jamón que él guardaba. Al otro día el indio volvió con dos hijos más, y una semana después la casa era un jardín de infantes. Y como muchos sujetos comprendieron que nada disponía mejor el corazón de esa gente que la confesión llana de tener hambre y no tener dinero, el comercio cerró con un déficit bastante fuerte.

**El final.** Perdió allá cuanto tenía y volvió a Buenos Aires a hacer esculturas. Uno de los oyentes comenta que ahí, por lo menos, no cabe comercio. Y él, con tranquila seriedad, por encima de todas las ironías: sí, cabe. Pero no yo.

**Qué mirar:** el giro del cuento está en que el personaje no fracasa por tonto, sino por decente. Las dos veces pierde dinero exactamente en el momento en que se niega a ser un canalla.`},

{t:"Las rayas", x:`Un cuento de locura construido sobre un juego de palabras.

**La teoría.** El que habla no es un filósofo sino un acopiador de granos de Laboulaye, espinado desde muchacho en los negocios. Su idea: las palabras valen tanto, materialmente, como la propia cosa significada, y son capaces de crearla por simple razón de eufonía. Hace falta un estado especial, es posible. Pero algo que él vio le hizo pensar en el peligro de que dos cosas distintas tengan el mismo nombre.

**Los dos empleados.** Tenía dos: Tomás Aquino, el vendedor, un correntino bajo, de pelo al rape y botines amarillos; y Figueroa, catamarqueño, encargado de los libros, un hombre hecho, muy flaco y de cara color paja, que nunca se reía, mudo y contraído sobre el Mayor con estricta prolijidad de rayas y tinta colorada. Eran amigos estrechos y vivían juntos en un caserón de corredores en bóveda, obra de un escribano que murió loco allá.

**Los síntomas.** Dos años sin una queja. Después empezaron a cambiar, cada uno a su modo. Aquino llegó una mañana con una verbosidad exuberante, hablando y riendo sin cesar, buscando constantemente algo en los bolsillos. Al tercer día cayó con un fuerte ataque de gripe, y volvió después de almorzar inesperadamente curado. Esa misma tarde Figueroa tuvo que retirarse con desesperantes estornudos, y también se curó en horas. Así un mes: la charla delirante de uno, los estornudos del otro, y cada dos días un ataque fulminante y frustrado.

**Las rayas.** Todo pasó, y volvieron a la normalidad. Hasta que el 14 de enero, hojeando de noche los libros, el patrón vio que la última página del Mayor estaba cruzada en todos sentidos de rayas. Figueroa se disculpó murmurando. Al otro día Aquino entregó el Diario, y en vez de las anotaciones había solo rayas en todas direcciones.

Les habló malhumorado. Lo miraron atentos, pestañeando rápido, y se retiraron sin decir una palabra. Desde entonces enflaquecieron visiblemente, cambiaron el modo de peinarse echándose el pelo atrás, y su amistad recrudeció: trataban de estar todo el día juntos, pero no hablaban nunca entre ellos.

Una tarde encontró a Figueroa doblado sobre la mesa rayando el libro de Caja. Ya había rayado el Mayor entero, hoja por hoja, el cartón, el cuero, el metal. Los despidió a los dos. Al recorrer la barraca vio rayas en todas partes: tablas rayadas, planchuelas rayadas, barricas rayadas, y hasta una mancha de alquitrán en el suelo, rayada.

**El final.** Dos días después el dueño de la fonda donde comían vino a preguntar por ellos: no iban más, la puerta estaba cerrada y nadie respondía; y anoche, durante la tormenta, se habían oído gritos adentro.

Fueron quince hombres chapaleando en el agua, echaron la puerta abajo y recorrieron la casa en vano: no había nadie. Pero el piso, las puertas, las paredes, los muebles y el techo estaban rayados, una irradiación delirante de rayas en todo sentido, que en el patio mojado se apretaban tanto que parecía haber hecho explosión la locura.

Las rayas terminaban en el albañal. Y al doblarse a mirar, vieron en el agua fangosa dos **raya**s negras que se revolvían pesadamente.

**Qué mirar:** la palabra se cumple. Ellos rayaron hasta convertirse en rayas — el pez. Esa es la teoría del comienzo, demostrada en la última línea.`},

{t:"La lengua", x:`*Aviso: hay mutilación y locura.*

El narrador escribe desde el Hospicio de las Mercedes y se defiende: propone que a todo el que es lengualarga y se pasa la vida mintiendo y calumniando se le arranque la lengua, y se verá lo que pasa.

**El motivo.** Era dentista, al principio de su carrera. Felippone, que era su amigo, le atribuyó por chiste arrebatos de violencia: que en el hospital había estado a punto de degollar a un dependiente, que una sola gota de sangre lo enloquecía. Sabía perfectamente que un dentista con fama de impulsivo podrá tener todo menos clientela. Todo el mundo lo creyó, y su carrera quedó rota antes de empezar.

**La paciencia.** Lo encontró una tarde y lo abrazó riendo, felicitándolo por la broma. Felippone, desconfiado al principio, se tranquilizó al ver esa falta de rencor de pobre diablo. Siguieron viéndose; consiguió que fuera al consultorio, donde el otro se sorprendió de lo bien que trabajaba. Y mientras sonreía como un simple, él tuvo la santa paciencia de esperar.

Hasta que un día Felippone llegó apurado porque le dolía una muela. Le examinó largamente el raigón manejándole las mejillas con una suavidad de amigo que lo encantó, lo emborrachó de ciencia odontológica haciéndole ver un peligro siempre de temer, y dejó la extracción para el día siguiente.

**El acto.** A las dos en punto Felippone se sentó en el sillón, con miedo, sin apartar los ojos de los suyos. Él lo tranquilizó paternalmente mientras disimulaba en la mano el **bisturí**: es curioso que les impresione más el sillón del dentista que la mesa de operaciones. Le pidió que abriera más la boca. Y le cortó la lengua.

**La parte imposible.** Y entonces, teniendo ya en la mano lo que quería, hizo lo que no tenía ninguna utilidad: miró. Le abrió la boca, acercó la cara y vio asomar entre la sangre una lengüita roja, que crecía rápidamente y se hinchaba como si él no tuviera la otra en la mano. Arrancó el retoño con una pinza y vieron subir dos. Arrancó esas y aparecieron cuatro. Después una infinidad que retoñaba vertiginosamente. Desde ese momento fue una carrera furibunda, arrancando y echando agua y arrancando de nuevo, sin poder dominar aquella monstruosa reproducción. Al fin lanzó un grito y disparó. De la boca le salía un pulpo de lenguas que tanteaban a todos.

Y ya empezaban a pronunciar su nombre.

**Qué mirar:** es la lógica de la pesadilla. Vengarse del chisme cortando la lengua que lo dijo, y descubrir que el chisme se multiplica más rápido de lo que uno puede arrancarlo. La imagen final —las lenguas diciendo su nombre— es exactamente lo que le arruinó la vida.`},

{t:"El vampiro", x:`*Aviso: hay un cadáver y un narrador que perdió la razón.*

Un abogado, Rhode, cuenta entre amigos un caso que tuvo: uno bastante raro por aquí, de vampirismo.

**El hecho.** Rogelio Castelar, un hombre hasta entonces normal fuera de algunas fantasías, fue sorprendido una noche en el cementerio arrastrando el cadáver recién enterrado de una mujer. Tenía las manos destrozadas porque había removido un metro cúbico de tierra con las uñas; al borde de la fosa estaban los restos del ataúd, recién quemado; y como complemento macabro, un gato forastero yacía por ahí con los riñones rotos.

**La confesión.** En la primera entrevista el abogado ve que tiene que habérselas con un fúnebre loco. Al principio el hombre no responde, aunque asiente con la cabeza a todos sus razonamientos; después encuentra en él al hombre digno de oírlo, y habla con un vértigo del que el abogado apenas puede dar idea.

Lo que cuenta es esto: cuando llegó, su casa se había quemado y derrumbado con todo lo que tenía dentro, y su mujer, María, corrió a abrazarlo y se desmayó en sus brazos. Todos se precipitaron sobre él mirándolo con ojos de locos, y se levantó un clamor: esa no es ella, no es ella. Y al bajar los ojos vio que lo que tenía entre los brazos era una mujer que no era María. Entonces se subió a una barrica y gritó por qué, por qué; y de todas partes empezó a oír las voces: murió, murió aplastada, gritó una sola vez, yo sentí que gritaba, la mujer de él murió aplastada.

Y corrieron todos con silenciosa furia a los escombros. A las cuatro de la mañana trabajaba él solo, sin una uña sana. No quedaba sino el piano por remover, y bajo el piano tumbado estaba aplastada la sirvienta.

La sacó al patio y empezó a arrastrarla dando vueltas alrededor. En el hueco de una puerta estaba acurrucada la gata de la casa, estropeada pero viva. La cuarta vez que pasaron frente a ella, la gata lanzó un aullido de cólera; la sexta se erizó; la séptima se levantó y los siguió arrastrando las patas de atrás, esforzándose por alcanzar el pelo de la sirvienta — de ella, no de María.

El abogado lo interrumpe con la única pregunta que importa: entonces eso fue en el cementerio. Y el hombre, aplastándose el pelo y mirándolo con sus inmensos ojos, se derrumba: conque sabías, conque todos lo saben y me dejan hablar una hora.

**El final.** El abogado concluye: no necesitaba más para orientarse. Fue internado enseguida, hace ya dos años — y anoche ha salido, perfectamente curado.

Un hombre joven de riguroso luto pregunta si de noche se da de alta a los locos. ¿Por qué no?, contesta el abogado: el individuo está tan sano como usted y como yo. Por lo demás, si reincide, lo que es de regla en estos vampiros, a estas horas debe de estar ya en funciones. Pero estos no son asuntos míos. Buenas noches, señores.

**Qué mirar:** el cuento tiene dos capas. El relato del loco confunde el incendio con el cementerio, porque en su cabeza son la misma escena. Y el verdadero golpe es el final: no está en lo que pasó, sino en el hombre de luto que escucha, en la fecha de la salida y en la tranquilidad del abogado al despedirse.`},

{t:"La mancha hiptálmica", x:`*Aviso: la muerte de la esposa queda sin explicación y el narrador está perdiendo la razón.*

**La pared.** Alguien pregunta qué tiene esa pared. No tiene nada: está lisa, fría y blanca, solo oscurecida arriba por falta de luz. Pero el dueño de casa contesta que es la mancha hiptálmica, y empieza a contar. Este es mi dormitorio. Mi mujer dormía de aquel lado. Estábamos casados desde hacía siete meses y anteayer murió.

**El sueño.** Una noche su mujer se despertó sobresaltada por un sueño raro, del que no podía recordar nada salvo el título —*La mancha hiptálmica*— y una cara atada con un pañuelo blanco. Él, que es hombre de teatro, se interesó vivamente; después no volvió a pensar en eso.

Días más tarde ella salió del dormitorio con la cara atada por un dolor de muelas, y los dos se acordaron al mismo tiempo y soltaron la carcajada: en cuanto me puse el pañuelo, me acordé. Bromearon todo el día, y de noche, mientras ella se desnudaba, él le gritó desde el comedor "a que no", y ella contestó riendo "¡sí, la mancha hiptálmica!". Y vivieron quince días en plena locura de amor.

**La inquietud.** Después vino otra cosa: un sordo y mutuo acecho de un disgusto que no llegaba y se ahogaba en explosiones de amor furioso. Una tarde ella no lo encontró, entró al cuarto, vio los postigos cerrados y lo vio en la cama extendido como un muerto. Lo llamó corriendo y él no contestó, no se movió, y se desasió con rabia volviéndose a la pared. Después la oyó sollozar con el pañuelo hundido en la boca. Cenaron en silencio, hasta que a las diez ella lo sorprendió en cuclillas delante del ropero, doblando con extremo cuidado, pliegue por pliegue, un pañuelo blanco. ¿Qué haces? Buscaba una explicación justa a lo que nos está pasando.

Y la ola de locura los envolvió de nuevo. Desde el comedor él la oyó desvestirse y aulló el juego: ¿a que no? Y ella: ¡hiptálmica, hiptálmica!, riendo y desnudándose a toda prisa.

**El silencio.** Cuando entró, lo sorprendió el silencio considerable del dormitorio. Se acercó sin hacer ruido y miró: su mujer estaba acostada, el rostro completamente hinchado y blanco, con la cara atada con un pañuelo. Corrió suavemente la colcha, se acostó en el borde de la cama y cruzó las manos bajo la nuca. No había un crujido ni una trepidación lejana. La llama de la vela ascendía como aspirada por el inmenso silencio. Pasaron horas y horas, y las paredes se oscurecían progresivamente hacia el techo.

**El presente.** Los que escuchan levantan los ojos a la pared y los mantienen ahí, y después los fijan en él. ¿Usted nunca ha estado en el manicomio? No que yo sepa. ¿Y en presidio? Tampoco, hasta ahora. Pues tenga cuidado, porque va a concluir en uno u otro. Es posible, perfectamente posible, responde él procurando dominar su confusión de ideas. Y salen.

Está seguro de que fueron a denunciarlo, y acaba de tenderse en el diván. Y como el dolor de cabeza continúa, se ha atado la cara con un pañuelo blanco.

**Qué mirar:** el cuento nunca dice de qué murió ella, y el narrador no es alguien en quien se pueda confiar. Lo que sí hace es cerrar el círculo: el sueño era el título de este cuento y la cara atada con el pañuelo — y al final la cara atada es la de él.`},

{t:"La crema de chocolate", x:`Un cuento cómico sobre ser médico y cocinero a la vez en el mismo lugar: a más de difícil, peligroso.

**El médico.** En el Chaco, el narrador —Fernández— es agricultor, médico y cocinero, a ocho leguas de toda población. Su carrera médica empieza a los cuatro días de llegar: lo despiertan de noche por un indio del obraje al que acaban de apalear un brazo. Ve enseguida que no tiene nada y que lo que tiene es un gran deseo de farmacia, así que le frota el brazo con bicarbonato de soda y le indica que se ponga trapos mojados encima para que el remedio haga buen efecto. Al día siguiente el muchacho está sano — pero sin la maniobra del polvo blanco en el frasco azul jamás se habría decidido a curarse con solo trapos fríos.

El segundo eslabón es más serio: le abre con un bisturí una infección de un mes en la mano del capataz de la estanzuela, con bicloruro hirviendo. El hombre resiste heroicamente el dolor y a los ocho días está curado.

**El noviazgo.** Rosa, la mujer del capataz, le tiene cierta respetuosa ternura por su ciencia y su democracia, y quiere casarlo. A legua y media, en pleno estero Arazá, hay una muchacha enferma, flaquísima, con el estómago perdido. Andá a curarla, don Fernández, y te casás con ella.

Va. Eduarda tose un poco, tiene la cara llena y las piernas delgadísimas, hermosos ojos y unas abominables zapatillas nuevas de elástico que se puso para la visita. Es **dispéptica** y desde que empezaron las lluvias no come otra cosa que tasajo. Con el régimen más elemental empieza a recobrar vida.

**La crema.** Para el cumpleaños del capataz, Rosa le pide un postre para el baile. Él elige la crema de chocolate que al capataz le había gustado, y encarga diez litros de leche, sesenta huevos y tres kilos de chocolate. Hay que mandar a buscar el chocolate a Resistencia.

Y en plena función, la crema se corta. Y se corta de un modo tal que aquello se convierte en una esponja de caucho, una madeja de oscuras hilachas elásticas, algo como estopa empapada en aceite de linaza. Los dos cocineros se miran: la crema se parece endiabladamente a una muerte súbita. ¿Tirarla y privar a la fiesta de su principal atractivo? No era posible — y además era su obra personal, siempre muy querida. Así que resuelven prolongar la cocción para darle buena consistencia, apelmazan todo en una olla y descansan.

**La degustación.** A las once, los dos se insinúan hipócritamente en el comedor, buscando moscas por las paredes. "Van a morir todos", murmura el compañero. El primero es el capataz de los carreros, un hombrón silencioso de enormes pies descalzos, que se sirve a fuerza de cuchillo una porción delicadísima — y al que le llenan el plato. Prueba con gran comedimiento mientras los dos no le apartan los ojos de la boca. ¿Rico, eh? ¡Macanudo, che patrón! Por malo que fuera, tenía gusto a chocolate.

El momento crítico es el futuro suegro, que entra balanceándose y anuncia que él ya ha comido crema de chocolate una vez. Estamos frescos, murmuran. Pero el hombre prueba lentamente, deja cuchillo y tenedor y alza la cabeza: ¡Rico, le digo! ¡Qué don Fernández! ¡Sabe de todo!

**El problema.** Cuando le llega el turno a su novia, el suegro pregunta si Eduarda puede comer. Él cree sinceramente que no: para un estómago sano aquello está bien, pero para una dispéptica su esponja es un sencillo veneno. Y sin embargo se enternece, porque la muchacha ojea la olla con mucho más amor que a él, y piensa que acaso jamás en la vida vuelva a probar cosa tan asombrosa, hecha por un chacarero médico y pretendiente suyo. Así que responde serenamente: sí, puede comer, le va a gustar mucho.

**El final.** Ninguno murió. Dos semanas después supo por Rosa que su prometida había estado enferma los días siguientes al baile, y se declaró culpable: no debió haber comido la crema. Rosa lo desmiente indignada — ¡qué crema, si le gustó! Se enfermó porque usted no bailó con ella, y porque no ha vuelto a verla.

Cuando por fin va, la muchacha tiene novio de verdad: un españolito con gran cinto y pañuelo criollos.

**Qué mirar:** el narrador se ríe de sí mismo todo el tiempo. Su ciencia médica funciona por el frasco azul, su cocina es un veneno, y el único diagnóstico correcto del cuento lo hace Rosa.`},
