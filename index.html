  :root{
    --bg:#0F141B;
    --panel:#161E28;
    --ink:#EDE6D6;
    --dim:#8E9AAA;
    --brass:#D3A03C;
    --rule:#2A3644;
    --size:20px;
    --lh:1.58;
    --ui:"Lectura",-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  }
  /* la tela de cada libro: una repisa se lee por color, no por texto */
  [data-tint="bb"]{--cloth:#8A5A33}
  [data-tint="ot"]{--cloth:#495A51}
  [data-tint="np"]{--cloth:#C2742C}
  [data-tint="aq"]{--cloth:#3C6A49}
  [data-tint="dr"]{--cloth:#7B2B2E}
  [data-tint="sl"]{--cloth:#59738E}
  [data-theme="amber"]{
    --bg:#1B1611;
    --panel:#241D16;
    --ink:#F3E6CD;
    --dim:#A3907A;
    --brass:#E09A45;
    --rule:#3A2E23;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;margin:0;
    position:fixed;inset:0;width:100%;
    overflow:hidden;overscroll-behavior:none;
    /* sin zoom por doble toque: el tamano se cambia con A- / A+ */
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Lectura",-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    transition:background .3s ease,color .3s ease;
  }
  #app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}

  /* ---- header ---- */
  header{
    padding:8px 8px 8px 6px;
    display:flex;align-items:center;gap:2px;
    border-bottom:1px solid var(--rule);
  }
  .titles{flex:1;min-width:0;padding:0 8px}
  .book{
    font:500 13px/1.25 var(--ui);color:var(--brass);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chap{
    font:500 15.5px/1.3 var(--ui);color:var(--ink);margin-top:1px;
    display:flex;align-items:baseline;min-width:0;
  }
  .chap > #hChap{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chap > .count{flex:none;white-space:nowrap}
  button{
    font:600 13px/1 var(--ui);
    color:var(--ink);background:transparent;
    border:1px solid var(--rule);border-radius:9px;
    padding:9px 11px;cursor:pointer;
  }
  button:active{background:var(--panel)}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  /* los controles de la cabecera no llevan caja: el borde aparece solo al activarse */
  .icon{
    min-width:40px;min-height:40px;padding:8px;
    border:1px solid transparent;border-radius:10px;
    color:var(--dim);text-align:center;font-size:15px;
    transition:color .15s ease,background .15s ease;
  }
  .icon:active{background:var(--panel);color:var(--ink)}
  @media (hover:hover){ .icon:hover{color:var(--ink)} }
  .icon svg{display:block;margin:0 auto}
  .grp-nav{display:flex;gap:2px;margin-right:2px}
  .grp-tools{display:flex;gap:2px;align-items:center}
  .grp-tools::before{
    content:"";width:1px;height:20px;background:var(--rule);margin:0 6px 0 2px;
  }

  /* ---- reading stage ---- */
  #stage{flex:1;position:relative;overflow:hidden;touch-action:none}
  #viewport{position:absolute;inset:0;padding:22px 20px 14px;overflow:hidden}
  #flow{
    height:100%;
    column-fill:auto;
    font-size:var(--size);
    line-height:var(--lh);
    will-change:transform;
    /* la transicion la pone el JS: durante el arrastre la pagina sigue
       al dedo y no debe animar; al soltar, si */
  }
  #flow h2{
    font-size:1.3em;line-height:1.24;font-weight:700;letter-spacing:-.005em;margin:0 0 .1em;
    break-after:avoid;
  }
  #flow .num{
    display:block;
    font:600 .6em/1 var(--ui);
    letter-spacing:.04em;color:var(--brass);margin-bottom:.55em;
  }
  #flow h2 + p{margin-top:.6em}
  #flow p{margin:0 0 1em;orphans:2;widows:2}
  #flow .rule{
    border:0;border-top:1px solid var(--rule);
    margin:1.4em 0;break-inside:avoid;
  }
  /* glossary word */
  .w{
    color:var(--ink);font-weight:700;
    border-bottom:2px dotted var(--brass);
    cursor:pointer;
    /* si un término de dos palabras cae en el salto de línea, el subrayado
       se dibuja completo en los dos trozos en vez de quedar cortado */
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .w.on{background:var(--brass);color:var(--bg);border-bottom-color:transparent;border-radius:3px}
  strong{font-weight:700}
  em{font-style:italic}
  #flow p em:only-child{color:var(--dim);font-size:.94em}

  /* readers + bookmark */
  .icon.on{border-color:var(--brass);color:var(--brass)}
  #btnMark.on svg{fill:var(--brass)}
  .mark{
    font:600 12px/1.4 var(--ui);
    color:var(--dim);margin-top:8px;
  }
  .mark b{color:var(--brass)}
  .mark svg,.item .n svg{width:13px;height:13px;vertical-align:-2px;fill:currentColor}
  .item.bm{color:var(--brass)}
  .item.bm .n{color:var(--brass)}
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
    z-index:20;background:var(--panel);border:1px solid var(--brass);
    color:var(--ink);border-radius:99px;padding:11px 20px;
    font:600 14px/1 var(--ui);
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* tablet / desktop */
  @media (min-width:760px){
    #app{max-width:1180px}
    header{padding:14px 28px;gap:4px}
    header .book{font-size:14px}
    header .chap{font-size:19px}
    .titles{padding:0 18px}
    button{font-size:14px;padding:11px 14px;border-radius:10px}
    .icon{min-width:46px;min-height:46px;font-size:16px}
    .grp-tools::before{height:24px;margin:0 10px 0 4px}
    #viewport{padding:34px 40px 18px}
    .home-in{padding:34px 40px 60px;max-width:1180px}
    .lede{font-size:30px}
    #shelf{gap:28px 22px;grid-template-columns:repeat(3,1fr)}

    box-shadow:0 -6px 34px rgba(0,0,0,.55);

    display:none;

  #gloss::before{
    content:"";display:block;width:34px;height:3px;border-radius:2px;
    background:var(--rule);margin:0 auto 10px;
  }
  #gloss.in{animation:glossIn .18s cubic-bezier(.2,.8,.3,1) both}
  @keyframes glossIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#gloss.in{animation:none}}

  #gloss span{display:block;font-size:16px;line-height:1.45}
  #gloss .en::before,#gloss .es::before{
    font:700 9px/1 var(--ui);
    letter-spacing:.14em;color:var(--dim);
    display:inline-block;width:22px;vertical-align:2px;
  }
  #gloss .en::before{content:"EN"}
  #gloss .es::before{content:"ES"}
  #gloss .es{
    color:var(--dim);margin-top:7px;padding-top:7px;
    border-top:1px solid var(--rule);
  }

  /* ---- sin pie: barra de avance fina al borde del escenario ---- */
  .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rule);z-index:5}
  .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .26s ease}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* el glosario sube para no tapar la barra */
  #gloss{bottom:10px}

  /* ---- contents panel ---- */
  #toc{
    position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);

  }
  .item{
    display:flex;gap:12px;align-items:baseline;width:100%;
    text-align:left;border:0;border-bottom:1px solid var(--rule);
    border-radius:0;padding:14px 8px;font:400 17px/1.35 var(--ui);
  }
  .item .n{
    font:700 12px/1 var(--ui);
    color:var(--dim);min-width:22px;
  }
  .item.cur{color:var(--brass)}

  /* ---- library home ---- */
  #home{
    position:fixed;inset:0;z-index:12;background:var(--bg);
    display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;
  }
  #home.open{display:block}
  /* barra superior: el nombre y quién lee, en una sola línea */

    display:flex;align-items:center;gap:12px;
    max-width:820px;margin:0 auto;padding:16px 22px 0;
  }
  .wordmark{
    flex:1;min-width:0;
    font:500 16px/1 var(--ui);color:var(--brass);
  }
  .home-in{max-width:820px;margin:0 auto;padding:18px 22px 46px}
  .lede{
    font-size:23px;line-height:1.28;margin:0 0 18px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
  }
  /* la repisa es una grilla de tapas grandes: la ilustracion es lo que se ve */
  #shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px}
  .card{

  .cover{

    background:var(--cloth,#333);

  }
  .cover svg{display:block;width:100%;height:100%}
  /* lomo y canto: la ilusion de un libro de tapa dura */
  .cover::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:

  }
  .card .by{

  .cardbar{height:3px;background:var(--rule);margin-top:8px;border-radius:2px;overflow:hidden}

  .hint{
    font:400 14px/1.55 var(--ui);color:var(--dim);

  }
  .reset{
    font:500 12.5px/1 var(--ui);color:var(--dim);opacity:.75;
    border:0;padding:12px 0;margin-top:0;
  }
</style>

chapters:[
{t:"My First Home", x:`The first place I remember was a **meadow** with a pond of clear water and tall trees. On one side there was a field, and on the other the house of my master, Farmer Grey.

In the day I ran with my mother. At night I lay close to her. Six other young **colts** lived there, and we played together.

One day my mother **whinnied** to me. She said the other colts had no **manners**, but I was **well-bred**, and I must grow up gentle and good. 'Do your work well,' she said, 'and never bite or kick.'

I never forgot her **advice**.`},
{t:"The Hunt", x:`One day, before I was two, we heard dogs. My mother said they could smell a **hare**. The poor hare ran to the fence, and then we heard a scream, and she was dead.

Near the **brook** lay a horse and a **rider**. My mother told me the man's neck was broken. He was George Gordon, the **squire**'s only son. The horse could not be helped; there was a **bang** from a gun, and it did not move again.

A few days later the church bells rang, and the men carried George Gordon to the **churchyard**. A young man and a beautiful horse were dead — all because of one small hare.`},
{t:"My Breaking-in", x:`I grew tall and handsome. My coat was black and shining, I had one white foot and a white star on my head. When I was four, Squire Gordon decided to buy me, and Farmer Grey began my **breaking-in**.

Breaking in means learning to wear a **saddle** and a **bridle**, and to carry a person on your back. You must never speak to other horses, or bite, or kick. You must always do what your master says.

I hated the **bit**. It was cold, like a metal finger between my teeth. The saddle was not so bad. The iron shoes were **stiff** and heavy on my feet, but in time I got used to them all.

My mother told me again: there are good men and bad men, and I must always do my best.`},
{t:"Birtwick Park", x:`Early in May a man took me to Squire Gordon's home near the village of Birtwick. My **stable** was large and comfortable. Next to me was a fat little grey **pony** called Merrylegs. He hoped I was good-tempered, because he did not like horses that **bite**.

In the same stable there was a tall **chestnut** mare called Ginger. Merrylegs told me she had bitten James, the **groom**. Nobody had ever been kind to her. But here James and John Manly were good to us, and Squire Gordon did not **whip** his horses.

The next morning John took me for a ride. When we came back, Mrs Gordon looked at me and said, 'He's a beauty. Let's call him Black Beauty.' The Squire said it was a very good name.

Soon I was great friends with Merrylegs, and I **got on well** with Ginger too. Every Sunday in summer we were free in the old **orchard**. We **galloped**, we **rolled** on our backs, we ate the sweet grass, and we stood under the big chestnut tree and told stories. I was very happy.`},
{t:"Ginger's Story", x:`One day Ginger told me about her life. A hard man called Samson had tried to break her in. He gave her a new **kind** of bit that was very **painful**, so she kicked him. He got angry and began to whip her, and in the end she threw him on the ground.

Later a **gentleman** in London bought her and made her wear a **short rein**, which she hated. She bit him, and he hit her on the head with a whip. Another master was just like Samson.

'I decided that men were my **enemies**,' she said.

I **felt sorry for** her. But week by week, at Birtwick, she became gentler and more **cheerful**. One day the Squire asked her how she was, and she put her nose up to him to be friendly.

The Gordons were kind to everybody — to people, and to horses, dogs, cows and birds.`},
{t:"A Stormy Day", x:`One day in autumn Squire Gordon went on a long journey. John came too, and I pulled the **cart**. The weather was rainy and windy. At the **tollgate** the man told us the river was **rising** fast and there would be a bad storm.

We came home late. The wind was **blowing**, and suddenly we heard a **crack** — a huge tree fell across the road. I stopped still. I was **shaking** with fear, but I did not turn or run away.

We took the long road to the wooden bridge. It was nearly dark. There was water on the middle of the bridge, but the Squire did not stop. As soon as my feet touched it, I knew something was wrong, and I **stopped dead**. John got down and tried to lead me forward. I would not move.

Then the tollgate man shouted from the other side: the bridge was broken in the middle, and if we went on we would all **drown**.

We turned back. For a long time nobody spoke. Then John said that I had saved their lives. That night I had good food and a comfortable bed of **straw**, and I was very **glad**, because I was very tired.`},
{t:"The Fire", x:`One evening we stopped at a big hotel. In the stable a man called Towler had a **pipe** in his mouth. The stableman told him to put it down before he brought the **hay**. Towler said yes — and left.

In the middle of the night I woke up. Ginger was **coughing**. The stable was full of **smoke** and it was hard to breathe. I was very **frightened**. The stableman came in with a light and tried to **drag** us out, but we were too afraid to move, and he left.

Then I saw a red light dancing on the wall, and I heard men shouting 'Fire!' There was a terrible **roaring** noise.

Then I heard James. His voice was calm and cheerful. He tied his scarf over my eyes and led me out of the stable and out of danger. Then he ran back inside. I gave a loud whinny, and Ginger told me later that my voice gave her the **courage** to come out.

Two horses **burned to death** that night. In the morning we heard that Towler was responsible. At Birtwick Park the rule was 'No pipes in the stable' — and it was a very good rule.

Soon after, James got a new job and left us. We were all sad to say goodbye. Little Joe Green, only fourteen and a half, took his place. John said he was young, but a good worker and kind.`},
{t:"Fetching the Doctor", x:`One night John came into the stable calling my name. Mrs Gordon was very ill. 'Now, Beauty, do your best,' he said — and I went as fast as I could.

At the doctor's house, John gave him the note. The doctor's own horse was away, so he rode me back. He was heavier than John and not such a good rider, but I did my best.

At home my legs were shaking and I was wet with sweat. Joe was young, and he forgot to put a warm **blanket** on me. He gave me cold water to drink. Soon my whole body began to shake and I felt very cold.

A long time later John came back. He covered me with warm blankets, brought hot water and warm food, and I slept. I was very sick, and John was **nursing** me night and day. 'Stupid boy!' he said to himself, again and again.

Joe's father told John that Joe was very **upset** and knew it was all his **fault**. John said Joe was not a bad boy — but that horse was special to all of them. The Squire came to see me. 'Poor Beauty,' he said, 'you saved Mrs Gordon's life.'`},
{t:"Leaving Birtwick Park", x:`I lived happily at Birtwick for three years. Then everything changed. Mrs Gordon was ill, and the doctor said she must leave England and live in a warm country.

The Squire sold Ginger and me to an old friend at Earlshall Park. He gave Merrylegs to the **vicar**. All the **servants** were crying when we brought the **carriage** to the door for the last time. At the railway station Mrs Gordon said goodbye to John.

When the train left, John said quietly that we would never see her again, and we drove slowly home. But it was not our home now.`},
{t:"Earlshall", x:`The next morning John took Ginger and me to Earlshall Park. He told our new groom, Mr York, that we liked a long rein. Mr York answered that here they used a **short rein**, because his lady wanted her horses to hold their heads high.

John came to **pat** us and speak to us for the last time. His voice was very sad. I put my face up to him to say goodbye, and then he left.

That afternoon the lady of the house came out and looked at us and said nothing. It was the first time I wore a short rein, and it was very uncomfortable. The next day she said our heads must be higher still. We had to pull the carriage up a huge hill with our heads up. It hurt my back and my legs.

Every day the reins got shorter. One day Mr York fixed them very **tight**. Ginger **reared up**, kicked, and fell down with a **sore** leg. They never put her in the carriage again.

I wore that short rein for four long months. My neck and chest hurt, my mouth and tongue were sore, and I felt tired and **miserable**. At Birtwick I always felt that John and Squire Gordon were my friends. Here I had no friends at all.`},
{t:"The Runaway Horse", x:`In spring the Lord and part of the family went to London. The Earl's daughter, Lady Anne, loved to ride. I was her horse, and she named me 'Black Auster'. She was a good rider and a gentle person, and I enjoyed those rides in the cold clear air.

One day she wanted to ride Lizzie, a bright **bay** **mare**. Her cousin Mr Blantyre said Lizzie was too nervous and not safe, but Lady Anne rode her anyway.

We stopped at the doctor's gate. Mr Blantyre went up to the house, and Lady Anne waited outside, **humming** a song. Some horses and colts came out of a field nearby, and one ran into Lizzie's back legs. Lizzie kicked and galloped off down the road. Lady Anne nearly fell, but she **recovered**. I **neighed** loudly for help.

Mr Blantyre came running, jumped on my back, and we **chased** them. We saw them, then lost them, then saw them again. An old man pointed to the **common**. Lady Anne passed in front of us with her hair **loose** and her hat gone. She looked **exhausted**. We were **gaining on** them.

Then Lizzie tried to jump a **ditch** and fell. Lady Anne lay on the ground, white and silent. Mr Blantyre sent a man for the doctor and for the carriage from Earlshall.

Ginger brought the carriage. Later she told me that the doctor **poured** something into the lady's mouth and said, 'She is not dead.'

Two days later Mr Blantyre patted me and told Lord George that he thought I had known Lady Anne was in danger. She was better, and she would ride again soon. I was happy to hear it.`},
{t:"Reuben Smith", x:`When Mr York was in London, Reuben Smith was **in charge of** the stables. He was gentle and very good with horses, and everybody liked him. But he had one big problem: he loved **alcohol**.

One day Smith drove to the railway station, then took me to the White Lion hotel. He said he would come back at four o'clock. It was nearly nine when he returned. A **nail** in one of my front shoes was coming out, and the groom offered to fix it. 'No,' said Smith, 'leave it. I need to get home.' He spoke loudly and strangely, and seemed to be in a very bad temper.

We galloped along the road. It was dark and the road was **stony**. My shoe got **looser**, and at last it fell off. Smith was too **drunk** to notice. He hit me with his whip and shouted at me to go faster. The stones cut my foot and the pain was terrible. Suddenly I fell on my knees, and Smith flew off onto the ground.

I stood there in the moonlight, listening for the sound of horses, or **wheels**, or men's **footsteps**. It was a beautiful April night. I thought of the summer nights long ago, when I lay beside my mother in Farmer Grey's green field.

Near midnight men came. I heard Robert from our stables. They looked at Reuben and said his hands were cold — he was dead. Then they saw my cut knees.

'Poor fellow,' said Robert. He led me home very slowly. I **limped** in great pain, and the walk was more than three miles, but he spoke to me in a gentle voice.

The vet came the next day. In the end I got better, but I had no hair on my knees. At the **inquest** the groom at the hotel said Reuben had been drunk when he left, and my shoe was found on the road. So everyone knew that his death was not my fault.`},
{t:"Ruined", x:`When my knees were better they put me in a small field for a month or two. I enjoyed the freedom and the sweet grass, but I was very **lonely**.

One morning the gate opened and Ginger came in. I **trotted** up to her, and she told me her story. Lord George was young and did not look after his horses. He rode her in a race, even though the groom said she was too tired. Her back was **ruined**.

We both knew we were not the same as before. But we were happy to be together. We ate grass, we lay down together, and we stood for hours under the trees with our heads close.

One day the Earl came into the meadow with Mr York and looked at us carefully. He was angry: his old friend's two beautiful horses were ruined. Ginger must rest for a year, and I must be sold because of my knees. York knew a man in Bath who looked after his horses well.

'They're going to take you away,' said Ginger, 'and I am going to lose my only friend. It's a hard life.'

About a week later Robert led me away. Ginger neighed to me, and I neighed back. She trotted along by the hedge and called to me as I left.

My new stable was not as nice as the last one, but the food was good. My master had many horses and carriages **for rent**. Sometimes we had bad drivers who went too fast and whipped us. But one morning a quiet, gentle gentleman drove me, and it felt like old times. He liked me very much, and a friend of his wanted a good riding horse. So in the summer Mr Barry bought me.`},
{t:"A Thief", x:`Mr Barry lived in Bath and was a businessman. His doctor had told him to take exercise. He knew very little about horses, but he treated me well and told his groom, Filcher, to give me the best food with plenty of **oats**.

For a few days everything was fine. But Filcher kept chickens and rabbits, and after a while there were no oats in my food. I began to feel **weak** and sick.

One afternoon Mr Barry took me to see a farmer friend. The farmer knew a lot about horses. 'Barry,' he said, 'your horse does not look very well.' Mr Barry said his groom told him horses are always weak in autumn. 'Autumn, rubbish!' said the farmer. 'Why, this is August. What do you **feed** him?'

Then he touched me and said: someone was taking food from my master's horse.

I knew where the oats went. Every morning Filcher came with a little boy who carried a basket, and the boy filled it with oats and left. A few mornings later a policeman walked in holding the child. The boy pointed at me and nodded his head. Filcher went to **prison** for two months.

After that Mr Barry decided to **give up** keeping a horse. So I went to the **horse fair** again.`},
{t:"A Horse Fair", x:`A horse fair is an interesting place. There are young horses from the country, little Welsh ponies like Merrylegs, and many beautiful horses. But there were also poor thin horses, **worn out** from hard work. I was very sad to see them.

A man with a gentle voice and kind grey eyes **offered** twenty-three pounds for me. The salesman **refused**, and the man walked away. Then a man with a loud voice came, and I was afraid he would buy me — but he walked off too.

Then the grey-eyed man came back. 'I'll give twenty-four for him.'

'Done,' said the salesman. 'He's a quality horse, and for **cab** work he's a **bargain**.'

Half an hour later we **set off** for London. We came into the great city, then into a **narrow** street with old houses on one side and stables on the other. My new owner stopped and **whistled**. A young woman came out with a little girl and boy.

'Is he gentle, father?'

'Yes, Dolly, as gentle as a **kitten**; you can pat him.'

Dolly patted my shoulder **without fear**. It felt so good. They gave me a clean stable with plenty of dry straw, and after a good meal I lay down thinking: I am going to be very happy here.`},
{t:"A London Cab Horse", x:`My new master was Jeremiah Barker, but everyone called him Jerry. His wife was Polly, and their children were Harry and Dolly. They were a very happy family. Jerry had a cab and two horses; the other was a tall white horse called Captain.

Dolly asked if they could call me 'Jack', after the old horse. And so I became Jack, the London cab horse.

The first week was very hard. The noise, the people and the traffic frightened me. But Jerry was a very good driver, and that helped a lot. He soon found that I was ready to work hard, and he never whipped me. He kept us clean and gave us as much food as we wanted. And best of all, we **had Sundays off**.`},
{t:"Poor Ginger", x:`One day our cab was waiting outside a park when a dirty old cab stopped beside us. The horse was an old chestnut, thin and tired. She looked at me and said, 'Black Beauty, is that you?'

It was Ginger — but how different she was! She was **miserable** and had a bad cough.

She had rested for a year, and for a while she got on well with a new master. Then, after a long gallop, her old back problem returned. She was bought and sold several times. At last a man with many cabs bought her, and now she worked all week with no rest on Sundays.

'I wish I was dead,' she said.

I did not know what to say. I put my nose up to hers. 'Black Beauty, you are my only friend,' she said. Then her driver came back and they drove off.

A short time later I saw a cart with a dead horse in it — a chestnut with a long thin neck. I think it was Ginger. I hope so, because then all her problems were over.

One day a lady got into our cab: Mrs Fowler, who Polly had once worked for. She asked Jerry about the cab work in winter. He said it had been a hard winter and he had had a bad cough. Mrs Fowler said she knew people who wanted good drivers or grooms — if he ever stopped cab work, he should tell her.`},
{t:"Jerry's New Year", x:`Christmas and New Year are fun for many people, but not for cab drivers and their horses. There are many parties, and we had to work hard and late. Sometimes the driver and his horse wait for hours in the cold while the people inside eat and dance.

That Christmas week Jerry had a bad cough. One evening, when we got home, he could not speak. The doctor came and said it was serious.

Jerry was ill for three days. Harry looked after me, but he did not sing or laugh as usual. On the third day Jerry began to get better — but the doctor said he must never work on the cab again.

Then Dolly ran into the stable with **wonderful** news: Mrs Fowler said they could live near her in the country. There was a **cottage** with a garden and apple trees. Mother was laughing and crying, and father looked very happy.

So the Barkers sold the cab and the horses and moved to the country. It was sad news for me — my life with Jerry had been a happy one. But they **promised** to find a good place for me.`},
{t:"Hard Times", x:`Jerry sold me to a **baker** he knew. The food was good, but I often carried very heavy **loads**. In the end they bought a younger horse and sold me to a cab owner.

My new master, Nicholas Skinner, was horrible. He had black eyes and a large nose. His horses had no rest on Sundays, even in summer in the hot city.

Still, I did my best. But my life was now so bad that I wanted to die — and one day my wish nearly came true.

We **collected** a family from the railway station. My driver put case after case on top of the cab. The load was very heavy, and I was hungry and tired. I did my best, but I was **exhausted**, and I fell to the ground. I really thought I was going to die.

The vet examined me. 'This horse is not ill,' he said. 'He is simply exhausted from **overwork**. Give him a rest for six months and he'll be fine.'

Skinner said that if I could not work, he had to sell me. So twelve days later they took me to the horse fair. I held my head high and hoped for the best.`},
{t:"Farmer Thoroughgood and his Grandson Willie", x:`This time they put me with the old worn-out horses.

I noticed a man who looked like a farmer, with a young boy beside him. The man had a **broad** back, a kind red face, and a big hat. His eye rested on me. I still had a good **mane** and tail, so I was not bad-looking. I **pricked up** my ears and looked at him.

'Look at this horse, Willie,' he said.

'Poor old fellow!' said the boy. 'You can see he's a **well-bred** horse.' He put out his hand and gave me a kind pat on the face.

'What is the **lowest** price you will take for him?'

'Five pounds, sir.'

And so Farmer Thoroughgood bought me for five pounds.

On his farm I had good food morning and night, and a meadow with a shed in one corner. Willie visited me every day, often with a carrot. He spoke to me kindly and patted me, and I **was very fond of** him.

The rest, the good food, the soft grass and the gentle exercise soon began to improve me. During the winter my legs got much better and I began to feel young again.

'Oh, grandpa,' said Willie one day, 'I am so glad you bought him!'

'So am I,' said the farmer. 'But now we must look for a nice quiet place for him, a place where everyone is going to love him.'`},
{t:"My Last Home", x:`One day the groom cleaned and dressed me very carefully, so that I looked **smart** and handsome. Willie and his grandfather took me to a pretty house with a **lawn** at the front.

Farmer Thoroughgood went inside and came back with three ladies. The youngest, Miss Ellen, liked me at once. 'He has such a beautiful face! I'm sure I'll like him.'

'Try him,' said the farmer. 'If you don't like him, send him back after six months.'

In the morning a smart young man came for me. At first he looked pleased, but when he saw my knees he said he was surprised the ladies wanted a **damaged** horse. 'Looks aren't everything, young man,' said Farmer Thoroughgood. 'This is a very good horse.'

So the young man led me to my new home and left me in a comfortable stable. The next day my new groom came in. While he was cleaning my face, he said:

'This is just like the star that Black Beauty had. He's about the same **height**, and has one white foot too. It must be Black Beauty! Why, Beauty! Do you remember me? Little Joe Green, that almost killed you?'

I did not remember him, because he was now a man with a **beard** and a man's voice. But I was sure he knew me, and I was glad to see him. I put my nose up to him to say that we were friends. He looked very pleased.

'My old Beauty! I wish John Manly was here to see you.'

In the afternoon Joe and Miss Ellen took me out with the cart. She was a good driver, and Joe told her all about me: he was sure I was Squire Gordon's old Black Beauty.

I have now lived in this happy place a whole year. Joe is the best and kindest of grooms. My work is easy and **pleasant**, and I feel strong and healthy again. Willie always visits me, and treats me as his special friend. My ladies have said they are never going to sell me.

So here my story ends. I am at home here. Often, before I wake up, I dream that I am still in the orchard at Birtwick Park, with my old friends Ginger and Merrylegs, and we are all together under the big chestnut tree.`}
]},
{
id:"ot", lang:"en", title:"Oliver Twist", author:"Charles Dickens", voice:"London, in the time of the workhouses",
chapters:[
{t:"Oliver enters the world", x:`Oliver Twist was born in a **workhouse**. The only people there were an old nurse and a doctor, and neither of them really cared about him.

His mother had arrived the night before. She asked to see her baby, and then she died. Nobody knew her name or where she came from — but the doctor **noticed** that she wore no wedding ring on her finger.

Oliver was an **orphan**, completely alone, so he was sent to an **orphanage**, where there was little food and no love. By the age of nine he was small, pale and thin, but he had a strong spirit. The **housekeeper** was **cruel** and hard: she often **beat** him and locked him up, usually because he said he was hungry.

One day Mr Bumble, the head of the workhouse, came to collect him. Oliver was nine now, too old for the orphanage, so he had to move to the workhouse.

There Mr Bumble took him to meet the **Board** — nine or ten fat gentlemen sitting round a table. They told him he must be **grateful** for the **charity** of the town, pray for the people who **feed** him, and learn a **trade**, starting the next morning. Then he was sent to sleep on a hard cold bed in a room full of other boys.

There was even less food in the workhouse than in the orphanage: three bowls of thin soup a day, with an onion twice a week and half a piece of bread on Sundays. The boys got hungrier and hungrier, until at last they decided that one of them must ask for more. They **drew lots**, and the boy chosen was Oliver Twist.

That evening the master served the soup, and soon there was no more. Oliver **rose** from the table, walked up to the master, held up his **bowl** and said:

'Please, sir, I want some more.'

The master turned pale. The other boys **froze** with fear. Oliver repeated his words. The master hit him on the head with the serving spoon and called Mr Bumble, who **rushed in** to the Board's meeting.

'Oliver Twist has asked for more!'

'For more?' said the gentleman in the high chair. 'The boy is an ungrateful **criminal** and he must leave the workhouse!'

They locked Oliver in a dark, solitary room for a whole week, crying all day and having **nightmares** all night.`},
{t:"Oliver gets a job", x:`Mr Bumble **bumped into** Mr Sowerberry, the **undertaker**, and offered five pounds to anyone who would take Oliver as an **apprentice**. The undertaker decided to take the boy himself.

Mrs Sowerberry gave Oliver some old meat and showed him his bed — on the floor of the shop, surrounded by **coffins**. He felt very sad that night.

Early next morning a voice woke him: Noah Claypole, another poor boy who worked for Mr Sowerberry. Noah was delighted to have someone smaller than himself to give orders to.

Then Mr Sowerberry had an idea. Oliver was good-looking and always looked sad, so he would be perfect at funerals. Dressed all in black, Oliver led many **mournful** processions. Noah became **jealous** and meaner than before, and Mrs Sowerberry disliked Oliver because her husband liked him.

One evening Noah started saying bad things about Oliver's mother. Oliver grew red with anger and hit him hard. Noah shouted for help, and they locked Oliver in the **cellar**.

The next morning Mr Bumble came. 'It's your **fault**, madam,' he told Mrs Sowerberry. 'You gave him too much to eat. And he comes from a bad family — he's just like his mother.' When Oliver heard those words about his mother, he began kicking the door again. They beat him and locked him up again, and sent him to sleep among the coffins, where he **wept bitterly**.

By the light of a candle, Oliver tied a few clothes into a large **handkerchief**. As soon as the first **rays** of sunlight came through the window, he unlocked the door and escaped into the street.`},
{t:"Oliver makes new friends", x:`Oliver **set off** in the direction of London: nobody would find him there. He walked twenty miles, slept in a field, and walked for seven more days, **begging** for food and water. On the seventh day he came into a small town and sat down. His feet were **bleeding** and he was covered in **dirt**.

A boy of about his own age came to talk to him. He was a strange-looking boy: a large hat, a man's coat that reached nearly to his feet. He was only a dirty little boy, but he acted and talked like an adult.

The boy bought Oliver some food. When he heard that Oliver was going to London with nowhere to stay, he said he knew an old gentleman there who would give him a place for nothing. Oliver was thankful. The boy's real name was Jack Dawkins, but his friends called him **the Dodger**.

Late that night they **reached** London. The Dodger led Oliver into a **narrow** smelly street, into a house, and up the stairs to a room at the top. The walls and ceiling were black with age and dirt. A man with an ugly face and dirty red hair was cooking over a fire, and four or five boys sat around a table.

'Fagin,' said the Dodger, 'this is my friend Oliver Twist.'

The man **grinned**, shook Oliver's hand and said they were very glad to meet him. Oliver noticed some handkerchiefs hanging on a **line**. Fagin laughed and said they were going to be washed. Then they all had supper, Fagin gave Oliver a special **nightcap** to drink, and Oliver fell into a deep sleep.`},
{t:"Oliver learns some skills", x:`The next morning Oliver woke early and pretended to be still asleep. He watched Fagin take a small box from a hole in the floor and open it: rings, bracelets, necklaces and a magnificent gold watch.

Fagin looked up and saw him. He closed the **lid** with a crash and stood up, **grabbing** a bread knife. 'Why are you watching me?' Oliver, terrified, said he had only just woken up. Fagin put down the knife and said the pretty things were his, saved for his old age.

Later the Dodger came back with his friend Charley Bates. They gave Fagin two **wallets** and four handkerchiefs, and Fagin said they had done well.

After breakfast Fagin, the Dodger and Charley played a very curious **game**. Fagin put a silver box in one trouser pocket, a wallet in the other, and a watch in his jacket, then walked round the room pretending to look into shop windows. The two boys followed him. Suddenly the Dodger stood on his foot while Charley fell against him — and in that moment they took everything from his pockets, with extraordinary **speed**.

'There, my dear,' Fagin said to Oliver. 'You should follow their example.' He asked Oliver to take the handkerchief from his pocket without him feeling it. Oliver copied the Dodger and pulled it out. 'Clever boy,' said Fagin, **patting** him on the head, and he gave him a **coin**.

A few days later Fagin sent Oliver out to work with the Dodger and Charley. In a small square the Dodger pointed to an elderly gentleman reading at a **bookstall**. 'He'll do,' said Charley.

Oliver watched, **horrified**, as the Dodger put his hand into the old gentleman's pocket and took out a handkerchief, gave it to Charley, and ran away round the corner. In that instant the mystery of the handkerchiefs and the watches and Fagin became clear in Oliver's mind.

Oliver turned and ran. The old gentleman found his handkerchief missing, saw Oliver running, and shouted 'Stop thief!' The Dodger and Charley came out of a **doorway** and shouted 'Stop thief!' too — so everyone believed Oliver was the thief. There was a mad **chase** through the streets. Oliver **tripped**, fell onto the **pavement** and cut his face.

A police officer seized him. Oliver said it was the other two boys, but the officer **dragged** him to the police station and locked him in a **cell**.

The old gentleman followed. 'My name is Brownlow,' he told the officer. 'Two boys robbed me. The boy you have is innocent.' The officer asked Mr Brownlow directly whether this boy had **robbed** him. 'No, he did not.' So the officer said he was **discharging** him.

Little Oliver lay shaking on the ground, his face completely white. Mr Brownlow put him into a **carriage**. 'Quickly,' he said to the driver. 'There is no time to lose.'`},
{t:"The portrait", x:`Oliver woke in a soft bed. Mrs Bedwin, Mr Brownlow's **housekeeper**, was sitting beside him. '**Hush**, my dear,' she said, moving his hair back from his forehead.

He thought his mother had been there with him, but Mrs Bedwin said that was the **fever**. Then he fell asleep again.

Three days later he was still too weak to walk, but he could sit in an armchair. On the wall opposite there was a **portrait** of a young woman. Oliver **stared** at it and said what a beautiful face she had — but her eyes looked so sad, as if she were alive and wanted to speak to him.

Mr Brownlow came in. And at that moment he saw the similarity between Oliver's face and the face in the picture. He called Mrs Bedwin and pointed from the portrait to the boy. Oliver was the living copy of it: the eyes, the head, the mouth — every feature was the same.

The days of Oliver's recovery were happy days. Mr Brownlow bought him new clothes and shoes. One afternoon he took him into his study, full of books, and said he wanted to help him and felt he could trust him — the people he had loved most were all dead, and he did not want to suffer again. He asked Oliver to tell him his story.

Just then Mrs Bedwin brought in a parcel of books to be returned to the bookshop. Oliver offered to take them. Mr Brownlow gave him a **five pound note** to pay what he **owed** the shop, and told him not to forget the **change**.

Oliver went out, and Mr Brownlow waited for him to return.`},
{t:"Missing person", x:`At Fagin's house there was panic: the police had taken Oliver. Bill Sikes, a tall strong man of about thirty-five, **growled** that they must find the boy before he talked to the police. Nancy, a young woman, arrived, and Fagin asked her to help find him. At first she refused, but Fagin insisted.

Meanwhile Oliver was hurrying happily towards the bookshop. Suddenly a young woman grabbed him and threw her arms round his neck. It was Nancy.

'Oh, my dear brother!' she shouted, so that everyone in the street could hear. Oliver **struggled** and asked who she was, but Nancy cried that he was a naughty boy and must come home. Then a big man came out of a shop — Bill Sikes — and told him to come home to his poor mother. Oliver shouted for help, but no one heard him in Sikes' powerful **grip**.

At Fagin's house the boys examined Oliver's fine clothes, and the Dodger found the five pound note in his pocket. Sikes said Fagin could keep the books, but he would take the money. Oliver begged them to send everything back to Mr Brownlow.

'Oh dear, Oliver,' laughed Fagin. 'Now Mr Brownlow thinks you're a thief.'

Oliver ran for the door, but the boys brought him back, and Fagin hit him with a stick. Nancy tried to stop him, but Sikes pushed her away.`},
{t:"The truth about Oliver", x:`Mr Bumble was in London on business. Reading a newspaper by the fire, he saw an **advertisement**: a **reward** of twenty pounds for information about a boy named Oliver Twist, who **went missing** from his home. **Underneath** was Mr Brownlow's address.

Mr Bumble went there immediately. He knew very little, but he said Oliver was an orphan from a bad family — a terrible, ungrateful and violent child.

'I'm afraid you must be right,' said Mr Brownlow sadly, and he paid the reward.

'It can't be true,' said Mrs Bedwin. 'Oliver's a good boy.'

'Silence,' said Mr Brownlow. 'I never want to hear that boy's name again.'`},
{t:"The robbery", x:`For many days Oliver stayed locked up in Fagin's house, among spiders' **webs** and mice, with the **shutters** always closed. Every day the boys played the stealing game, and Fagin told stories about the things he had stolen when he was young — in this way he prepared Oliver's mind to prefer the company of criminals.

Sikes was planning a big robbery and needed a boy who was not too big. Fagin offered Oliver: 'He's one of us now.'

That evening Nancy came to collect him. 'Be careful, Oliver,' said Fagin. 'Bill Sikes is a **rough** man. Whatever happens, say nothing and always do what he tells you.'

At Sikes' house the rules were simple: 'Don't speak a word when you're with me, or I will use this **gun** on you.'

The wind blew and it rained hard as they set out. They walked a long way into the countryside to a dark house, where Toby Crackit, Sikes' partner, was waiting. Later the two men left the house with Oliver between them. The church bell struck two. They came to a big grand house surrounded by a wall, and they all climbed over it.

Suddenly Oliver understood that they were going to steal from the house. He fell to his knees and begged them not to make him steal. 'Get up and be quiet,' said Sikes, trembling with anger, 'or I'll shoot you.'

Crackit opened a small window, large enough for a small boy. Sikes put Oliver through it, feet first. 'One mistake and I'll shoot you dead.'

But Oliver wanted to warn the family. He ran towards the stairs, not the main door. Sikes shouted at him to come back. Oliver saw a light, then two men at the top of the stairs. He heard a loud noise and felt a terrible pain. Confused, he moved back to the window. He heard Sikes call out that they had hit him and he was bleeding. Oliver's heart felt cold, the noises grew confused in the distance, and then he saw and heard no more.`},
{t:"Old Sally's secret", x:`In the workhouse, an old woman called Sally was dying. She asked Mrs Corney, the **mistress** of the workhouse, to come near, and whispered to her.

'In this room I once looked after a pretty young woman. She had a baby boy, and she died shortly after.' Sally's face was **flushed**. 'I **robbed** her. I stole the only thing she had, some gold jewellery. The boy grew to be so like his mother. I could never forget her when I saw his face.'

Before dying, the mother had said she wanted someone to help her child.

'What was the boy's name?' asked Mrs Corney.

'They called him Oliver,' said Sally. 'The gold I stole was...'

Old Sally held Mrs Corney's arm with both hands, then fell back onto the bed. She was dead.`},
{t:"A meeting with Monks", x:`Toby Crackit came back to London to tell Fagin that the robbery had failed: they had escaped across the fields, but Oliver had been shot and left lying in a **ditch**. Crackit did not know whether he was alive or dead.

'But that boy is worth hundreds of pounds to me,' said Fagin angrily.

Then a man's voice whispered in Fagin's ear: Monks. The two men went upstairs and talked **in whispers**. Monks complained that the robbery had been badly planned — why had Fagin not kept the boy and taught him to be a **pickpocket**?

Fagin said Oliver was different from the other boys, and it had not worked. If he was still alive, he could teach him. But if he was dead...

'It's not my fault if he's dead!' said Monks. Then he stopped and looked around. He thought he had seen something — a woman. The two men rushed out, but there was no one there. 'It's your imagination,' said Fagin. They agreed to speak about the boy again when they knew if he was dead or alive.`},
{t:"The wounded thief is looked after", x:`Oliver woke in the ditch and saw that his left arm was covered in blood. In front of him was the house from the robbery. He walked slowly towards it, knocked at the door, and fell down.

A servant recognised him at once and shouted that here was one of the thieves. But a lady's voice from inside said they should bring him in and send for Dr Losberne.

The two ladies who lived there were Mrs Maylie and her niece Miss Rose. When the doctor pulled back the curtains of the bed, they **gasped**: they had expected a rough thief, and instead they saw only a child in a deep sleep.

'Is it really possible that this delicate boy is a terrible thief?' asked Rose.

Oliver slept until evening. Then he told them his story, stopping often because he was so **weak** and in pain. His story was sad, and the doctor let him sleep again.

Rose and Mrs Maylie looked after him well, and gradually he grew strong and healthy. He studied his lessons and played in the garden.

Then one evening Oliver fell asleep while reading and woke suddenly. There at the window, right in front of him, was Fagin — and another man beside him. Their eyes met. In an instant they disappeared. Oliver called for help, and everyone searched, but there were no **footprints**.

'It was a dream, Oliver,' said Dr Losberne.

'No, sir, it wasn't,' said Oliver, trembling. 'I saw them both as clearly as I can see you now.'

The doctor believed him, but there was no sign of anyone. After a few days everyone had forgotten the incident — everyone except Oliver.`},
{t:"Mr Bumble and the stranger", x:`Mr Bumble was now married to Mrs Corney and was master of the workhouse, but they argued all the time. One evening, after another argument, he went to a **public house**. There was one other customer: a tall, dark man in a long **cloak**, who kept looking at him.

At last the stranger said he had seen him before — he was an official at the workhouse, wasn't he? 'I was,' said Mr Bumble, 'but now I'm the master.'

The stranger pushed some money across the table, and Mr Bumble quickly put it in his pocket.

'Let's go back in time to a winter's night, nine or ten years ago,' said the stranger. 'A little boy was born in the workhouse. He went to work for a coffin-maker, and then he ran away to London.'

'You mean Oliver Twist!' said Mr Bumble. 'An **obstinate** young **rascal**.'

The stranger wanted to know about the woman who had looked after Oliver's mother. Old Sally was dead, said Mr Bumble, but his wife had spoken to her before she died.

The man gave him an address near the river: bring your wife tomorrow at nine. 'What name shall I ask for?'

'Monks!' said the man, and walked away quickly.

The next evening it was raining hard when the Bumbles arrived. Mrs Bumble asked for twenty-five pounds in gold before she would speak. Monks paid.

'A young woman had a child. The child was Oliver Twist,' she said. 'The mother asked old Sally to give something to her child. But old Sally stole it. Sally told me this and then she died. In her hand I found a plain gold ring. On the inside of the ring was the name "Agnes".'

Mrs Bumble handed the ring to Monks. He took it and threw it into the river, where it disappeared. 'There! We can all go home. And don't say anything to anyone.'

'Not a word,' said Mr Bumble, and they left.`},
{t:"Nancy's plan", x:`Nancy was at Fagin's house collecting money for Sikes when Monks arrived. Fagin took him upstairs. Nancy silently followed and listened. Fifteen minutes later she came back down, and soon after she hurried home.

That evening Nancy was quiet and pale. Sikes asked her what the matter was. 'Nothing,' she said. Then she waited until he fell asleep, put on her **bonnet** and **cloak**, and hurried out to a small hotel near the park. The clock struck eleven as she went in.

She asked for Miss Rose Maylie. The man at the desk looked at her old clothes, but he let her go upstairs.

'You know Oliver Twist,' Nancy told Rose. 'I am the girl who took little Oliver back to Fagin. Do you know a man named Monks?' Rose had never heard the name. 'He knows you,' said Nancy, 'and he knows you are staying here. Monks is paying Fagin to find Oliver — and to teach him to become a thief. He will murder me if he finds out that I am telling you this.'

Why did Monks want Oliver to become a thief? Nancy repeated the words she had heard: the only **proof** about Oliver and his mother was now at the bottom of the river; Monks had the boy's money; he wanted Oliver in prison, he wanted him dead — he wanted to kill his young brother himself.

'His brother!' said Rose.

Nancy warned Rose that Monks knew she wanted the truth about Oliver, so she must be careful. Then she said she had to get home before anyone noticed.

Rose begged her not to go back — it was too dangerous, and she could find her a safe place. But Nancy said there was a man she could not leave, and she did not want to be the cause of his death. She refused money, too. If Rose needed her, she would walk on London Bridge every Sunday night between eleven and twelve.`},
{t:"New discoveries", x:`The next morning Oliver ran into Rose's room, very excited: he had seen Mr Brownlow, the gentleman who had been so good to him, going into a house, and he had the address.

Rose ordered the carriage and took him there herself. She left Oliver outside and went in to speak to Mr Brownlow. She told him Oliver's story.

'Thank God!' said Mr Brownlow. 'This makes me very happy. But where is he?'

'He is waiting in a carriage at the door.'

Mr Brownlow hurried out, and then called Mrs Bedwin, who was overjoyed to see Oliver again.

Then Rose told Mr Brownlow all about her meeting with Nancy. He said they needed a plan to catch this man Monks, that they needed to speak to Nancy, and that everything must be kept secret — especially from Oliver. Dr Losberne, who was also in London, agreed.

That Sunday night Nancy put on her bonnet and cloak to go out. 'Where are you going at this time of night?' said Sikes. 'I need some air,' she said. 'She's strange these days,' said Sikes. 'Let her go,' said Fagin. 'I can send one of my boys to follow her.'

Just after midnight Rose and Mr Brownlow arrived near London Bridge. Nancy pointed to some steps that led down to the river, because she could not speak in the open — and there was a **shadow** behind the steps.

Mr Brownlow said they intended to find Monks and question him; if they could not find him, she must give them Fagin. 'I will never do that!' said Nancy. 'He is bad, but I will never **betray** him.'

So instead she named the places where Monks could be found and described him: a tall, strong man who always looked over his shoulder when he walked; dark hair and eyes; between twenty-six and twenty-eight, though he looked older; and on his neck a red **mark**.

'A red mark?' said Mr Brownlow. 'I think I know him.'

They offered to send her somewhere safe, and Rose offered money. Nancy refused both. 'I am **chained** to my old life,' she said. 'I have not done this for money. God bless you.'`},
{t:"Fatal consequences", x:`'I've got something to tell you, Bill,' said Fagin, 'and you won't like it.'

One of his boys had followed Nancy. On London Bridge she had met a gentleman and a lady, who asked her for information about Monks. She had described him, told them where the gang met and when — she had told them everything.

'Let me go!' cried Sikes, rushing to the door.

'You won't be too violent, Bill?'

Sikes did not reply. He pulled open the door and ran home.

Nancy was lying on the bed when he came into the room. 'Someone saw you tonight,' he said. 'They heard every word you said.'

'Bill,' cried Nancy, 'stop before you hurt me! I have been true to you. I swear!'

But Sikes hit her again and again, and Nancy fell to the ground, dead.`},
{t:"The meeting with Monks", x:`Two men guarded the door while Mr Brownlow led Monks into a back room.

'What kind of **treatment** is this,' said Monks, 'from my father's oldest friend?'

'Yes, I was your father's oldest friend, and that is why I am treating you with kindness now,' said Mr Brownlow. 'You have a younger **half-brother** called Oliver.'

'I do not have a brother!'

'You both have the same father, but not the same mother.'

Mr Brownlow told the story. Monks was the first child of an unhappy marriage; his parents had **separated**. His father then met a young woman called Agnes and fell in love, and they wanted to marry. Before travelling to Italy, the father visited Mr Brownlow, gave him a **portrait** of Agnes, and told him she was **expecting a child**. He wanted to make a new **will**, leaving some of his money to Agnes and her child. But in Italy he became ill and died. Because he was still legally married when he died, and the new will was never found, Monks and his mother automatically got all the money.

Mr Brownlow had later tried to find Agnes, but her family had already left and no one knew where they were. 'Your brother Oliver came to me by chance. He was weak and **neglected**. I rescued him from a life of crime. Oliver looked like the portrait of Agnes — I still have it hanging in my house. But somebody kidnapped Oliver before I could find out more about his past.'

'You can't **prove** anything against me,' said Monks.

'We shall see,' said Mr Brownlow. 'I know you are mixing with criminals. There was a will, but your mother destroyed it. It **mentioned** this child. You found the child by chance. You went to the place of his birth, you found the proof of his birth and of who his parents were — and then you destroyed that proof. Now Nancy has been murdered and you are in part responsible.'

'It has nothing to do with me,' said Monks. 'It was a **quarrel** between lovers.'

Mr Brownlow told him to admit everything, give everything back to the boy, and then leave. Monks walked up and down the room, thinking, and asked whether it would remain a secret between them. Mr Brownlow said it would.

'Then, yes,' said Monks. 'I agree to your proposal.'`},
{t:"The chase", x:`The situation was bad. Nancy was dead, murdered by Sikes. Fagin was in prison, and so was the Dodger. Only Crackit, Charley Bates and Sikes remained, hiding in an old **warehouse** in a **desolate** place called Jacob's Island.

'Look!' shouted Crackit, pointing to the window. Policemen and a crowd were **gathering** outside. They could hear angry voices and the **tramp** of many feet, shouting 'Murderer!' Then there was loud banging at the door.

'Help!' cried Charley Bates at the top of his voice. 'He's here! Sikes is here!'

Sikes climbed out of a window onto the roof. He had a **rope** and wanted to lower himself down and escape. But he slipped and fell, and the rope became tight around his neck. The further he fell, the tighter it became. Then his body became **still**.`},
{t:"Oliver learns more", x:`A few days later Mr Brownlow arranged a meeting between Oliver and Monks.

'This, Oliver, is your brother, Monks.'

Oliver stared in **astonishment**. Monks looked at him with hate in his eyes. Mr Brownlow put his arm around Oliver and told Monks that this boy was the **illegitimate** son of his father and of poor young Agnes, who had died giving birth to him in the workhouse.

'Yes, it is true,' said Monks, and he told them everything. His father had become ill in Italy; they went to say goodbye, but he was too ill to recognise them, and the next day he died. He had two documents with him: a letter to Agnes and his will.

The letter explained everything: Agnes was expecting his child, and it spoke of the ring he had given her, with her name **engraved** on it, and of how they wanted to marry. The will left the money to both mothers and children in equal parts.

'My mother burnt the will,' said Monks. 'She kept the letter and the other **evidence**.' Agnes had left home when the father never returned, and everyone thought she was dead — but his mother believed the child was alive. 'And she was right. I found him and I nearly succeeded in destroying him.'

Mr Brownlow added the rest: Monks had paid Fagin to keep Oliver a prisoner, and it was Monks who had been at the window of Mrs Maylie's house with Fagin — so it had not been Oliver's imagination at all. And the ring? Monks had bought it from Mrs Bumble, who had stolen it from old Sally, who had stolen it from Oliver's mother.

Mr Brownlow suggested dividing the money from the will equally between Oliver and his older brother: he wanted to give Monks the chance to be honest. Oliver agreed. Monks took his money and moved to America.

Mr Brownlow adopted Oliver as his son. They moved, together with Mrs Bedwin, to a house close to Rose and Mrs Maylie's home in the country. Dr Losberne moved into a **cottage** outside the village, and the friends spent lots of time together.

And Mr and Mrs Bumble? They lost their jobs at the workhouse. With no work and no money, they had to go back and accept **charity** from the same workhouse where they had once been master and mistress.

Inside the old village church, Oliver and his new family placed a marble stone with the name Agnes **engraved** on it, in a quiet corner — so that the young woman's spirit could return to enjoy the love of her lost son: Oliver Twist.`}
]}

id:"np", lang:"es", title:"Mi planta de naranja-lima", author:"José Mauro de Vasconcelos", voice:"Guía de lectura en español",
chapters:[
{t:"Cómo usar esta guía", x:`Esto no es la novela: es una **guía de lectura**. Resume, explica y pregunta, pero no reemplaza al libro.

La novela está protegida por derecho de autor, así que aquí no va su texto. Lo que sí encontrarás es un resumen de cada capítulo escrito con otras palabras, quiénes son los personajes, los temas que aparecen y preguntas para repasar.

La forma de usarla: lee el capítulo en tu libro y después revisa aquí el resumen para comprobar que entendiste lo importante. Si lo haces al revés, te pierdes lo mejor, que es cómo lo cuenta Zezé.

Las palabras con puntitos abajo tienen una explicación: tócalas.

La historia transcurre en **Bangú**, un barrio obrero de las afueras de Río de Janeiro, a fines de los años veinte. Está contada en primera persona por un niño de cinco años que va a cumplir seis.`},

{t:"El autor", x:`**José Mauro de Vasconcelos** nació en Bangú, Río de Janeiro, en 1920, y murió en 1984. Hijo de padre portugués y madre indígena, creció pobre, en el mismo barrio donde ocurre la novela.

Fue **autodidacta**: dejó los estudios formales temprano y aprendió por su cuenta. Antes de vivir de la escritura trabajó en oficios muy distintos —fue boxeador, cargador de muelle, pescador, entrenador, actor—, y esa vida de calle está en el modo en que escribe: frases cortas, habla popular, humor y golpe seco.

Publicó *Mi planta de naranja-lima* en 1968. Es su libro más conocido y el más cercano a su propia infancia: Zezé se le parece mucho. Contaba que primero armaba la historia entera en la cabeza y solo después la escribía, muy rápido.

El libro fue traducido a decenas de idiomas y se convirtió en lectura escolar en muchos países.`},

{t:"Los personajes", x:`**Zezé** (José) — el narrador. Tiene cinco años y una imaginación enorme. Aprendió a leer solo, antes de entrar a la escuela. Es cariñoso y también travieso hasta la crueldad: sus "diabluras" le cuestan palizas. Dice de sí mismo que tiene un pajarito cantando adentro.

**Totoca** (Antônio) — el hermano mayor que le "enseña la vida", con paciencia desigual.

**Glória** (Godóia) — la hermana que lo defiende y lo quiere de verdad.

**Jandira** y **Lalá** — las hermanas mayores.

**Luís** — el hermano menor, al que Zezé llama el Rey Luís y cuida como Totoca lo cuida a él.

**El padre** — está sin trabajo, humillado y con rabia. Muchas de las palizas vienen de ahí.

**La madre** — trabaja de noche en la fábrica; casi no está en casa.

**Tío Edmundo** — el viejo que le contesta las preguntas y le regala cosas.

**Minguito** — la planta de naranja-lima del patio, con la que Zezé conversa.

**Luciano** — un murciélago que para todos es una plaga y para Zezé es un amigo.

**Portuga** (don Manuel Valadares) — el portugués dueño del coche más lindo del barrio.

**Doña Cecilia Paim** — la maestra que lo trata con dulzura.`},

{t:"1ª parte · 1. El descubridor de las cosas", x:`Zezé y Totoca caminan de la mano por la calle y el mayor le va "enseñando la vida". Se acerca la Navidad y en la casa no hay dinero para nada.

En la conversación aparece lo esencial del personaje: Zezé aprendió a leer prácticamente solo, sin que nadie se lo enseñara, y eso deja asombrados a los adultos. También aparece su otra cara: es famoso en el barrio por sus travesuras, y todos dan por hecho que tiene el diablo adentro.

El capítulo instala el contraste que sostiene todo el libro: un niño despierto y tierno al que en su casa tratan como un problema. Y anuncia la mudanza a una casa más pobre, porque el padre perdió el empleo.

**Qué mirar:** cómo Zezé explica el mundo con comparaciones propias, y cómo los adultos le hablan de la pobreza sin nombrarla.`},

{t:"1ª parte · 2. Una cierta planta de naranja-lima", x:`En la familia cada hermano mayor cría a uno menor. Al llegar a la casa nueva, los hermanos salen a repartirse el patio: cada uno elige su árbol.

A Zezé le toca lo que sobra: un arbolito flaco, casi un palo, una **naranja-lima** que nadie quiere. Al principio se siente estafado, pero cuando se queda solo con él descubre que la planta le habla.

Así nace **Minguito**, el amigo que lo escucha y le contesta. Es el hallazgo central del libro: la imaginación de Zezé no es un adorno, es su manera de sobrevivir. Todo lo que no puede decir en su casa se lo dice al árbol.

**Qué mirar:** que el árbol más despreciado del patio sea justo el que le toca al niño del que todos se quejan.`},

{t:"1ª parte · 3. Los flacos dedos de la pobreza", x:`Zezé le confiesa a tío Edmundo una preocupación que a un adulto le parecería menor y para él es enorme: que al mudarse, **Luciano** —el murciélago— no venga con ellos.

El capítulo muestra la pobreza sin discursos, en los detalles: la ropa, la comida que no alcanza, los juguetes que no llegan, la vergüenza. Aparece la ilusión de un regalo del dueño de la fábrica y la promesa de Zezé: cuando sea grande le va a comprar a alguien un coche lindo, como el de don Manuel Valadares.

Es la primera vez que se nombra al portugués, mucho antes de que se conozcan. También aparece el tren **Mangaratiba**, al que los chicos saludan desde la estación. Los dos elementos vuelven al final del libro.

**Qué mirar:** el título. La pobreza no golpea de frente; toca con dedos flacos, todo el tiempo.`},

{t:"1ª parte · 4. El pajarito, la escuela y la flor", x:`Casa nueva, vida nueva. Zezé empieza la escuela antes de tiempo y le va bien: es despierto, se porta mejor de lo que todos temían y se gana a su maestra.

Cada mañana pone una flor en el escritorio de doña Cecilia Paim. Ella descubre de dónde sale la flor y entiende, sin humillarlo, lo que ese gesto significa. Es uno de los pocos adultos del libro que lo trata con delicadeza.

Aquí Zezé explica también la imagen del pajarito que canta dentro de su pecho: así llama a las ganas de vivir.

**Qué mirar:** fuera de su casa, Zezé es un buen alumno y un niño querible. El problema no es el niño.`},

{t:"1ª parte · 5. En una celda he de verte morir", x:`Con los días de la semana aprendidos, Zezé sabe cuándo "él" viene: el martes, el día del cantor callejero cuyas canciones reparte y aprende.

Pero el capítulo se llama así por otra cosa: por la frase que los adultos le repiten cuando hace una de las suyas. Le anuncian la cárcel, el mal fin, el castigo. Se lo dicen a un niño de cinco años.

Las travesuras de Zezé son reales y a veces feas, pero la respuesta de la casa es siempre la misma: golpes. La primera parte termina con la sensación de que en ese hogar no hay lugar donde el cariño y el castigo no estén mezclados.

**Qué mirar:** cómo el libro sostiene las dos cosas a la vez sin elegir. Zezé es malo y es bueno; su familia lo quiere y le pega.`},

{t:"2ª parte · 1. El “murciélago”", x:`Empieza la segunda parte con el juego más peligroso del barrio: colgarse de la parte de atrás de los autos en marcha, agachado, para que el chofer no vea. A eso los chicos le dicen hacer el **murciélago**.

Zezé se jacta con Minguito de que nadie se atreve con el coche del Portugués. Y lo hace: se cuelga del auto más lindo de Bangú.

Don Manuel Valadares lo descubre y le da su merecido delante de todos. Zezé lo odia, planea vengarse y lo insulta. Así, de la peor manera posible, empieza la amistad más importante del libro.

**Qué mirar:** que el encuentro nazca de un castigo. El Portugués es el primer adulto que lo corrige sin humillarlo del todo.`},

{t:"2ª parte · 2. La conquista", x:`Durante unos días Zezé evita al Portugués: sale más temprano, camina pegado a la orilla de la calle, se esconde.

Pero un accidente cambia todo. Zezé se lastima un pie y es Manuel Valadares quien lo levanta, lo atiende y lo lleva. Ahí se rompe el hielo.

De a poco se arma un acuerdo entre los dos: se juntan a escondidas, conversan, el hombre le da de comer, le presta atención, le pregunta cosas. Zezé consigue permiso para llamarlo **Portuga**, y él lo llama por su nombre.

Por primera vez un adulto lo escucha sin apurarse y sin levantar la mano.

**Qué mirar:** el título. La conquista no es de Zezé sobre el Portugués, ni al revés: los dos se ganan de a poco.`},

{t:"2ª parte · 3. Conversaciones de aquí y allá", x:`Zezé investiga a su amigo como un detective: dónde vive, dónde guarda el coche, qué pájaros tiene. Se lo cuenta todo a Minguito.

El capítulo alterna las conversaciones con el árbol y las conversaciones con Portuga, y en esa alternancia se ve el cambio: Minguito empieza a quedar un paso atrás. El amigo imaginario ya no es el único que lo escucha.

También aparece la ternura del hombre: le compra cosas, le habla de igual a igual, le pregunta por la escuela.

**Qué mirar:** los celos discretos de Minguito. El libro nunca dice "Zezé está creciendo"; lo muestra así.`},

{t:"2ª parte · 4. Dos palizas memorables", x:`El capítulo empieza tranquilo: Zezé aprende a hacer algo con las manos, doblando y pegando papel junto a Totoca.

Y termina con las dos golpizas más duras del libro. La segunda es del padre, y es brutal: Zezé queda días en cama. El motivo, visto de afuera, es mínimo comparado con el castigo.

Es el punto más oscuro de la novela. Lo que el niño registra no es tanto el dolor físico como el descubrimiento de que puede morirse de tristeza.

**Qué mirar:** el libro no convierte al padre en un monstruo. Muestra a un hombre sin trabajo, humillado, que descarga en su hijo lo que no puede con nadie más. Entender eso no es justificarlo.`},

{t:"2ª parte · 5. Suave y extraño pedido", x:`Zezé tarda una semana en recuperarse. En la casa lo tratan tan bien que hasta desconfía.

En este capítulo cambia algo importante: Portuga le propone hacer las cosas en serio, ocuparse de él, sacarlo a pasear, tenerlo como propio. Es un pedido suave y raro, dicho con cuidado, y para Zezé equivale a que alguien lo elija.

Aparece también la idea del paseo en burro durante las vacaciones, la promesa que Zezé va repitiendo feliz por todos lados.

**Qué mirar:** la palabra "hijo" ronda todo el capítulo sin que nadie la diga en voz alta.`},

{t:"2ª parte · 6. De pedazos y pedazos se forma la ternura", x:`Es el capítulo más corto y más tierno: casi todo diálogo entre Zezé y Portuga.

El hombre le cuenta su propia infancia, que no fue feliz: no hablaba con nadie, no andaba a caballo, no tuvo lo que Zezé tiene. Y le dice que no todos los chicos tienen esa suerte.

Ahí se entiende por qué se buscan tanto: los dos están solos, cada uno a su edad. Uno necesita un padre y el otro un hijo, y se lo dan sin decirlo.

El título explica el método del libro entero: la ternura no llega de golpe, se arma de pedacitos.

**Qué mirar:** la conversación es casi toda en preguntas y respuestas cortas. Léela en voz alta y se nota.`},

{t:"2ª parte · 7. El Mangaratiba", x:`En clase, doña Cecilia pide una frase inventada y Zezé se anima. Escribe algo sobre su amigo y sale del colegio orgulloso, pensando en el paseo en burro de las vacaciones.

De vuelta en la calle, escucha a la gente hablar: el tren **Mangaratiba** chocó un coche. El coche del Portugués.

Don Manuel Valadares está muerto.

Es el golpe del libro. Zezé no llora enseguida: primero no entiende, después se queda vacío. En su cabeza vuelve el día en que el hombre lo dejó hacer el murciélago sobre su auto.

**Qué mirar:** el tren venía anunciándose desde el capítulo 3 de la primera parte. Cuando lo releas, esa mención suena distinta.`},

{t:"2ª parte · 8. Son tantos los viejos árboles", x:`Zezé se enferma de pena. Deja de comer, se apaga. En la casa se asustan y por fin lo tratan con dulzura: el padre lo sienta en sus rodillas, le habla, le promete cosas.

Y Zezé piensa la frase más dura de la novela: ese hombre que lo tiene en brazos no es su padre; su padre murió, lo mató el Mangaratiba.

Al final vuelve al patio. Minguito ya no le habla: se ha vuelto un árbol común, va a dar flores. La infancia se cierra ahí, con las dos pérdidas juntas —el amigo muerto y el amigo imaginario que se calla.

**Qué mirar:** las dos muertes ocurren al mismo tiempo y significan lo mismo. Dejar de oír al árbol es dejar de ser niño.`},

{t:"2ª parte · 9. La confesión final", x:`Un salto de muchos años. El que habla ya no es un niño: es un hombre de cuarenta y ocho años que le escribe a Manuel Valadares.

Le cuenta que a veces todavía se siente aquella criatura y que espera verlo aparecer. Le agradece haberle enseñado la ternura, y le reprocha con dulzura haberle dejado saber tan pronto lo que era el dolor.

Son dos páginas y cierran el libro entero: la novela era esta carta.

**Qué mirar:** todo lo anterior estaba contado en pasado por este adulto. Vuelve al capítulo 1 y verás que la voz siempre fue la de alguien que recuerda.`},

{t:"Los temas", x:`**La pobreza.** No aparece como estadística sino en objetos: un juguete que no llega, unos zapatos, una comida. El título del tercer capítulo la resume: dedos flacos que tocan todo el tiempo.

**La violencia dentro de la familia.** El libro no la esconde ni la explica como algo normal. Muestra el castigo físico y muestra de dónde viene: un padre sin trabajo y sin dignidad. Que se entienda la causa no lo vuelve aceptable, y la novela tampoco lo pretende.

**La imaginación como refugio.** Minguito y Luciano existen porque Zezé necesita que alguien lo escuche.

**La familia elegida.** Portuga es padre por decisión, no por sangre.

**El fin de la infancia.** El libro es la historia de cómo un niño deja de serlo: no por cumplir años, sino por una pérdida.

**La ternura.** Es lo que Zezé aprende y lo único que se lleva.`},

{t:"Preguntas para repasar", x:`**Sobre los hechos**
1. ¿Dónde y en qué época vive Zezé? ¿Qué edad tiene?
2. ¿Por qué la familia se muda de casa?
3. ¿Cómo se reparten los hermanos el patio y qué le toca a Zezé?
4. ¿Quién es Minguito y por qué es tan importante?
5. ¿Quién es Luciano y qué piensa de él el resto de la familia?
6. ¿Cómo se conocen Zezé y el Portugués?
7. ¿Qué es hacer el "murciélago"?
8. ¿Qué le propone Portuga a Zezé después de la paliza?
9. ¿Qué pasa con el Mangaratiba?
10. ¿Qué le ocurre a Minguito al final?
11. ¿Quién habla en el último capítulo y cuántos años tiene?

**Para pensar y escribir**
1. ¿Por qué crees que a Zezé le toca justo el árbol más flaco del patio?
2. El libro dice que Zezé tiene un pajarito que canta adentro. ¿Qué significa eso, y qué le pasa a ese pajarito al final?
3. Compara a los dos padres de Zezé: el de sangre y el elegido. ¿Qué le da cada uno?
4. ¿Por qué el autor pone la muerte de Portuga y el silencio de Minguito casi juntos?
5. ¿Te parece que Zezé es un niño malo? Defiende tu respuesta con hechos del libro.
6. Elige un capítulo y explica por qué su título es el correcto.`}
]}
,
{
id:"aq", lang:"es", title:"Anaconda y otros cuentos", author:"Horacio Quiroga", voice:"Guía de lectura en español",
chapters:[
{t:"Cómo usar esta guía", x:`Esto no es el libro: es una **guía de lectura**. Resume cada cuento con otras palabras, explica los términos difíciles y propone preguntas.

La forma de usarla: lee el cuento en tu libro y después revisa aquí el resumen, para comprobar que entendiste lo importante. Al revés te arruinas el final, y en Quiroga el final es casi todo.

Las palabras con puntitos abajo tienen una explicación: tócalas. Son muchas, porque el libro está lleno de nombres de la selva, de oficios del monte y de bichos que no salen en otros libros.

**Aviso sobre el contenido.** Quiroga no escribe para tranquilizar a nadie. En estos cuentos hay muerte, accidentes, fiebre y locura, contados en seco y sin consuelo. Los nueve últimos son los más duros: tres de ellos (*La lengua*, *El vampiro* y *La mancha hiptálmica*) son cuentos de horror con mutilaciones, cadáveres y narradores que están perdiendo la razón. Están resumidos aquí sin detalles innecesarios, pero conviene saber a qué se entra.

También conviene saber lo otro: casi la mitad del libro es cómica. *Polea loca*, *El divino*, *La crema de chocolate* y *Los cascarudos* son cuentos para reírse. Quien crea que Quiroga solo escribía sobre víboras y muertes, se lleva una sorpresa.`},

{t:"El autor", x:`**Horacio Quiroga** nació en Salto, Uruguay, en 1878, y murió en Buenos Aires en 1937.

Empezó como poeta modernista y dandy: su primer libro fue un poemario, *Los arrecifes de coral* (1901), todavía lleno de adorno. Lo que lo cambió fue el viaje al norte: la selva de **Misiones** y el Chaco. Ahí se fue sacando el ornamento de encima y ganó lo que lo hizo famoso: la frase corta, el dato exacto, el final que golpea.

No fue un escritor de escritorio. Vivió en Misiones, plantó, construyó, destiló carbón, navegó el Paraná en canoas que él mismo armaba, midió terrenos, fracasó en varios negocios. Casi todo lo que cuenta en este libro lo vio o lo hizo. Por eso los cuentos saben cuántos grados hace, cuánto pesa una chapa y cómo se clava una palma en un pantano.

Su vida estuvo marcada por muertes cercanas y accidentes, y eso explica en parte por qué sus cuentos vuelven tanto sobre la muerte.

Es el fundador del cuento moderno en América Latina. Sus libros principales son *Cuentos de amor de locura y de muerte* (1917), *Cuentos de la selva* (1918, los que se leen de chico), *El salvaje* (1920), *Anaconda* (1921), *El desierto* (1924), *Los desterrados* (1926) y *Más allá* (1935).

En 1927 publicó su *Decálogo del perfecto cuentista*, diez reglas para escribir cuentos. La más citada: no empieces a escribir sin saber, desde la primera palabra, a dónde vas. Es exactamente lo que hace él.`},

{t:"El libro", x:`*Anaconda* se publicó en 1921, y con él Quiroga alcanzó gran repercusión en toda América. Los cuentos habían aparecido antes, uno por uno, en revistas de Buenos Aires, escritos entre 1906 y 1919.

Por eso el libro no tiene un solo tema: recorre toda su vida. Están los primeros años en Buenos Aires, el deslumbramiento con el cine, los proyectos agrícolas en el Chaco, los años en Misiones y el regreso a la capital.

**Un detalle importante para la prueba.** La primera edición traía 19 cuentos. Cuando el libro se reeditó años después, Quiroga mismo retiró nueve, todos escritos antes de 1916, con una sola explicación: que los sacaba para darle mayor unidad al volumen. Esta edición los devuelve al final, bajo el título **Cuentos suprimidos**.

Así que el libro tiene dos partes bien distintas:

**Los diez que Quiroga dejó** — *Anaconda*, *El simún*, *Gloria tropical*, *El yaciyateré*, *Los fabricantes de carbón*, *El monte negro*, *En la noche*, *Polea loca*, *Dieta de amor* y *Miss Dorothy Phillips, mi esposa*. Son los maduros.

**Los nueve que sacó** — *El mármol inútil*, *Las rayas*, *La lengua*, *El vampiro*, *La mancha hiptálmica*, *La crema de chocolate*, *Los cascarudos*, *El divino* y *El canto del cisne*. Son más tempranos, más desparejos y más experimentales.

Si tienes que elegir qué leer con cuidado, empieza por los cuatro largos: *Anaconda*, *Los fabricantes de carbón*, *En la noche* y *Miss Dorothy Phillips*.`},

{t:"Anaconda · 1", x:`Es el cuento que da nombre al libro y el más conocido. Tiene once capítulos y está contado desde el lado de las víboras.

**La casa.** En plena selva de Misiones hay un viejo edificio de tablas, deshabitado desde siempre. Una noche de calor sofocante, la **yarará** Lanceolada sale de caza y oye ruidos: golpes de fierro, relinchos, pasos de hombre. Alcanza a atacar una bota enorme y se retira sabiendo que aquello es el prólogo de un drama.
